<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAAKAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #000; color: #fff; }
        .navbar { background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #ff7900; font-weight: bold; font-size: 24px; letter-spacing: 1px; }
        .nav-icons i { font-size: 22px; margin-left: 18px; cursor: pointer; color: #fff; }
        .main { max-width: 470px; margin: 20px auto; padding: 0 10px; }
        .post { background: #111; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; }
        .post-header { padding: 12px; color: #ff7900; font-weight: bold; font-size: 14px; }
        .post-box { width: 100%; height: 320px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; }
        .post-footer { padding: 12px; }
        .post-actions { display: flex; margin-bottom: 8px; }
        .post-actions i { font-size: 24px; cursor: pointer; margin-right: 15px; color: #fff; }
        .liked { color: #ff3b30 !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #333; text-align: center; }
        .modal-content h3 { margin-bottom: 15px; color: #ff7900; }
        .modal-content input { width: 100%; margin-bottom: 15px; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; outline: none; }
        .btn-container { display: flex; gap: 10px; }
        .btn { width: 100%; background: #ff7900; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-secondary { background: #333; color: #fff; }
    </style>
</head>
<body>
    <!-- टॉप नेविगेशन बार -->
    <div class="navbar">
        <div class="logo">DHAAKAD</div>
        <div class="nav-icons">
            <i class="fa-solid fa-house" onclick="alert('आप होम पेज पर हैं!')"></i>
            <i class="fa-regular fa-square-plus" onclick="openBox()"></i>
            <i class="fa-regular fa-heart" onclick="alert('नोटिफिकेशन सेक्शन')"></i>
        </div>
    </div>

    <!-- मुख्य फीड -->
    <div class="main" id="feed">
        <div class="post">
            <div class="post-header">DHAAKAD_OFFICIAL</div>
            <div class="post-box">🔥 DHAAKAD Ultimate App</div>
            <div class="post-footer">
                <div class="post-actions">
                    <i class="fa-regular fa-heart" id="likeIcon" onclick="likePost()"></i>
                    <i class="fa-regular fa-comment" onclick="alert('कमेंट सेक्शन जल्द सक्रिय होगा!')"></i>
                </div>
                <p><b><span id="likeCount">1245</span> likes</b></p>
                <p><b>DHAAKAD_OFFICIAL</b> ऐप पूरी तरह से तैयार है!</p>
            </div>
        </div>
    </div>

    <!-- पोस्ट अपलोड करने का बॉक्स (Modal) -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <h3>नई पोस्ट बनाएं</h3>
            <input type="text" id="captionInput" placeholder="कैप्शन लिखें...">
            <div class="btn-container">
                <button class="btn btn-secondary" onclick="closeBox()">रद्द करें</button>
                <button class="btn" onclick="addPost()">पोस्ट करें</button>
            </div>
        </div>
    </div>

    <!-- लॉजिक / जावास्क्रिप्ट -->
    <script>
        function openBox() {
            document.getElementById('myModal').style.display = 'flex';
        }

        function closeBox() {
            document.getElementById('myModal').style.display = 'none';
            document.getElementById('captionInput').value = '';
        }

        function likePost() {
            let icon = document.getElementById('likeIcon');
            let countSpan = document.getElementById('likeCount');
            let count = parseInt(countSpan.innerText);
            
            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'liked');
                countSpan.innerText = count + 1;
            } else {
                icon.classList.remove('fa-solid', 'liked');
                icon.classList.add('fa-regular');
                countSpan.innerText = count - 1;
            }
        }

        function addPost() {
            let text = document.getElementById('captionInput').value;
            if (text.trim() === "") {
                alert("कृपया कुछ लिखिए!");
                return;
            }
            let feed = document.getElementById('feed');
            let newPost = `<div class="post">
                <div class="post-header">DHAAKAD_USER</div>
                <div class="post-box">${text}</div>
                <div class="post-footer"><p><b>DHAAKAD_USER</b> ${text}</p></div>
            </div>`;
            feed.innerHTML = newPost + feed.innerHTML;
            closeBox();
        }
    </script>
</body>
</html>
