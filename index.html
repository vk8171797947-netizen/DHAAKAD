<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHAAKAD - अपना हुनर दिखाओ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial}
header{background:#ff6500;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
header h2{margin:0;color:black}
nav{display:flex;justify-content:space-around;background:#222;padding:12px;position:sticky;top:53px;z-index:5}
button{background:#ff6500;color:#111;border:0;border-radius:7px;padding:10px;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#252525;color:white;border:1px solid #555;border-radius:7px}
main{max-width:600px;margin:auto;padding:12px}
.card{background:#202020;border-radius:12px;padding:12px;margin:12px 0}
video{width:100%;max-height:520px;background:black;border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none}
.orange{color:#ff6500}
</style>
</head>
<body>

<header>
<h2>🔥 DHAAKAD</h2>
<b>अपना हुनर दिखाओ!</b>
<p>CREATE • SHARE • EARN</p>
</header>

<nav>
<button onclick="show('feed')">होम</button>
<button onclick="show('upload')">अपलोड</button>
<button onclick="show('search')">खोजें</button>
<button onclick="show('profile')">प्रोफाइल</button>
</nav>

<main>
<section id="login">
<h3>DHAAKAD में लॉगिन करें</h3>
<input id="email" type="email" placeholder="ईमेल">
<input id="password" type="password" placeholder="पासवर्ड">
<button onclick="register()">रजिस्टर</button>
<button onclick="login()">लॉगिन</button>
<button onclick="logout()">लॉगआउट</button>
<p id="authmsg"></p>
</section>

<section id="feed">
<h3 class="orange">🔥 वीडियो फीड</h3>
<div id="videos"></div>
</section>

<section id="upload" class="hidden">
<h3>अपना वीडियो अपलोड करें</h3>
<input type="file" id="videoFile" accept="video/*">
<textarea id="caption" placeholder="वीडियो के बारे में लिखें"></textarea>
<button onclick="uploadVideo()">वीडियो प्रकाशित करें</button>
<p id="uploadmsg"></p>
</section>

<section id="search" class="hidden">
<h3>यूजर खोजें</h3>
<input id="searchInput" placeholder="ईमेल से खोजें">
<button onclick="searchUsers()">खोजें</button>
<div id="searchResults"></div>
</section>

<section id="profile" class="hidden">
<h3>मेरी प्रोफाइल</h3>
<div id="profileInfo"></div>
<h3>मेरे वीडियो</h3>
<div id="myVideos"></div>
</section>

<section id="notifications" class="hidden">
<h3>🔔 नोटिफिकेशन</h3>
<div id="notificationList"></div>
</section>

<section id="saved" class="hidden">
<h3>सेव किए वीडियो</h3>
<div id="savedVideos"></div>
</section>

<section id="chat" class="hidden">
<h3>मैसेज</h3>
<input id="chatUser" placeholder="दूसरे यूजर की UID">
<div id="messages"></div>
<input id="messageText" placeholder="मैसेज लिखें">
<button onclick="sendMessage()">भेजें</button>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<script>
// अपने Firebase प्रोजेक्ट की वास्तविक जानकारी यहाँ लगाएँ
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 storageBucket: "YOUR_PROJECT.firebasestorage.app",
 messagingSenderId: "YOUR_SENDER_ID",
 appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

let currentUser=null;
let unsubscribeFeed=null;
let unsubscribeMessages=null;

function show(id){
 document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 if(id==='feed') loadVideos();
 if(id==='profile') loadProfile();
 if(id==='notifications') loadNotifications();
 if(id==='saved') loadSaved();
}

function requireLogin(){
 if(!currentUser){alert('पहले लॉगिन करें');return false}
 return true;
}

async function register(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 try{
 const result=await auth.createUserWithEmailAndPassword(email,password);
 await db.collection('Users').doc(result.user.uid).set({
 email:email,
 name:email.split('@')[0],
 followers:[],
 following:[],
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 }catch(e){alert(e.message)}
}

async function login(){
 try{
 await auth.signInWithEmailAndPassword(
 document.getElementById('email').value.trim(),
 document.getElementById('password').value
 );
 }catch(e){alert(e.message)}
}

function logout(){auth.signOut()}

auth.onAuthStateChanged(async user=>{
 currentUser=user;
 document.getElementById('authmsg').textContent=
 user?'लॉगिन सफल: '+user.email:'लॉगिन करें';
 if(user){
 const ref=db.collection('Users').doc(user.uid);
 const snap=await ref.get();
 if(!snap.exists){
 await ref.set({
 email:user.email,name:user.email.split('@')[0],
 followers:[],following:[]
 });
 }
 loadVideos();
 loadProfile();
 }else{
 if(unsubscribeFeed)unsubscribeFeed();
 document.getElementById('videos').innerHTML='';
 }
});

async function uploadVideo(){
 if(!requireLogin())return;
 const file=document.getElementById('videoFile').files[0];
 const caption=document.getElementById('caption').value.trim();
 if(!file){alert('वीडियो चुनें');return}
 if(!file.type.startsWith('video/')){alert('सही वीडियो चुनें');return}
 if(file.size>100*1024*1024){alert('वीडियो 100 MB से छोटा होना चाहिए');return}

 const msg=document.getElementById('uploadmsg');
 try{
 msg.textContent='वीडियो अपलोड हो रहा है...';
 const ref=storage.ref('videos/'+currentUser.uid+'/'+Date.now()+'_'+file.name);
 await ref.put(file);
 const url=await ref.getDownloadURL();

 await db.collection('Videos').add({
 uid:currentUser.uid,
 caption:caption,
 videoUrl:url,
 likes:[],
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });

 msg.textContent='वीडियो सफलतापूर्वक प्रकाशित हुआ!';
 document.getElementById('videoFile').value='';
 document.getElementById('caption').value='';
 loadVideos();
 }catch(e){msg.textContent=e.message}
}

function loadVideos(){
 if(unsubscribeFeed)unsubscribeFeed();
 unsubscribeFeed=db.collection('Videos')
 .orderBy('createdAt','desc')
 .onSnapshot(snapshot=>{
 const box=document.getElementById('videos');
 box.innerHTML='';
 snapshot.forEach(doc=>{
 const v=doc.data();
 const id=doc.id;
 const liked=(v.likes||[]).includes(currentUser?.uid);
 const el=document.createElement('div');
 el.className='card';
 const video=document.createElement('video');
 video.src=v.videoUrl;
 video.controls=true;
 video.playsInline=true;
 video.preload='metadata';
 const caption=document.createElement('p');
 caption.textContent=v.caption||'';
 const owner=document.createElement('p');
 owner.textContent='Creator: '+v.uid;
 const actions=document.createElement('div');
 actions.className='actions';
 actions.innerHTML=`
 <button onclick="likeVideo('${id}')">${liked?'❤️':'🤍'} ${ (v.likes||[]).length}</button>
 <button onclick="commentVideo('${id}')">💬 Comment</button>
 <button onclick="followUser('${v.uid}')">➕ Follow</button>
 <button onclick="saveVideo('${id}')">🔖 Save</button>
 <button onclick="shareVideo('${id}')">↗ Share</button>`;
 const comments=document.createElement('div');
 comments.id='comments-'+id;
 el.append(video,owner,caption,actions,comments);
 box.appendChild(el);
 });
 });
}

async function likeVideo(id){
 if(!requireLogin())return;
 const ref=db.collection('Videos').doc(id);
 await db.runTransaction(async tx=>{
 const snap=await tx.get(ref);
 if(!snap.exists)return;
 let likes=snap.data().likes||[];
 if(likes.includes(currentUser.uid)){
 likes=likes.filter(x=>x!==currentUser.uid);
 }else{
 likes.push(currentUser.uid);
 }
 tx.update(ref,{likes});
 });
}

async function commentVideo(id){
 if(!requireLogin())return;
 const comment=prompt('अपना कमेंट लिखें');
 if(!comment||!comment.trim())return;
 await db.collection('Videos').doc(id)
 .collection('Comments').add({
 uid:currentUser.uid,
 text:comment.trim(),
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 await loadComments(id);
}

async function loadComments(id){
 const box=document.getElementById('comments-'+id);
 if(!box)return;
 const snap=await db.collection('Videos').doc(id)
 .collection('Comments').orderBy('createdAt','desc').limit(20).get();
 box.innerHTML='';
 snap.forEach(doc=>{
 const p=document.createElement('p');
 p.textContent=doc.data().text;
 box.appendChild(p);
 });
}

async function followUser(uid){
 if(!requireLogin())return;
 if(uid===currentUser.uid)return;
 const mine=db.collection('Users').doc(currentUser.uid);
 const other=db.collection('Users').doc(uid);
 await db.runTransaction(async tx=>{
 const a=await tx.get(mine);
 const b=await tx.get(other);
 if(!a.exists||!b.exists)throw Error('यूजर नहीं मिला');
 let following=a.data().following||[];
 let followers=b.data().followers||[];
 if(following.includes(uid)){
 following=following.filter(x=>x!==uid);
 followers=followers.filter(x=>x!==currentUser.uid);
 }else{
 following.push(uid);
 followers.push(currentUser.uid);
 }
 tx.update(mine,{following});
 tx.update(other,{followers});
 });
}

async function saveVideo(id){
 if(!requireLogin())return;
 const ref=db.collection('Users').doc(currentUser.uid);
 const snap=await ref.get();
 let saved=snap.data().saved||[];
 if(saved.includes(id))saved=saved.filter(x=>x!==id);
 else saved.push(id);
 await ref.update({saved});
 alert('सेव की सूची अपडेट हो गई');
}

async function loadSaved(){
 if(!requireLogin())return;
 const snap=await db.collection('Users').doc(currentUser.uid).get();
 const ids=snap.data().saved||[];
 const box=document.getElementById('savedVideos');
 box.innerHTML='';
 for(const id of ids){
 const doc=await db.collection('Videos').doc(id).get();
 if(doc.exists){
 const v=doc.data();
 const el=document.createElement('div');
 el.className='card';
 const video=document.createElement('video');
 video.src=v.videoUrl;
 video.controls=true;
 el.append(video);
 box.append(el);
 }
 }
}

async function shareVideo(id){
 const url=location.origin+location.pathname+'?video='+id;
 if(navigator.share){
 await navigator.share({title:'DHAAKAD Video',url});
 }else{
 await navigator.clipboard.writeText(url);
 alert('लिंक कॉपी हो गया');
 }
}

async function loadProfile(){
 if(!currentUser)return;
 const snap=await db.collection('Users').doc(currentUser.uid).get();
 const u=snap.data()||{};
 document.getElementById('profileInfo').textContent=
 'नाम: '+(u.name||'')+' | Followers: '+(u.followers||[]).length+
 ' | Following: '+(u.following||[]).length+
 ' | UID: '+currentUser.uid;
 const videos=await db.collection('Videos')
 .where('uid','==',currentUser.uid).get();
 const box=document.getElementById('myVideos');
 box.innerHTML='';
 videos.forEach(d=>{
 const v=d.data();
 const el=document.createElement('div');
 el.className='card';
 const video=document.createElement('video');
 video.src=v.videoUrl;
 video.controls=true;
 el.append(video);
 box.append(el);
 });
}

async function searchUsers(){
 if(!requireLogin())return;
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const box=document.getElementById('searchResults');
 box.innerHTML='';
 if(!q)return;
 const snap=await db.collection('Users')
 .where('email','==',q).limit(20).get();
 snap.forEach(d=>{
 const el=document.createElement('div');
 el.className='card';
 const p=document.createElement('p');
 p.textContent=d.data().name||d.data().email;
 const btn=document.createElement('button');
 btn.textContent='Follow';
 btn.onclick=()=>followUser(d.id);
 el.append(p,btn);
 box.append(el);
 });
}

async function sendMessage(){
 if(!requireLogin())return;
 const other=document.getElementById('chatUser').value.trim();
 const message=document.getElementById('messageText').value.trim();
 if(!other||!message)return;
 const ids=[currentUser.uid,other].sort();
 const room=ids.join('_');
 await db.collection('Chats').doc(room).collection('Messages').add({
 sender:currentUser.uid,
 text:message,
 createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 document.getElementById('messageText').value='';
 loadMessages();
}

function loadMessages(){
 if(!requireLogin())return;
 const other=document.getElementById('chatUser').value.trim();
 if(!other)return;
 const room=[currentUser.uid,other].sort().join('_');
 if(unsubscribeMessages)unsubscribeMessages();
 unsubscribeMessages=db.collection('Chats').doc(room)
 .collection('Messages').orderBy('createdAt')
 .onSnapshot(s=>{
 const box=document.getElementById('messages');
 box.innerHTML='';
 s.forEach(d=>{
 const p=document.createElement('p');
 p.textContent=(d.data().sender===currentUser.uid?'मैं: ':'वह: ')+d.data().text;
 box.append(p);
 });
 });
}

async function loadNotifications(){
 if(!requireLogin())return;
 const snap=await db.collection('Notifications')
 .where('to','==',currentUser.uid)
 .orderBy('createdAt','desc').limit(50).get();
 const box=document.getElementById('notificationList');
 box.innerHTML='';
 snap.forEach(d=>{
 const p=document.createElement('p');
 p.textContent=d.data().text;
 box.append(p);
 });
}
</script>
</body>
</html>
