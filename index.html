<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>धाकड़ (Dhaakad) — इंस्टाग्राम-स्टाइल सोशल ऐप</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .dhaakad-gradient {
      background: linear-gradient(135deg, #e11d48 0%, #f97316 55%, #facc15 100%);
    }
    .dhaakad-ring {
      background: linear-gradient(45deg, #facc15, #f97316, #e11d48, #c026d3);
      padding: 2.5px;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .filter-none { filter: none; }
    .filter-clarendon { filter: contrast(1.2) saturate(1.25); }
    .filter-warm { filter: sepia(0.28) saturate(1.35) brightness(1.04); }
    .filter-vivid { filter: saturate(1.6) contrast(1.12); }
    .filter-vintage { filter: sepia(0.45) contrast(0.92) brightness(0.95); }
    .filter-noir { filter: grayscale(1) contrast(1.3); }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      35% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0; }
    }
    .heart-burst {
      animation: heartPop 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
        </style>
  </head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <div id="app" class="min-h-screen flex flex-col lg:flex-row">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex flex-col justify-between w-64 fixed top-0 left-0 bottom-0 bg-zinc-950 border-r border-zinc-800/80 px-5 py-6 z-30">
      <div>
        <button onclick="switchTab('home')" class="flex items-center gap-3 mb-8 text-left group">
          <div class="w-10 h-10 rounded-2xl dhaakad-gradient flex items-center justify-center shadow-lg shadow-rose-600/20 group-hover:scale-105 transition">
            <span class="text-xl font-extrabold text-white">ध</span>
          </div>
          <div>
            <div class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-rose-400 via-orange-400 to-amber-300 bg-clip-text text-transparent">
              धाकड़
            </div>
            <div class="text-[11px] text-zinc-400">DHAAKAD SOCIAL</div>
          </div>
        </button>

        <nav class="space-y-1.5" id="desktopNav"></nav>
      </div>

      <button onclick="openEditProfile()" class="flex items-center gap-3 p-2.5 rounded-2xl bg-zinc-900/80 hover:bg-zinc-900 border border-zinc-800 transition text-left w-full">
        <div id="sidebarAvatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shrink-0">ध</div>
        <div class="min-w-0 flex-1">
          <div id="sidebarName" class="text-sm font-bold truncate">वीर धाकड़</div>
          <div id="sidebarHandle" class="text-xs text-zinc-400 truncate">@veer_dhaakad</div>
        </div>
      </button>
    </aside>

    <!-- Mobile Top Bar -->
    <header class="lg:hidden sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 flex items-center justify-between">
      <button onclick="switchTab('home')" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl dhaakad-gradient flex items-center justify-center font-extrabold text-white">ध</div>
        <span class="text-lg font-extrabold bg-gradient-to-r from-rose-400 via-orange-400 to-amber-300 bg-clip-text text-transparent">धाकड़</span>
      </button>
      <div class="flex items-center gap-2">
        <button onclick="openCreatePost('post')" class="px-3 py-1.5 rounded-full dhaakad-gradient text-xs font-bold text-white shadow">
          + नई पोस्ट
        </button>
        <button onclick="switchTab('messages')" class="relative p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-200">
          <span>💬</span>
          <span id="mobileUnreadDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 lg:pl-64 pb-20 lg:pb-8">
      <div id="mainContainer" class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6"></div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav id="mobileNav" class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800/80 px-2 py-1.5 flex items-center justify-around"></nav>
  </div>
    <!-- Story Viewer Modal -->
  <div id="storyModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-3">
    <div class="relative w-full max-w-md h-[84vh] max-h-[760px] rounded-3xl overflow-hidden bg-zinc-900 border border-zinc-800 flex flex-col justify-between shadow-2xl">
      <div class="absolute top-0 left-0 right-0 z-20 p-3 bg-gradient-to-b from-black/80 to-transparent">
        <div id="storyProgressBars" class="flex gap-1.5 mb-3"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div id="storyAuthorAvatar" class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm text-white"></div>
            <div>
              <div id="storyAuthorName" class="text-sm font-bold text-white"></div>
              <div id="storyTime" class="text-[11px] text-zinc-300">अभी-अभी</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleStoryPause()" id="storyPauseBtn" class="px-2.5 py-1 rounded-full bg-white/15 text-xs font-semibold text-white">⏸ पॉज़</button>
            <button onclick="closeStoryViewer()" class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center text-white font-bold">✕</button>
          </div>
        </div>
      </div>

      <div onclick="handleStoryTap(event)" class="relative flex-1 flex items-center justify-center select-none cursor-pointer">
        <img id="storyImage" src="" alt="Story" class="w-full h-full object-cover" />
        <div id="storyViewerMusicTag" class="hidden absolute top-16 left-4 px-3 py-1 rounded-full bg-black/65 text-xs font-bold text-amber-300"></div>
        <div id="storyCaptionOverlay" class="hidden absolute bottom-20 left-4 right-4 bg-black/60 backdrop-blur-sm px-4 py-2.5 rounded-2xl text-center text-sm font-semibold text-white"></div>
      </div>

      <div class="p-3 bg-gradient-to-t from-black/90 via-black/60 to-transparent z-20">
        <form onsubmit="sendStoryReply(event)" class="flex gap-2">
          <input id="storyReplyInput" type="text" placeholder="स्टोरी पर रिप्लाई भेजें..." class="flex-1 bg-zinc-900/90 border border-zinc-700 rounded-full px-4 py-2 text-sm text-white placeholder-zinc-400 focus:outline-none focus:border-rose-500" />
          <button type="submit" class="px-4 py-2 rounded-full dhaakad-gradient text-sm font-bold text-white">भेजें</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Create Post / Story Modal -->
  <div id="createModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-lg rounded-3xl bg-zinc-900 border border-zinc-800 p-5 my-auto shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="flex gap-2">
          <button type="button" onclick="setCreateMode('post')" id="modePostBtn" class="px-3.5 py-1.5 rounded-full text-xs font-bold dhaakad-gradient text-white">नई पोस्ट</button>
          <button type="button" onclick="setCreateMode('story')" id="modeStoryBtn" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-zinc-800 text-zinc-300">नई स्टोरी</button>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="closeCreateModal()" class="px-3 py-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-zinc-200">← वापस</button>
          <button type="button" onclick="closeCreateModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-300 font-bold">✕</button>
        </div>
      </div>
            <form onsubmit="submitNewCreation(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2">गैलरी से फ़ोटो चुनें या प्रीसेट चुनें</label>
          <div class="flex flex-wrap items-center gap-2 mb-2.5">
            <label class="cursor-pointer px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-rose-300 border border-zinc-700 transition">
              📁 फ़ोन/कंप्यूटर से फ़ोटो चुनें
              <input type="file" accept="image/*" onchange="handleFileUpload(event)" class="hidden" />
            </label>
            <button type="button" onclick="applyPresetPhoto(0)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🌄 पहाड़</button>
            <button type="button" onclick="applyPresetPhoto(1)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🏙️ शहर की रात</button>
            <button type="button" onclick="applyPresetPhoto(2)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🏋️ फिटनेस</button>
            <button type="button" onclick="applyPresetPhoto(3)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">☕ कैफ़े</button>
          </div>
        </div>

        <div class="relative aspect-square max-h-64 w-full rounded-2xl overflow-hidden bg-zinc-950 border border-zinc-800 flex items-center justify-center">
          <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover filter-none transition duration-200" />
        </div>

        <div id="filterSection">
          <label class="block text-xs font-semibold text-zinc-400 mb-2">फ़ोटो फ़िल्टर लगाएं</label>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="filterButtons"></div>
        </div>

        <div id="postExtraFields" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">लोकेशन</label>
            <input id="newPostLocation" type="text" placeholder="जैसे: आगरा, जयपुर, मुंबई" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">कैटेगरी / हैशटैग</label>
            <input id="newPostTag" type="text" placeholder="#धाकड़स्वैग #लाइफ़स्टाइल" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
          </div>
        </div>

        <!-- Story Audio Search & Selection -->
        <div id="storyMusicSection" class="bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <label class="text-xs font-bold text-amber-300">🎵 स्टोरी के लिए ऑनलाइन ऑडियो / म्यूज़िक</label>
            <button type="button" onclick="clearSelectedStoryMusic()" class="text-[11px] text-zinc-400 hover:text-white">हटाएं</button>
          </div>

          <input id="storyMusicSearch" type="text" oninput="renderStoryMusicList()" placeholder="गाना सर्च करें (जैसे: धाकड़, रात, सुबह, सफ़र)..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500" />

          <div id="storyMusicList" class="max-h-28 overflow-y-auto space-y-1.5"></div>

          <div class="flex items-center justify-between gap-2 pt-1">
            <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-[11px] font-bold text-amber-300">
              🎧 फ़ोन से ऑडियो चुनें
              <input type="file" accept="audio/*" onchange="handleStoryAudioFile(event)" class="hidden" />
            </label>
            <span id="selectedStoryMusicLabel" class="text-[11px] text-emerald-400 truncate">कोई ऑडियो नहीं चुना</span>
          </div>

          <audio id="storyPreviewAudio" controls class="hidden w-full h-8 mt-1"></audio>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">कैप्शन लिखें</label>
          <textarea id="newPostCaption" rows="2" placeholder="आज का धाकड़ अपडेट या विचार लिखें..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500"></textarea>
        </div>

        <button type="submit" id="publishBtn" class="w-full py-3 rounded-2xl dhaakad-gradient font-extrabold text-sm text-white shadow-lg shadow-rose-600/25 hover:opacity-95 transition">
          अभी पब्लिश करें
        </button>
      </form>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-3xl bg-zinc-900 border border-zinc-800 p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-extrabold text-white">प्रोफ़ाइल बदलें</h3>
        <button onclick="closeEditProfile()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-300 font-bold">✕</button>
      </div>
      <form onsubmit="saveProfileChanges(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">पूरा नाम</label>
          <input id="editName" type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">यूज़रनेम (@handle)</label>
          <input id="editHandle" type="text" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">शहर</label>
          <input id="editCity" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">धाकड़ बायो</label>
          <textarea id="editBio" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2">अवतार रंग चुनें</label>
          <div class="flex gap-2.5" id="avatarColorChoices"></div>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-2xl dhaakad-gradient font-extrabold text-sm text-white mt-2">
          प्रोफ़ाइल सेव करें
        </button>
      </form>
    </div>
  </div>

  <!-- Explore Post Quick View Modal -->
  <div id="exploreModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="exploreModalCard" class="w-full max-w-2xl rounded-3xl bg-zinc-900 border border-zinc-800 overflow-hidden grid grid-cols-1 md:grid-cols-2 shadow-2xl"></div>
  </div>

      { id: 'noir', name: 'Noir B&W', cls: 'filter-noir' }

    const STORY_TRACKS = [
      { id: 'm1', title: 'धाकड़ बीट — देसी स्वैग', artist: 'Dhaakad Studio', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },

      { id: 'm3', title: 'सुबह की ऊर्जा — मोटिवेशन', artist: 'Morning Beats', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },

    ];

    function makeArtworkDataUrl(title, subtitle, bg1, bg2, accent) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${bg1}"/>
            <stop offset="100%" stop-color="${bg2}"/>
          </linearGradient>
        </defs>
        <rect width="800" height="800" fill="url(#g)"/>
        <circle cx="650" cy="150" r="190" fill="${accent}" opacity="0.22"/>
        <circle cx="150" cy="660" r="240" fill="#ffffff" opacity="0.08"/>
        <rect x="64" y="64" width="672" height="672" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
        <text x="90" y="540" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="800">${title}</text>
        <text x="90" y="605" fill="#ffffff" fill-opacity="0.85" font-family="sans-serif" font-size="30">${subtitle}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    const PRESET_PHOTOS = [
      makeArtworkDataUrl('हिमालय की सुबह', 'धाकड़ ट्रैवल • #मोटिवेशन', '#0f172a', '#ea580c', '#facc15'),
      makeArtworkDataUrl('नियॉन शहर की रात', 'स्टाइल और रफ़्तार • #धाकड़स्वैग', '#18181b', '#be123c', '#fb7185'),
      makeArtworkDataUrl('सुबह की कसरत', 'अनुशासन ही असली ताक़त • #फ़िटनेस', '#14532d', '#0f766e', '#4ade80'),
      makeArtworkDataUrl('कड़क चाय और विचार', 'शाम की महफ़िल • #लाइफ़स्टाइल', '#451a03', '#9a3412', '#fbbf24')
    ];
           const DEFAULT_STATE = {

      followingHandles: ['@ananya_lens', '@rohit_reels'],
      savedPostIds: [],
      stories: [
        {
          id: 's1',

          music: 'रात की रफ़्तार — लो-फ़ाई',
          musicUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
          time: '25 मिनट पहले',
          seen: false
        },
        {

          image: PRESET_PHOTOS[2],
          caption: 'पसीना बहाए बिना धाकड़ रिज़ल्ट नहीं मिलता 💪',

    function toggleLike(postId) {
      const post = state.posts.find(p => p.id === postId);

    function doubleTapLike(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;
      if (!post.liked) {
        post.liked = true;
        post.likes += 1;
        saveState();
      }
      const burst = document.getElementById(`burst-${postId}`);
      if (burst) {
        burst.classList.remove('hidden', 'heart-burst');
        void burst.offsetWidth;
        burst.classList.add('heart-burst');
        setTimeout(() => burst.classList.add('hidden'), 900);
      }
      renderAll();
    }

    function toggleFollow(handle) {
      const idx = state.followingHandles.indexOf(handle);
      if (idx >= 0) {
        state.followingHandles.splice(idx, 1);
        state.profile.following = Math.max(0, state.profile.following - 1);
      } else {
        state.followingHandles.push(handle);
        state.profile.following += 1;
      }
      saveState();
      renderAll();
    }

    function toggleSavePost(postId) {
      const idx = state.savedPostIds.indexOf(postId);
      if (idx >= 0) state.savedPostIds.splice(idx, 1);
      else state.savedPostIds.push(postId);
      saveState();
      renderAll();

      if (!post) return;
      post.comments.push({ user: state.profile.name, text });
      input.value = '';
      saveState();
      renderAll();
    }

    function sendChatMessage(e) {

      const text = input.value.trim();
      if (!text) return;
      const chat = state.chats[state.activeChatHandle];
      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      chat.messages.push({ sender: 'me', text, time: nowTime });
      input.value = '';
      saveState();
      renderAll();

          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

        if (state.activeTab === 'messages') renderAll();
      }, 650);

      const searchEl = document.getElementById('storyMusicSearch');
      if (!box) return;
      const q = (searchEl ? searchEl.value : '').trim().toLowerCase();

      const filtered = STORY_TRACKS.filter(t =>
        !q || t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );

      if (!filtered.length) {
        box.innerHTML = `<div class="text-[11px] text-zinc-500 py-1">कोई गाना नहीं मिला—आप "फ़ोन से ऑडियो चुनें" से फाइल लगा सकते हैं।</div>`;
        return;

        return `
          <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl ${isPicked ? 'bg-rose-600/20 border border-rose-500/60' : 'bg-zinc-900'}">

      async function startStudioCamera() {

      function toggleStudioRecording() {

          chunks = [];

      console.error(err);
      msg.textContent = "सर्च करने में समस्या आई, कृपया दोबारा प्रयास करें।";
    }
  }
;
      
</script>
