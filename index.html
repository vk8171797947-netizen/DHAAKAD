<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DHAAKAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#000; --txt:#fff; --nav:#111; --bdr:#333; --post:#111; --box:#1a1a1a; --inp:#000; }
        .light-mode { --bg:#f0f2f5; --txt:#000; --nav:#fff; --bdr:#ddd; --post:#fff; --box:#f9f9f9; --inp:#fff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--txt); padding-bottom:60px; transition:0.3s; }
        .navbar { background:var(--nav); border-bottom:1px solid var(--bdr); position:sticky; top:0; z-index:10; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; }
        .logo { color:#ff7900; font-weight:bold; font-size:24px; letter-spacing:1px; }
        .nav-icons { display:flex; gap:12px; align-items:center; }
        .icon-btn { background:none; border:none; color:var(--txt); font-size:20px; padding:6px; cursor:pointer; }
        .status-bar { max-width:470px; margin:12px auto 0; padding:8px 10px; display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; }
        .status-bar::-webkit-scrollbar { display:none; }
        #statusList { display:flex; gap:14px; }
        .status-item { display:flex; flex-direction:column; align-items:center; min-width:68px; cursor:pointer; }
        .status-ring { width:64px; height:64px; border-radius:50%; padding:3px; background:linear-gradient(45deg,#ff7900,#ff3b30); margin-bottom:5px; }
        .status-ring.add-ring { background:none; border:2px dashed #ff7900; padding:0; }
        .status-avatar { width:100%; height:100%; border-radius:50%; background:var(--post); color:var(--txt); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px; overflow:hidden; border:2px solid var(--bg); }
        .status-avatar img { width:100%; height:100%; object-fit:cover; }
        .status-name { font-size:11px; max-width:72px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .main { max-width:470px; margin:10px auto 15px; padding:0 10px; }
        .post { background:var(--post); border:1px solid var(--bdr); border-radius:10px; margin-bottom:20px; overflow:hidden; }
        .post-header { padding:12px; color:#ff7900; font-weight:bold; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
        .follow-btn { background:#ff7900; color:#000; border:none; padding:5px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; }
        .delete-post-btn { background:#ff3b30; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; margin-left:6px; }
        .post-box { width:100%; min-height:250px; background:var(--box); display:flex; align-items:center; justify-content:center; font-size:18px; padding:10px; text-align:center; border-top:1px solid var(--bdr); border-bottom:1px solid var(--bdr); }
        .post-box img { width:100%; max-height:400px; object-fit:cover; border-radius:6px; }
        .post-footer { padding:12px; }
        .post-actions { display:flex; gap:12px; margin-bottom:8px; }
        .action-btn { background:none; border:none; color:var(--txt); font-size:24px; padding:4px; cursor:pointer; }
        .liked { color:#ff3b30 !important; }
        .post-footer p { font-size:14px; margin-bottom:6px; }
        .comments-list { margin-top:8px; padding-top:8px; border-top:1px solid var(--bdr); font-size:13px; opacity:0.85; }
        .comment-box { display:none; margin-top:10px; gap:8px; }
        .comment-box input { flex:1; padding:8px 10px; background:var(--inp); border:1px solid var(--bdr); color:var(--txt); border-radius:6px; }
        .comment-box button { background:#ff7900; color:#000; border:none; padding:8px 14px; border-radius:6px; font-weight:bold; cursor:pointer; }
        .profile-container { display:none; max-width:470px; margin:15px auto; padding:20px; text-align:center; background:var(--post); border:1px solid var(--bdr); border-radius:10px; }
        .profile-avatar { width:90px; height:90px; border-radius:50%; background:#ff7900; color:#000; font-size:36px; display:flex; align-items:center; justify-content:center; margin:0 auto 15px; }
        .profile-edit-box { display:flex; gap:8px; margin:15px 0; }
        .profile-edit-box input { flex:1; padding:10px; background:var(--inp); border:1px solid var(--bdr); color:var(--txt); border-radius:6px; }
        .profile-edit-box button { background:#ff7900; color:#000; border:none; padding:10px 15px; border-radius:6px; font-weight:bold; cursor:pointer; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; padding:15px; }
        .modal-content { background:var(--post); padding:20px; border-radius:12px; width:100%; max-width:360px; border:1px solid var(--bdr); text-align:center; }
        .modal-content h3 { margin-bottom:15px; color:#ff7900; }
        .modal-content input[type="text"] { width:100%; margin-bottom:12px; padding:12px; background:var(--inp); color:var(--txt); border:1px solid var(--bdr); border-radius:6px; }
        .modal-content input[type="file"] { width:100%; margin-bottom:15px; }
        .btn-container { display:flex; gap:10px; }
        .btn { width:100%; background:#ff7900; color:#000; border:none; padding:12px; font-weight:bold; cursor:pointer; border-radius:6px; }
        .btn-secondary { background:#333; color:#fff; }
        .status-view-box { min-height:220px; background:var(--box); border-radius:10px; padding:15px; margin:10px 0 15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
        .status-view-box img { max-width:100%; max-height:260px; border-radius:8px; }
        #toast { visibility:hidden; min-width:240px; background:#ff7900; color:#000; font-weight:bold; text-align:center; border-radius:25px; padding:10px 18px; position:fixed; z-index:200; left:50%; bottom:25px; transform:translateX(-50%); font-size:14px; }
        #toast.show { visibility:visible; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">DHAAKAD</div>
        <div class="nav-icons">
            <button type="button" class="icon-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
            <button type="button" class="icon-btn" id="homeBtn"><i class="fa-solid fa-house"></i></button>
            <button type="button" class="icon-btn" id="profileBtn"><i class="fa-regular fa-user"></i></button>
            <button type="button" class="icon-btn" id="plusBtn"><i class="fa-regular fa-square-plus"></i></button>
            <button type="button" class="icon-btn" id="notifBtn"><i class="fa-regular fa-heart"></i></button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <div class="status-item" id="addStatusBtn">
            <div class="status-ring add-ring"><div class="status-avatar"><i class="fa-solid fa-plus" style="color:#ff7900;"></i></div></div>
            <span class="status-name">स्टेटस लगाएं</span>
        </div>
        <div id="statusList"></div>
    </div>

    <div class="main" id="feed">
        <div class="post">
            <div class="post-header">
                <div><i class="fa-solid fa-fire"></i> DHAAKAD_OFFICIAL</div>
                <div>
                    <button type="button" class="follow-btn">Follow</button>
                    <button type="button" class="delete-post-btn">Delete</button>
                </div>
            </div>
            <div class="post-box">🔥 DHAAKAD Ultimate App with Storage & Upload</div>
            <div class="post-footer">
                <div class="post-actions">
                    <button type="button" class="action-btn like-btn"><i class="fa-regular fa-heart"></i></button>
                    <button type="button" class="action-btn comment-toggle-btn"><i class="fa-regular fa-comment"></i></button>
                    <button type="button" class="action-btn share-btn"><i class="fa-regular fa-paper-plane"></i></button>
                </div>
                <p><b><span class="like-count">1245</span> likes</b></p>
                <p><b>DHAAKAD_OFFICIAL</b> अब हर नया फीचर एकदम लोड और सेव रहेगा!</p>
                <div class="comments-list"></div>
                <div class="comment-box"><input type="text" placeholder="कमेंट लिखें..."><button type="button" class="send-comment-btn">Send</button></div>
            </div>
        </div>
    </div>

    <div class="profile-container" id="profileSection">
        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
        <h2 id="displayUsername">DHAAKAD_USER</h2>
        <p style="color:#888;font-size:14px;">धाकड़ ऐप का ऑफिशियल यूजर 🚀</p>
        <div class="profile-edit-box"><input type="text" id="newUsernameInput" placeholder="नया यूजरनेम लिखें..."><button type="button" id="saveUsernameBtn">बदलो</button></div>
        <button type="button" class="btn btn-secondary" id="backToHomeBtn">वापस होम पर जाएं</button>
    </div>

    <div class="modal" id="myModal">
        <div class="modal-content">
            <h3>नई पोस्ट बनाएं</h3>
            <input type="text" id="captionInput" placeholder="कैप्शन लिखें...">
            <input type="file" id="imageInput" accept="image/*">
            <div class="btn-container"><button type="button" class="btn btn-secondary" id="cancelPostBtn">बंद करें</button><button type="button" class="btn" id="submitPostBtn">पोस्ट करें</button></div>
        </div>
    </div>

    <div class="modal" id="statusModal">
        <div class="modal-content">
            <h3>24 घंटे का स्टेटस लगाएं</h3>
            <input type="text" id="statusTextInput" placeholder="अपना स्टेटस लिखें...">
            <input type="file" id="statusImageInput" accept="image/*">
            <div class="btn-container"><button type="button" class="btn btn-secondary" id="cancelStatusBtn">बंद करें</button><button type="button" class="btn" id="submitStatusBtn">स्टेटस लगाएं</button></div>
        </div>
    </div>

    <div class="modal" id="viewStatusModal">
        <div class="modal-content">
            <h3 id="viewStatusUser">यूजर</h3>
            <div id="viewStatusTime" style="font-size:12px;color:#888;"></div>
            <div class="status-view-box" id="viewStatusContent"></div>
            <button type="button" class="btn btn-secondary" id="closeViewStatusBtn">बंद करें</button>
        </div>
    </div>

    <div id="toast">मैसेज</div>

    <script>
        const $ = id => document.getElementById(id);
        function showToast(msg) {
            const t = $("toast"); t.innerText = msg; t.className = "show";
            setTimeout(() => t.className = "", 2500);
        }

        $("themeBtn").onclick = () => {
            document.body.classList.toggle("light-mode");
            const light = document.body.classList.contains("light-mode");
            $("themeBtn").querySelector("i").className = light ? "fa-solid fa-sun" : "fa-solid fa-moon";
            showToast(light ? "लाइट मोड चालू ☀️" : "डार्क मोड चालू 🌙");
        };

        $("homeBtn").onclick = () => { $("profileSection").style.display = "none"; $("feed").style.display = "block"; $("statusBar").style.display = "flex"; showToast("होम पेज 🏠"); };
        $("profileBtn").onclick = () => { $("feed").style.display = "none"; $("statusBar").style.display = "none"; $("profileSection").style.display = "block"; showToast("प्रोफाइल पेज 👤"); };
        $("backToHomeBtn").onclick = () => { $("profileSection").style.display = "none"; $("feed").style.display = "block"; $("statusBar").style.display = "flex"; };
        $("plusBtn").onclick = () => $("myModal").style.display = "flex";
        $("notifBtn").onclick = () => showToast("कोई नया नोटिफिकेशन नहीं है ❤️");
        $("cancelPostBtn").onclick = () => { $("myModal").style.display = "none"; $("captionInput").value = ""; $("imageInput").value = ""; };

        const DAY_MS = 24 * 60 * 60 * 1000;
        function getStatuses() {
            let list = [];
            try { list = JSON.parse(localStorage.getItem("dhaakad_st") || "[]"); } catch(e) {}
            const active = Array.isArray(list) ? list.filter(s => s && s.exp > Date.now()) : [];
            try { localStorage.setItem("dhaakad_st", JSON.stringify(active)); } catch(e) {}
            return active;
        }

        function renderStatuses() {
            const box = $("statusList"); box.innerHTML = "";
            getStatuses().forEach(st => {
                const div = document.createElement("div");
                div.className = "status-item";
                div.innerHTML = `<div class="status-ring"><div class="status-avatar">${st.img ? `<img src="${st.img}">` : st.user[0].toUpperCase()}</div></div><span class="status-name">${st.user}</span>`;
                div.onclick = () => {
                    const cur = getStatuses().find(x => x.id === st.id);
                    if (!cur) { renderStatuses(); return showToast("स्टेटस खत्म हो गया!"); }
                    const hrs = Math.floor((cur.exp - Date.now()) / 3600000);
                    const mins = Math.floor(((cur.exp - Date.now()) % 3600000) / 60000);
                    $("viewStatusUser").innerText = cur.user;
                    $("viewStatusTime").innerText = `⏳ ${hrs} घंटा ${mins} मिनट बाकी`;
                    $("viewStatusContent").innerHTML = `${cur.img ? `<img src="${cur.img}">` : ""}${cur.text ? `<div>${cur.text}</div>` : ""}`;
                    $("viewStatusModal").style.display = "flex";
                };
                box.appendChild(div);
            });
        }

        $("addStatusBtn").onclick = () => $("statusModal").style.display = "flex";
        $("cancelStatusBtn").onclick = () => { $("statusModal").style.display = "none"; $("statusTextInput").value = ""; $("statusImageInput").value = ""; };
        $("closeViewStatusBtn").onclick = () => $("viewStatusModal").style.display = "none";

        $("submitStatusBtn").onclick = () => {
            const txt = $("statusTextInput").value.trim(), file = $("statusImageInput").files[0];
            if (!txt && !file) return showToast("कुछ लिखें या फोटो चुनें! ⚠️");
            const save = (img = "") => {
                const list = getStatuses(), user = localStorage.getItem("dhaakad_username") || "DHAAKAD_USER";
                list.unshift({ id: Date.now(), user, text: txt, img, exp: Date.now() + DAY_MS });
                try { localStorage.setItem("dhaakad_st", JSON.stringify(list)); } catch(e) { showToast("फोटो बहुत बड़ी है!"); }
                $("statusModal").style.display = "none"; $("statusTextInput").value = ""; $("statusImageInput").value = "";
                renderStatuses(); showToast("स्टेटस 24 घंटे के लिए लग गया! ⏱️");
            };
            if (file) { const r = new FileReader(); r.onload = e => save(e.target.result); r.readAsDataURL(file); } else save();
        };

        function saveFeed() { try { localStorage.setItem("dhaakad_feed_v3", $("feed").innerHTML); } catch(e) {} }
        if (localStorage.getItem("dhaakad_feed_v3")) $("feed").innerHTML = localStorage.getItem("dhaakad_feed_v3");
        if (localStorage.getItem("dhaakad_username")) $("displayUsername").innerText = localStorage.getItem("dhaakad_username");
        renderStatuses();

        $("saveUsernameBtn").onclick = () => {
            const n = $("newUsernameInput").value.trim();
            if (!n) return showToast("सही नाम लिखें! ⚠️");
            $("displayUsername").innerText = n; localStorage.setItem("dhaakad_username", n); $("newUsernameInput").value = ""; showToast("नाम बदल गया! ✅");
        };

        $("submitPostBtn").onclick = () => {
            const txt = $("captionInput").value.trim(), file = $("imageInput").files[0];
            if (!txt && !file) return showToast("कुछ लिखें या फोटो चुनें! ⚠️");
            const add = (img = "") => {
                const user = localStorage.getItem("dhaakad_username") || "DHAAKAD_USER";
                const div = document.createElement("div"); div.className = "post";
                div.innerHTML = `<div class="post-header"><div><i class="fa-solid fa-user"></i> ${user}</div><div><button type="button" class="follow-btn">Follow</button><button type="button" class="delete-post-btn">Delete</button></div></div><div class="post-box">${img ? `<img src="${img}">` : txt}</div><div class="post-footer"><div class="post-actions"><button type="button" class="action-btn like-btn"><i class="fa-regular fa-heart"></i></button><button type="button" class="action-btn comment-toggle-btn"><i class="fa-regular fa-comment"></i></button><button type="button" class="action-btn share-btn"><i class="fa-regular fa-paper-plane"></i></button></div><p><b><span class="like-count">1</span> likes</b></p><p><b>${user}</b> ${txt}</p><div class="comments-list"></div><div class="comment-box"><input type="text" placeholder="कमेंट लिखें..."><button type="button" class="send-comment-btn">Send</button></div></div>`;
                $("feed").prepend(div); $("myModal").style.display = "none"; $("captionInput").value = ""; $("imageInput").value = "";
                saveFeed(); showToast("नई पोस्ट लाइव हो गई! 🔥");
            };
            if (file) { const r = new FileReader(); r.onload = e => add(e.target.result); r.readAsDataURL(file); } else add();
        };

        $("feed").onclick = e => {
            const like = e.target.closest(".like-btn"), cTog = e.target.closest(".comment-toggle-btn"), sCom = e.target.closest(".send-comment-btn"), share = e.target.closest(".share-btn"), fol = e.target.closest(".follow-btn"), del = e.target.closest(".delete-post-btn");
            if (like) {
                const ic = like.querySelector("i"), cnt = like.closest(".post").querySelector(".like-count");
                const liked = ic.classList.toggle("fa-solid"); ic.classList.toggle("fa-regular", !liked); ic.classList.toggle("liked", liked);
                cnt.innerText = parseInt(cnt.innerText) + (liked ? 1 : -1); saveFeed();
            }
            if (cTog) { const b = cTog.closest(".post").querySelector(".comment-box"); b.style.display = b.style.display === "flex" ? "none" : "flex"; }
            if (sCom) {
                const p = sCom.closest(".post"), inp = p.querySelector(".comment-box input");
                if (inp.value.trim()) { p.querySelector(".comments-list").innerHTML += `<p><b>You:</b> ${inp.value.trim()}</p>`; inp.value = ""; saveFeed(); showToast("कमेंट जुड़ गया! 💬"); }
            }
            if (share) { if (navigator.share) navigator.share({ title:"DHAAKAD", url:location.href }).catch(()=>{}); else { navigator.clipboard?.writeText(location.href); showToast("लिंक कॉपी हो गया! 🔗"); } }
            if (fol) {
                const isF = fol.innerText === "Follow";
                fol.innerText = isF ? "Following" : "Follow"; fol.style.background = isF ? "#333" : "#ff7900"; fol.style.color = isF ? "#fff" : "#000";
                saveFeed(); showToast(isF ? "फॉलो कर लिया! 🤝" : "अनफॉलो कर दिया! ❌");
            }
            if (del) {
                del.closest(".post").remove();
                saveFeed();
                showToast("पोस्ट डिलीट हो गई! 🗑️");
            }
        };
    </script>
</body>
</html>
