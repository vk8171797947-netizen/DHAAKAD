
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHAAKAD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:17px;background:#151515;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-size:27px;font-weight:900;color:#ff7900}
.hero{padding:22px 16px;background:linear-gradient(135deg,#302010,#111)}
.hero h1{color:#ff7900;font-size:28px}
.hero p{color:#ccc}
.upload{display:inline-block;background:#ff7900;color:#111;padding:13px 20px;border-radius:10px;font-weight:bold}
input{display:none}
h2{padding:0 15px;color:#ff7900}
.feed{padding:0 12px 90px}
.post{background:#191919;border-radius:14px;margin:16px 0;overflow:hidden}
.video{height:390px;background:linear-gradient(145deg,#38200e,#101010);display:flex;align-items:center;justify-content:center;font-size:55px;color:#ff7900}
.info{padding:14px}
.info p{color:#bbb;font-size:14px}
.creator{display:flex;justify-content:space-between;align-items:center}
.follow{background:#ff7900;color:#111;border:0;border-radius:20px;padding:8px 13px;font-weight:bold}
.actions{display:flex;justify-content:space-around;gap:5px;padding:12px 0;color:white}
.actions button{background:#292929;color:white;border:0;border-radius:9px;padding:10px 7px;font-size:13px}
.actions button:active{background:#ff7900}
.saved{color:#ff7900!important}
nav{position:fixed;bottom:0;left:0;right:0;background:#171717;border-top:1px solid #333;display:flex;justify-content:space-around;padding:17px 3px}
nav span{font-size:13px;color:#ff7900}
</style>
</head>
<body>

<header>
<div class="logo">DHAAKAD 🔥</div>
<span>CREATE • SHARE • EARN</span>
</header>

<section class="hero">
<h1>अपना हुनर दिखाओ!</h1>
<p>वीडियो बनाओ, दुनिया को दिखाओ और आगे बढ़ो।</p>
<label class="upload" for="videoFile">+ Upload Video</label>
<input type="file" id="videoFile" accept="video/*">
</section>

<h2>🔥 आपके लिए वीडियो</h2>
<div class="feed" id="feed">

<div class="post">
<div class="video">▶</div>
<div class="info">
<div class="creator">
<strong>DHAAKAD Creator</strong>
<button class="follow" onclick="follow(this)">+ Follow</button>
</div>
<p>धाकड़ में आपका स्वागत है! 🔥</p>
<div class="actions">
<button onclick="like(this)">♡ Like</button>
<button onclick="comment()">💬 Comment</button>
<button onclick="share()">↗ Share</button>
<button onclick="save(this)">🔖 Save</button>
</div>
</div>
</div>

</div>

<nav>
<span>🏠 Home</span>
<span>🔍 Search</span>
<span>➕ Create</span>
<span>🔖 Saved</span>
<span>👤 Profile</span>
</nav>

<script>
function like(btn){
let liked=btn.dataset.liked==="yes";
btn.dataset.liked=liked?"no":"yes";
btn.innerHTML=liked?"♡ Like":"❤️ Liked";
}
function follow(btn){
let followed=btn.dataset.followed==="yes";
btn.dataset.followed=followed?"no":"yes";
btn.innerHTML=followed?"+ Follow":"✓ Following";
}
function save(btn){
let saved=btn.dataset.saved==="yes";
btn.dataset.saved=saved?"no":"yes";
btn.innerHTML=saved?"🔖 Save":"🔖 Saved";
btn.classList.toggle("saved");
}
function comment(){
let msg=prompt("अपना कमेंट लिखें");
if(msg)alert("आपका कमेंट: "+msg);
}
function share(){
if(navigator.share){
navigator.share({title:"DHAAKAD",text:"देखो मेरा DHAAKAD वीडियो!"});
}else{
alert("DHAAKAD पर आपका स्वागत है!");
}
}
document.getElementById("videoFile").addEventListener("change",function(){
if(!this.files.length)return;
let url=URL.createObjectURL(this.files[0]);
let post=document.createElement("div");
post.className="post";
post.innerHTML=`
<video controls style="width:100%;max-height:450px"></video>
<div class="info">
<div class="creator"><strong>आपका वीडियो</strong>
<button class="follow" onclick="follow(this)">+ Follow</button></div>
<p>DHAAKAD 🔥</p>
<div class="actions">
<button onclick="like(this)">♡ Like</button>
<button onclick="comment()">💬 Comment</button>
<button onclick="share()">↗ Share</button>
<button onclick="save(this)">🔖 Save</button>
</div></div>`;
post.querySelector("video").src=url;
document.getElementById("feed").prepend(post);
});
</script>
</body>
</html>
