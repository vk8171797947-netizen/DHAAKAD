
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>DHAAKAD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#000;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 height:60px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 border-bottom:1px solid #333;
}
.logo{
 color:#ff6500;
 font-size:27px;
 font-weight:900;
}
.head-btn{
 background:none;
 color:white;
 border:0;
 font-size:27px;
}
main{
 max-width:600px;
 margin:auto;
 padding-bottom:75px;
}
.stories{
 display:flex;
 gap:15px;
 overflow-x:auto;
 padding:15px 10px;
 border-bottom:1px solid #333;
}
.story{
 min-width:65px;
 text-align:center;
 font-size:12px;
}
.story-circle{
 width:62px;
 height:62px;
 border:3px solid #ff6500;
 border-radius:50%;
 margin:auto auto 5px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:25px;
}
.feed{
 padding:15px;
 text-align:center;
 color:#aaa;
}
nav{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 height:62px;
 background:#080808;
 border-top:1px solid #444;
 display:flex;
 justify-content:space-around;
 align-items:center;
}
nav button{
 background:none;
 border:0;
 color:white;
 font-size:24px;
 padding:8px;
}
nav button.active{
 color:#ff6500;
}
</style>
</head>
<body>

<header>
 <button class="head-btn">＋</button>
 <div class="logo">DHAAKAD</div>
 <button class="head-btn">♡</button>
</header>

<main>
 <section class="stories">
  <div class="story">
   <div class="story-circle">＋</div>
   Your Story
  </div>
  <div class="story">
   <div class="story-circle">🔥</div>
   DHAAKAD
  </div>
  <div class="story">
   <div class="story-circle">😎</div>
   Creator
  </div>
  <div class="story">
   <div class="story-circle">⭐</div>
   Star
  </div>
  <div class="story">
   <div class="story-circle">🎬</div>
   Videos
  </div>
 </section>

 <section class="feed">
  <h2>DHAAKAD FEED</h2>
  <p>आपकी पोस्ट यहाँ दिखाई देंगी।</p>
 </section>
</main>

<nav>
 <button class="active" onclick="showTab('Home',this)">⌂</button>
 <button onclick="showTab('Reels',this)">▶</button>
 <button onclick="showTab('Messages',this)">✉</button>
 <button onclick="showTab('Search',this)">⌕</button>
 <button onclick="showTab('Profile',this)">●</button>
</nav>

<script>
function showTab(name,button){
 document.querySelectorAll('nav button')
 .forEach(b=>b.classList.remove('active'));
 button.classList.add('active');
 alert(name+' अभी तैयार किया जाएगा।');
}
</script>

</body>
</html>
