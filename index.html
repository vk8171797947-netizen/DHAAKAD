
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6500">
  <title>DHAAKAD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #000;
      padding: 18px;
      text-align: center;
      border-bottom: 2px solid #ff6500;
    }

    header h1 {
      color: #ff6500;
      margin: 0;
      font-size: 30px;
      font-weight: 900;
    }

    header p {
      margin: 7px 0 0;
      color: white;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    .welcome {
      margin-top: 35px;
      padding: 25px;
      background: #1c1c1c;
      border: 1px solid #ff6500;
      border-radius: 15px;
    }

    .welcome h2 {
      color: #ff6500;
    }

    .welcome p {
      color: #ddd;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #999;
    }
  </style>
</head>

<body>

  <header>
    <h1>DHAAKAD</h1>
    <p>अपना हुनर दिखाओ!</p>
  </header>

  <main>
    <section class="welcome">
      <h2>WELCOME TO DHAAKAD</h2>
      <p>CREATE • SHARE • EARN</p>
      <p>अपनी प्रतिभा दुनिया को दिखाओ।</p>
    </section>
  </main>

  <footer>
    © 2026 DHAAKAD
  </footer>

<section style="background:#1c1c1c;padding:20px;margin:20px;border:1px solid #ff6500;border-radius:15px;text-align:center;color:white;">
  <h2 style="color:#ff6500;">DHAAKAD VIDEO UPLOAD</h2>

  <p>अपना वीडियो चुनें और दुनिया को हुनर दिखाएँ!</p>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
    style="max-width:100%;color:white;"
  >

  <video
    id="videoPreview"
    controls
    playsinline
    style="display:none;width:100%;margin-top:15px;border-radius:10px;"
  ></video>

  <p id="videoMessage" style="color:#ff6500;"></p>
</section>

<script>
const videoFile = document.getElementById("videoFile");
const videoPreview = document.getElementById("videoPreview");
const videoMessage = document.getElementById("videoMessage");

let videoURL = null;

videoFile.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  if (videoURL) {
    URL.revokeObjectURL(videoURL);
  }

  if (!file.type.startsWith("video/")) {
    videoMessage.textContent = "कृपया वीडियो चुनें।";
    videoPreview.style.display = "none";
    return;
  }

  videoURL = URL.createObjectURL(file);
  videoPreview.src = videoURL;
  videoPreview.style.display = "block";

  videoMessage.textContent = "आपका वीडियो तैयार है!";
});
      </script>

<section style="background:#1c1c1c;padding:20px;margin:20px;border:1px solid #ff6500;border-radius:15px;text-align:center;color:white;">

  <h2 style="color:#ff6500;">SHARE YOUR TALENT</h2>

  <p>अपने वीडियो के बारे में कुछ लिखें</p>

  <textarea
    id="videoCaption"
    placeholder="यहाँ अपना कैप्शन लिखें..."
    style="width:100%;height:90px;padding:12px;border-radius:8px;box-sizing:border-box;"
  ></textarea>

  <button
    id="shareVideo"
    type="button"
    style="background:#ff6500;color:white;border:0;padding:14px 25px;border-radius:8px;font-weight:bold;margin-top:15px;"
  >
    SHARE VIDEO
  </button>

  <p id="shareMessage" style="color:#ff6500;"></p>

</section>

<script>
document.getElementById("shareVideo").addEventListener("click", async function() {

  const fileInput = document.getElementById("videoFile");
  const caption = document.getElementById("videoCaption").value.trim();
  const message = document.getElementById("shareMessage");

  if (!fileInput.files || !fileInput.files[0]) {
    message.textContent = "पहले अपना वीडियो चुनें!";
    return;
  }

  const file = fileInput.files[0];

  if (!file.type.startsWith("video/")) {
    message.textContent = "कृपया सही वीडियो चुनें!";
    return;
  }

  if (!navigator.share || !navigator.canShare ||
      !navigator.canShare({ files: [file] })) {
    message.textContent = "आपका ब्राउज़र वीडियो शेयर करने की सुविधा नहीं देता।";
    return;
  }

  try {
    await navigator.share({
      title: "DHAAKAD",
      text: caption || "मेरा हुनर देखिए! DHAAKAD",
      files: [file]
    });

    message.textContent = "शेयर प्रक्रिया पूरी हुई!";
  } catch (error) {
    if (error.name !== "AbortError") {
      message.textContent = "शेयर नहीं हो पाया। दोबारा कोशिश करें।";
    }
  }

});
</script>
  
</body>
</html>
