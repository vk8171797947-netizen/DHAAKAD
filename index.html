<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>धाकड़ (Dhaakad)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #000; color: #fff; max-width: 450px; margin: auto; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #111; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; z-index: 20; }
    header h1 { font-size: 22px; background: linear-gradient(45deg, #ff2a55, #ff9900); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    main { flex: 1; overflow-y: auto; position: relative; padding-bottom: 66px; }
    .screen { display: none; min-height: 100%; }
    .screen.active { display: block; }
    .reel-card { position: relative; width: 100%; height: calc(100vh - 116px); background: #090909; border-bottom: 2px solid #1f1f1f; overflow: hidden; }
    .reel-card video { width: 100%; height: 100%; object-fit: cover; }
    .reel-overlay-sticker { position: absolute; font-size: 56px; pointer-events: none; z-index: 3; }
    .reel-overlay-text { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; text-shadow: 2px 2px 6px #000; text-align: center; width: 90%; pointer-events: none; z-index: 3; }
    .big-heart { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 85px; opacity: 0; transition: all 0.35s ease; pointer-events: none; z-index: 10; }
    .big-heart.show { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    .reel-actions { position: absolute; right: 12px; bottom: 82px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 6; }
    .action-btn { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 21px; width: 44px; height: 44px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .action-btn span { font-size: 10px; margin-top: 1px; }
    .reel-info { position: absolute; left: 12px; bottom: 16px; right: 68px; z-index: 6; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 10px; border-radius: 10px; }
    .user-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .mini-dp { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid #ff2a55; background: #222; display: flex; align-items: center; justify-content: center; }
    .mini-dp img, .mini-dp video { width: 100%; height: 100%; object-fit: cover; }
    .follow-btn { background: #ff2a55; border: none; color: #fff; padding: 4px 11px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .follow-btn.following { background: #333; border: 1px solid #666; }
    .explore-box, .editor-box { padding: 12px; }
    .tag-row { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 14px; }
    .tag-chip { background: #1d1d1d; border: 1px solid #333; color: #eee; padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .explore-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .explore-card { background: #141414; border-radius: 10px; overflow: hidden; border: 1px solid #262626; cursor: pointer; }
    .explore-card video { width: 100%; height: 180px; object-fit: cover; }
    .explore-card p { padding: 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage { position: relative; width: 100%; height: 290px; background: #151515; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
    .stage video { width: 100%; height: 100%; object-fit: cover; display: none; }
    #draggable-sticker { position: absolute; top: 35%; left: 40%; font-size: 58px; cursor: move; user-select: none; touch-action: none; display: none; z-index: 4; }
    #preview-text { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 21px; font-weight: bold; text-shadow: 2px 2px 5px #000; pointer-events: none; text-align: center; width: 90%; z-index: 3; }
    .tool-tabs { display: flex; justify-content: space-between; margin: 10px 0; background: #181818; padding: 5px; border-radius: 10px; gap: 4px; }
    .tool-tabs button { flex: 1; background: none; border: none; color: #ccc; padding: 8px 2px; font-size: 11px; cursor: pointer; border-radius: 7px; }
    .tool-tabs button.active-tab { background: #ff2a55; color: #fff; font-weight: bold; }
    .panel { display: none; background: #141414; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #252525; }
    .panel.active { display: block; }
    .preset-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .preset-row button { background: #242424; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 8px; white-space: nowrap; font-size: 12px; cursor: pointer; }
    .sticker-grid { display: flex; justify-content: space-around; font-size: 28px; padding: 6px 0; cursor: pointer; }
    input[type="text"], select { width: 100%; padding: 9px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; margin-top: 6px; font-size: 13px; }
    .post-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff2a55, #ff7700); border: none; color: #fff; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }
    .profile-header { padding: 18px 14px; text-align: center; border-bottom: 1px solid #222; }
    .dp-container { position: relative; width: 96px; height: 96px; margin: 0 auto 10px; }
    .dp-circle { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid #ff2a55; background: #222; display: flex; align-items: center; justify-content: center; }
    .dp-circle img, .dp-circle video { width: 100%; height: 100%; object-fit: cover; }
    .dp-edit-badge { position: absolute; bottom: 0; right: 0; background: #ff2a55; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; border: 2px solid #000; }
    .stats-row { display: flex; justify-content: center; gap: 28px; margin: 12px 0; }
    .stat-box strong { display: block; font-size: 17px; }
    .stat-box span { font-size: 11px; color: #999; }
    .bio-box { background: #151515; padding: 10px; border-radius: 10px; margin-top: 10px; text-align: left; border: 1px solid #262626; }
    .my-videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; }
    .grid-item { aspect-ratio: 9/16; background: #1a1a1a; overflow: hidden; }
    .grid-item video { width: 100%; height: 100%; object-fit: cover; }
    .comment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 50; align-items: flex-end; justify-content: center; }
    .comment-modal.open { display: flex; }
    .comment-sheet { width: 100%; max-width: 450px; background: #151515; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 14px; max-height: 70vh; display: flex; flex-direction: column; }
    .comment-list { flex: 1; overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
    .comment-item { background: #222; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
    nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 9px 0; z-index: 30; }
    nav button { background: none; border: none; color: #888; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    nav button.active { color: #ff2a55; font-weight: bold; }
    nav button span.icon { font-size: 19px; }
  </style>
</head>
<body>
  <header>
    <h1>🔥 धाकड़</h1>
    <span style="font-size: 12px; color: #aaa;">ऑल-इन-वन रील्स</span>
  </header>
  <main>
    <section id="feed-screen" class="screen active">
      <div id="reels-container"></div>
    </section>
    <section id="explore-screen" class="screen">
      <div class="explore-box">
        <input type="text" id="search-input" placeholder="वीडियो, कैप्शन या #टैग खोजें..." oninput="renderExplore()">
        <div class="tag-row">
          <button class="tag-chip" onclick="filterByTag('')">सभी</button>
          <button class="tag-chip" onclick="filterByTag('धाकड़')">#धाकड़</button>
          <button class="tag-chip" onclick="filterByTag('म्यूज़िक')">#म्यूज़िक</button>
          <button class="tag-chip" onclick="filterByTag('हिस्सा')">#6हिस्से</button>
        </div>
        <div class="explore-grid" id="explore-grid"></div>
      </div>
    </section>
        <section id="upload-screen" class="screen">
      <div class="editor-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <strong>वीडियो एडिटर</strong>
          <label for="video-picker" style="background: #252525; border: 1px solid #ff2a55; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;">📁 वीडियो चुनें / बदलें</label>
          <input type="file" id="video-picker" accept="video/*" style="display: none;">
        </div>
        <div class="stage" id="editor-stage">
          <video id="editor-video" loop playsinline controls></video>
          <span id="stage-placeholder" style="color: #777; font-size: 13px;">ऊपर से कोई वीडियो चुनें</span>
          <div id="draggable-sticker">😎</div>
          <div id="preview-text"></div>
        </div>
        <div class="tool-tabs">
          <button type="button" class="active-tab" onclick="switchTool('panel-filter', this)">🎨 रंग/फ़िल्टर</button>
          <button type="button" onclick="switchTool('panel-sticker', this)">🧸 कार्टून</button>
          <button type="button" onclick="switchTool('panel-text', this)">अ हिंदी</button>
          <button type="button" onclick="switchTool('panel-music', this)">🎵 म्यूज़िक</button>
          <button type="button" onclick="switchTool('panel-cut', this)">✂️ 6 हिस्से</button>
        </div>
        <div id="panel-filter" class="panel active">
          <div class="preset-row">
            <button type="button" onclick="setPreset('none')">मूल</button>
            <button type="button" onclick="setPreset('grayscale(100%)')">क्लासिक</button>
            <button type="button" onclick="setPreset('sepia(80%)')">विंटेज</button>
            <button type="button" onclick="setPreset('contrast(140%) saturate(160%)')">धाकड़ वाइब</button>
            <button type="button" onclick="setPreset('hue-rotate(120deg)')">रंगीन</button>
          </div>
          <label style="font-size: 12px; display: block; margin-top: 6px;">रंग टोन: <input type="range" id="hue-range" min="0" max="360" value="0" style="width: 100%;"></label>
          <label style="font-size: 12px; display: block; margin-top: 6px;">चमक: <input type="range" id="bright-range" min="50" max="150" value="100" style="width: 100%;"></label>
          <label style="font-size: 12px; display: block; margin-top: 6px;">कंट्रास्ट: <input type="range" id="contrast-range" min="50" max="200" value="100" style="width: 100%;"></label>
        </div>
        <div id="panel-sticker" class="panel">
          <p style="font-size: 11px; color: #aaa; text-align: center;">स्टिकर चुनें और वीडियो पर उंगली से खिसकाएं:</p>
          <div class="sticker-grid">
            <span onclick="chooseSticker('')">❌</span><span onclick="chooseSticker('😎')">😎</span><span onclick="chooseSticker('🤠')">🤠</span><span onclick="chooseSticker('🦁')">🦁</span><span onclick="chooseSticker('🕺')">🕺</span><span onclick="chooseSticker('🔥')">🔥</span><span onclick="chooseSticker('👑')">👑</span>
          </div>
        </div>
        <div id="panel-text" class="panel">
          <input type="text" id="hindi-caption-input" placeholder="वीडियो पर हिंदी में लिखें...">
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
            <span style="font-size: 12px;">टेक्स्ट का रंग:</span>
            <input type="color" id="hindi-color-input" value="#ffffff">
          </div>
        </div>
        <div id="panel-music" class="panel">
          <select id="music-selector">
            <option value="none">ओरिजिनल आवाज़ (No Music)</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">धाकड़ बीट 1</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">देसी स्वैग 2</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">रॉयल वाइब 3</option>
          </select>
          <audio id="editor-audio" loop></audio>
        </div>
        <div id="panel-cut" class="panel">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong style="font-size: 12px; color: #ff9900;">वीडियो के 6 बराबर हिस्से</strong>
            <button type="button" onclick="cutInto6EqualParts()" style="background: #ff2a55; color: #fff; border: none; padding: 5px 10px; border-radius: 7px; font-size: 11px; cursor: pointer;">6 हिस्से बनाएं</button>
          </div>
          <p id="selected-part-info" style="font-size: 11px; color: #00e676; margin-top: 6px;">पूरा वीडियो चुना है</p>
          <div id="six-parts-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px;"></div>
        </div>
        <input type="text" id="post-description" placeholder="कैप्शन लिखें (#धाकड़)...">
        <button type="button" class="post-btn" onclick="publishReel()">🚀 धाकड़ पर अपलोड करें</button>
      </div>
    </section>
    <section id="profile-screen" class="screen">
      <div class="profile-header">
        <div class="dp-container">
          <div class="dp-circle" id="profile-dp-display"><span style="font-size: 34px;">😎</span></div>
          <label for="dp-file-input" class="dp-edit-badge">📷</label>
          <input type="file" id="dp-file-input" accept="image/*,video/*" style="display: none;">
        </div>
        <p style="font-size: 11px; color: #ff9900; margin-bottom: 6px;">(DP पर फोटो या वीडियो दोनों लगा सकते हैं)</p>
        <h2 id="display-username">@dhaakad_user</h2>
        <div class="stats-row">
          <div class="stat-box"><strong id="post-count">0</strong><span>वीडियो</span></div>
          <div class="stat-box"><strong id="follower-count">120</strong><span>फ़ॉलोअर्स</span></div>
          <div class="stat-box"><strong id="saved-count">0</strong><span>सेव्ड</span></div>
        </div>
        <div class="bio-box">
          <label style="font-size: 11px; color: #aaa;">नाम:</label>
          <input type="text" id="edit-name-input" placeholder="अपना नाम लिखें...">
          <label style="font-size: 11px; color: #aaa; display: block; margin-top: 8px;">बायो (Bio):</label>
          <input type="text" id="edit-bio-input" placeholder="अपना बायो लिखें...">
          <button type="button" onclick="saveUserProfile()" style="margin-top: 8px; width: 100%; padding: 8px; background: #252525; color: #fff; border: 1px solid #ff2a55; border-radius: 6px; cursor: pointer;">💾 प्रोफ़ाइल और Bio सेव करें</button>
        </div>
      </div>
      <h4 style="padding: 10px 14px; font-size: 13px; color: #ccc;">मेरे वीडियो</h4>
      <div class="my-videos-grid" id="my-videos-grid"></div>
    </section>
  </main>
  <div id="comment-modal" class="comment-modal" onclick="closeComments(event)">
    <div class="comment-sheet" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>कमेंट्स</strong>
        <button onclick="closeComments()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
      </div>
      <div class="comment-list" id="comment-list"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="new-comment-input" placeholder="कमेंट लिखें..." style="margin-top:0;">
        <button onclick="addComment()" style="background:#ff2a55; border:none; color:#fff; padding:0 14px; border-radius:8px; cursor:pointer;">भेजें</button>
      </div>
    </div>
  </div>
  <nav>
    <button type="button" class="active" onclick="openScreen('feed-screen', this)"><span class="icon">🎬</span><span>रील्स</span></button>
    <button type="button" onclick="openScreen('explore-screen', this)"><span class="icon">🔍</span><span>खोजें</span></button>
    <button type="button" onclick="openScreen('upload-screen', this)"><span class="icon">➕</span><span>अपलोड</span></button>
    <button type="button" onclick="openScreen('profile-screen', this)"><span class="icon">👤</span><span>प्रोफ़ाइल</span></button>
  </nav>
    <script>
    let userProfile = JSON.parse(localStorage.getItem('dhaakad_profile')) || { name: '@dhaakad_king', bio: 'धाकड़ अंदाज़, देसी स्वैग 🔥', dpUrl: '', dpType: 'none', followers: 120 };
    let reelsList = JSON.parse(localStorage.getItem('dhaakad_reels')) || [{
      id: 1, user: '@dhaakad_official',
      videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-man-dancing-under-changing-lights-1240-large.mp4',
      filter: 'contrast(115%)', sticker: '🔥', stickerTop: '20%', stickerLeft: '72%',
      text: 'धाकड़ में आपका स्वागत है!', textColor: '#ffdd00', musicUrl: 'none',
      desc: 'अपना वीडियो बनाएं और शेयर करें #धाकड़ #म्यूज़िक', likes: 48, liked: false, saved: false, following: false, comments: ['जबरदस्त भाई 🔥']
    }];
    let currentUploadedVideoUrl = '', activeCommentIndex = null, activePartRange = null, lastTapTime = 0;

    function openScreen(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById('editor-audio').pause();
      if (screenId === 'feed-screen') renderFeed();
      if (screenId === 'explore-screen') renderExplore();
      if (screenId === 'profile-screen') loadProfileUI();
    }

    const videoPicker = document.getElementById('video-picker');
    const editorVideo = document.getElementById('editor-video');
    const stickerEl = document.getElementById('draggable-sticker');
    const editorAudio = document.getElementById('editor-audio');

    videoPicker.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      currentUploadedVideoUrl = URL.createObjectURL(file);
      editorVideo.src = currentUploadedVideoUrl;
      editorVideo.style.display = 'block';
      document.getElementById('stage-placeholder').style.display = 'none';
      activePartRange = null;
      document.getElementById('selected-part-info').innerText = 'पूरा वीडियो चुना है';
      editorVideo.play();
    });

    function switchTool(panelId, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      document.querySelectorAll('.tool-tabs button').forEach(b => b.classList.remove('active-tab'));
      btn.classList.add('active-tab');
    }

    function setPreset(val) { editorVideo.style.filter = val; }
    const hueRange = document.getElementById('hue-range');
    const brightRange = document.getElementById('bright-range');
    const contrastRange = document.getElementById('contrast-range');
    function updateFilters() {
      editorVideo.style.filter = `hue-rotate(${hueRange.value}deg) brightness(${brightRange.value}%) contrast(${contrastRange.value}%)`;
    }
    hueRange.addEventListener('input', updateFilters);
    brightRange.addEventListener('input', updateFilters);
    contrastRange.addEventListener('input', updateFilters);

    function chooseSticker(emoji) {
      if (!emoji) { stickerEl.style.display = 'none'; }
      else { stickerEl.innerText = emoji; stickerEl.style.display = 'block'; }
    }
    stickerEl.addEventListener('touchmove', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = document.getElementById('editor-stage').getBoundingClientRect();
      stickerEl.style.left = Math.max(0, Math.min(rect.width - 55, touch.clientX - rect.left - 28)) + 'px';
      stickerEl.style.top = Math.max(0, Math.min(rect.height - 55, touch.clientY - rect.top - 28)) + 'px';
    });

    document.getElementById('hindi-caption-input').addEventListener('input', function() {
      document.getElementById('preview-text').innerText = this.value;
    });
    document.getElementById('hindi-color-input').addEventListener('input', function() {
      document.getElementById('preview-text').style.color = this.value;
    });
    document.getElementById('music-selector').addEventListener('change', function() {
      if (this.value === 'none') { editorAudio.pause(); editorVideo.muted = false; }
      else { editorAudio.src = this.value; editorVideo.muted = true; editorAudio.play(); }
    });

    function cutInto6EqualParts() {
      const grid = document.getElementById('six-parts-grid');
      if (!editorVideo.src || isNaN(editorVideo.duration) || editorVideo.duration === 0) { alert('पहले कोई वीडियो चुनें!'); return; }
      const partLen = editorVideo.duration / 6;
      grid.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const start = i * partLen, end = (i + 1) * partLen;
        const box = document.createElement('div');
        box.style.cssText = 'background:#202020; border:1px solid #3c3c3c; border-radius:8px; padding:7px; text-align:center;';
        box.innerHTML = `<div style="font-size:12px; font-weight:bold;">हिस्सा ${i + 1}</div><div style="font-size:10px; color:#bbb; margin:2px 0;">${start.toFixed(1)}s - ${end.toFixed(1)}s</div><button type="button" onclick="previewPart(${start}, ${end}, ${i + 1})" style="background:#333; color:#fff; border:1px solid #666; padding:3px 6px; border-radius:5px; font-size:10px;">▶ देखें</button> <button type="button" onclick="applyPartForPost(${start}, ${end}, ${i + 1})" style="background:#ff2a55; color:#fff; border:none; padding:3px 6px; border-radius:5px; font-size:10px;">✔ लगाएं</button>`;
        grid.appendChild(box);
      }
    }
    function previewPart(start, end, partNum) {
      editorVideo.currentTime = start; editorVideo.play();
      editorVideo.ontimeupdate = () => { if (editorVideo.currentTime >= end) { editorVideo.pause(); editorVideo.ontimeupdate = null; } };
      document.getElementById('selected-part-info').innerText = `हिस्सा ${partNum} चल रहा है (${start.toFixed(1)}s - ${end.toFixed(1)}s)`;
    }
    function applyPartForPost(start, end, partNum) {
      activePartRange = { partNum, start, end };
      editorVideo.currentTime = start; editorVideo.pause();
      const desc = document.getElementById('post-description');
      if (!desc.value.includes(`हिस्सा ${partNum}/6`)) desc.value = (desc.value + ` [हिस्सा ${partNum}/6] #हिस्सा`).trim();
      document.getElementById('selected-part-info').innerText = `✔ हिस्सा ${partNum}/6 तैयार है!`;
    }
            function publishReel() {
      if (!currentUploadedVideoUrl) { alert('कृपया पहले कोई वीडियो चुनें!'); return; }
      const newReel = {
        id: Date.now(), user: userProfile.name, videoUrl: currentUploadedVideoUrl,
        filter: editorVideo.style.filter || 'none', sticker: stickerEl.style.display === 'none' ? '' : stickerEl.innerText,
        stickerTop: stickerEl.style.top || '35%', stickerLeft: stickerEl.style.left || '40%',
        text: document.getElementById('preview-text').innerText, textColor: document.getElementById('hindi-color-input').value,
        musicUrl: document.getElementById('music-selector').value, startSec: activePartRange ? activePartRange.start : 0,
        endSec: activePartRange ? activePartRange.end : null,
        desc: document.getElementById('post-description').value || 'नया धाकड़ वीडियो 🔥 #धाकड़',
        likes: 0, liked: false, saved: false, following: false, comments: []
      };
      reelsList.unshift(newReel);
      try { localStorage.setItem('dhaakad_reels', JSON.stringify(reelsList)); } catch(e) {}
      alert('वीडियो धाकड़ पर अपलोड हो गया 🎉');
      openScreen('feed-screen', document.querySelectorAll('nav button')[0]);
    }

    function renderFeed() {
      const container = document.getElementById('reels-container');
      container.innerHTML = '';
      reelsList.forEach((reel, idx) => {
        const dpHtml = userProfile.dpType === 'video' && userProfile.dpUrl ? `<video src="${userProfile.dpUrl}" autoplay loop muted playsinline></video>` : (userProfile.dpType === 'image' && userProfile.dpUrl ? `<img src="${userProfile.dpUrl}">` : `<span>😎</span>`);
        const card = document.createElement('div');
        card.className = 'reel-card';
        card.innerHTML = `<div class="big-heart" id="heart-${idx}">❤️</div><video id="reel-vid-${idx}" src="${reel.videoUrl}" style="filter:${reel.filter}" loop playsinline onclick="handleVideoTap(this, ${idx})"></video>${reel.sticker ? `<div class="reel-overlay-sticker" style="top:${reel.stickerTop}; left:${reel.stickerLeft};">${reel.sticker}</div>` : ''}${reel.text ? `<div class="reel-overlay-text" style="color:${reel.textColor};">${reel.text}</div>` : ''}${reel.musicUrl !== 'none' ? `<audio id="feed-audio-${idx}" src="${reel.musicUrl}" loop></audio>` : ''}<div class="reel-actions"><button class="action-btn" onclick="toggleLike(${idx})">${reel.liked ? '❤️' : '🤍'}<span>${reel.likes}</span></button><button class="action-btn" onclick="openComments(${idx})">💬<span>${reel.comments.length}</span></button><button class="action-btn" onclick="shareReel(${idx})">📤<span>शेयर</span></button><button class="action-btn" onclick="toggleSave(${idx})">${reel.saved ? '🔖' : '📑'}<span>सेव</span></button></div><div class="reel-info"><div class="user-row"><div class="mini-dp">${dpHtml}</div><strong>${reel.user}</strong><button class="follow-btn ${reel.following ? 'following' : ''}" onclick="toggleFollow(${idx})">${reel.following ? 'Following' : '+ Follow'}</button></div><p style="font-size:13px; color:#eee;">${reel.desc}</p></div>`;
        container.appendChild(card);
        const vid = card.querySelector('video');
        if (reel.startSec) vid.currentTime = reel.startSec;
        if (reel.endSec) vid.ontimeupdate = () => { if (vid.currentTime >= reel.endSec) vid.currentTime = reel.startSec || 0; };
        if (idx === 0) { vid.muted = true; vid.play().catch(() => {}); }
      });
    }

    function handleVideoTap(vid, idx) {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        if (!reelsList[idx].liked) toggleLike(idx);
        const heart = document.getElementById(`heart-${idx}`);
        heart.classList.add('show');
        setTimeout(() => heart.classList.remove('show'), 500);
      } else {
        const audio = document.getElementById(`feed-audio-${idx}`);
        if (vid.paused) { vid.play(); if (audio) { vid.muted = true; audio.play(); } else vid.muted = false; }
        else { vid.pause(); if (audio) audio.pause(); }
      }
      lastTapTime = now;
    }

    function toggleLike(idx) { reelsList[idx].liked = !reelsList[idx].liked; reelsList[idx].likes += reelsList[idx].liked ? 1 : -1; renderFeed(); }
    function toggleSave(idx) { reelsList[idx].saved = !reelsList[idx].saved; renderFeed(); }
    function toggleFollow(idx) { reelsList[idx].following = !reelsList[idx].following; userProfile.followers += reelsList[idx].following ? 1 : -1; localStorage.setItem('dhaakad_profile', JSON.stringify(userProfile)); renderFeed(); }
    function shareReel(idx) {
      const text = `धाकड़ पर देखें: ${reelsList[idx].user} — ${reelsList[idx].desc}`;
      if (navigator.share) navigator.share({ title: 'धाकड़', text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('लिंक कॉपी हो गया!'));
      else alert(text);
    }

    function openComments(idx) { activeCommentIndex = idx; document.getElementById('comment-modal').classList.add('open'); renderCommentList(); }
    function closeComments(e) { if (!e || e.target.id === 'comment-modal') document.getElementById('comment-modal').classList.remove('open'); }
    function renderCommentList() {
      const list = document.getElementById('comment-list');
      const comments = reelsList[activeCommentIndex].comments || [];
      list.innerHTML = comments.length ? comments.map(c => `<div class="comment-item">${c}</div>`).join('') : `<p style="color:#888; font-size:12px;">अभी कोई कमेंट नहीं है।</p>`;
    }
    function addComment() {
      const input = document.getElementById('new-comment-input');
      const val = input.value.trim();
      if (!val || activeCommentIndex === null) return;
      reelsList[activeCommentIndex].comments.push(`${userProfile.name}: ${val}`);
      input.value = ''; renderCommentList(); renderFeed();
    }

    function filterByTag(tag) { document.getElementById('search-input').value = tag; renderExplore(); }
    function renderExplore() {
      const q = (document.getElementById('search-input').value || '').toLowerCase();
      const grid = document.getElementById('explore-grid');
      grid.innerHTML = '';
      reelsList.filter(r => r.desc.toLowerCase().includes(q) || r.user.toLowerCase().includes(q) || r.text.toLowerCase().includes(q)).forEach(r => {
        const card = document.createElement('div');
        card.className = 'explore-card';
        card.innerHTML = `<video src="${r.videoUrl}" style="filter:${r.filter}" muted></video><p>${r.desc}</p>`;
        card.onclick = () => openScreen('feed-screen', document.querySelectorAll('nav button')[0]);
        grid.appendChild(card);
      });
    }

    document.getElementById('dp-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const isVideo = file.type.startsWith('video/');
      const reader = new FileReader();
      reader.onload = function(ev) {
        userProfile.dpUrl = ev.target.result;
        userProfile.dpType = isVideo ? 'video' : 'image';
        try { localStorage.setItem('dhaakad_profile', JSON.stringify(userProfile)); } catch (err) { userProfile.dpUrl = URL.createObjectURL(file); }
        loadProfileUI();
      };
      reader.readAsDataURL(file);
    });

    function saveUserProfile() {
      const n = document.getElementById('edit-name-input').value.trim();
      const b = document.getElementById('edit-bio-input').value.trim();
      if (n) userProfile.name = n;
      userProfile.bio = b;
      localStorage.setItem('dhaakad_profile', JSON.stringify(userProfile));
      loadProfileUI();
      alert('प्रोफ़ाइल और Bio सेव हो गई!');
    }

    function loadProfileUI() {
      document.getElementById('display-username').innerText = userProfile.name;
      document.getElementById('edit-name-input').value = userProfile.name;
      document.getElementById('edit-bio-input').value = userProfile.bio;
      document.getElementById('follower-count').innerText = userProfile.followers;
      document.getElementById('post-count').innerText = reelsList.length;
      document.getElementById('saved-count').innerText = reelsList.filter(r => r.saved).length;
      const dpBox = document.getElementById('profile-dp-display');
      if (userProfile.dpType === 'video' && userProfile.dpUrl) dpBox.innerHTML = `<video src="${userProfile.dpUrl}" autoplay loop muted playsinline></video>`;
      else if (userProfile.dpType === 'image' && userProfile.dpUrl) dpBox.innerHTML = `<img src="${userProfile.dpUrl}">`;
      else dpBox.innerHTML = `<span style="font-size:34px;">😎</span>`;
      const grid = document.getElementById('my-videos-grid');
      grid.innerHTML = '';
      reelsList.forEach(r => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `<video src="${r.videoUrl}" style="filter:${r.filter}" muted></video>`;
        grid.appendChild(item);
      });
    }

    renderFeed();
    loadProfileUI();
  </script>
</body>
</html>
