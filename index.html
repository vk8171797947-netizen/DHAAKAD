<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DHAAKAD Social</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:#000; --txt:#fff; --nav:#111; --bdr:#262626; --post:#111;
            --box:#1a1a1a; --inp:#0a0a0a; --muted:#9ca3af; --accent:#ff7900;
            --danger:#ff3b30; --ok:#22c55e;
        }
        .light-mode {
            --bg:#f2f4f7; --txt:#0f172a; --nav:#fff; --bdr:#e2e8f0; --post:#fff;
            --box:#f8fafc; --inp:#fff; --muted:#64748b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--txt); padding-bottom:78px; transition:0.25s; }
        .navbar {
            background:var(--nav); border-bottom:1px solid var(--bdr); position:sticky; top:0; z-index:30;
            padding:11px 15px; display:flex; justify-content:space-between; align-items:center;
        }
        .logo {
            background:linear-gradient(45deg,#ff7900,#ff3b30); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            font-weight:bold; font-size:22px; letter-spacing:1px;
        }
        .nav-icons { display:flex; gap:6px; align-items:center; }
        .icon-btn { position:relative; background:none; border:none; color:var(--txt); font-size:19px; padding:7px; cursor:pointer; border-radius:50%; }
        .icon-btn:active { background:var(--box); }
        .badge {
            position:absolute; top:2px; right:1px; background:var(--danger); color:#fff; font-size:10px;
            font-weight:bold; min-width:16px; height:16px; border-radius:999px; display:none;
            align-items:center; justify-content:center; padding:0 4px;
        }
        .bottom-nav {
            position:fixed; bottom:0; left:0; width:100%; background:var(--nav); border-top:1px solid var(--bdr);
            display:flex; justify-content:space-around; align-items:center; padding:8px 0; z-index:30;
        }
        .b-btn {
            background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;
            padding:4px 10px; display:flex; flex-direction:column; align-items:center; gap:2px;
        }
        .b-btn span { font-size:10px; }
        .b-btn.active { color:var(--accent); font-weight:bold; }
        .container { max-width:480px; margin:0 auto; padding:10px; }
        .section { display:none; }
        .section.active { display:block; }

        /* Status Bar */
        .status-bar {
            display:flex; gap:12px; overflow-x:auto; padding:6px 2px 12px;
            border-bottom:1px solid var(--bdr); margin-bottom:12px; scrollbar-width:none;
        }
        .status-bar::-webkit-scrollbar { display:none; }
        #statusList { display:flex; gap:12px; }
        .status-item { display:flex; flex-direction:column; align-items:center; min-width:68px; cursor:pointer; }
        .status-ring {
            width:64px; height:64px; border-radius:50%; padding:2.5px;
            background:linear-gradient(45deg,#ff7900,#ff3b30,#eab308); margin-bottom:4px;
        }
        .status-ring.add-ring { background:none; border:2px dashed var(--accent); padding:0; }
        .status-avatar {
            width:100%; height:100%; border-radius:50%; background:var(--post); color:var(--txt);
            display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px;
            overflow:hidden; border:2px solid var(--bg);
        }
        .status-avatar img { width:100%; height:100%; object-fit:cover; }
        .status-name { font-size:11px; max-width:72px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }

        /* Posts */
        .post { background:var(--post); border:1px solid var(--bdr); border-radius:12px; margin-bottom:16px; overflow:hidden; }
        .post-header {
            padding:10px 12px; font-weight:bold; font-size:14px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .author-wrap { display:flex; align-items:center; gap:8px; color:var(--txt); }
        .mini-ava {
            width:30px; height:30px; border-radius:50%; background:var(--accent); color:#000;
            display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold;
        }
        .post-header-right { display:flex; gap:6px; align-items:center; }
        .follow-btn {
            background:var(--accent); color:#000; border:none; padding:5px 11px;
            border-radius:7px; font-weight:bold; cursor:pointer; font-size:12px;
        }
        .follow-btn.following { background:var(--box); color:var(--txt); border:1px solid var(--bdr); }
        .del-btn {
            background:var(--danger); color:#fff; border:none; padding:5px 9px;
            border-radius:7px; font-weight:bold; cursor:pointer; font-size:12px;
        }
        .post-media {
            position:relative; width:100%; min-height:220px; background:var(--box);
            display:flex; align-items:center; justify-content:center; font-size:18px;
            padding:16px; text-align:center; border-top:1px solid var(--bdr);
            border-bottom:1px solid var(--bdr); cursor:pointer; user-select:none;
        }
                .post-media.text-card {
            background:linear-gradient(135deg,#1f2937,#ff7900); color:#fff; font-weight:bold;
            min-height:240px; padding:24px;
        }
        .post-media img, .post-media video { width:100%; max-height:400px; object-fit:cover; border-radius:6px; }
        .heart-pop {
            position:absolute; font-size:68px; color:var(--danger); opacity:0;
            transform:scale(0.5); transition:0.3s; pointer-events:none;
        }
        .heart-pop.show { opacity:0.95; transform:scale(1.15); }
        .post-footer { padding:11px 12px; }
        .post-actions { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
        .post-actions-left { display:flex; gap:12px; align-items:center; }
        .action-btn {
            background:none; border:none; color:var(--txt); font-size:21px; padding:3px;
            cursor:pointer; display:inline-flex; align-items:center; gap:4px;
        }
        .liked { color:var(--danger) !important; }
        .saved { color:var(--accent) !important; }
        .post-footer p { font-size:14px; margin-bottom:5px; line-height:1.38; }
        .comments-list {
            margin-top:6px; padding-top:6px; border-top:1px solid var(--bdr);
            font-size:13px; color:var(--muted);
        }
        .cmt-item {
            display:flex; justify-content:space-between; align-items:center;
            gap:8px; margin-bottom:5px; padding:4px 6px; border-radius:6px; background:var(--box);
        }
        .cmt-del {
            background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; padding:2px 4px;
        }
        .comment-box { display:none; margin-top:8px; gap:6px; }
        .comment-box.open { display:flex; }
        .comment-box input {
            flex:1; padding:8px 10px; background:var(--inp); border:1px solid var(--bdr);
            color:var(--txt); border-radius:7px; font-size:13px;
        }
        .comment-box button {
            background:var(--accent); color:#000; border:none; padding:8px 13px;
            border-radius:7px; font-weight:bold; cursor:pointer; font-size:13px;
        }

        /* Forms & Cards */
        .inp {
            width:100%; padding:10px 12px; background:var(--inp); border:1px solid var(--bdr);
            color:var(--txt); border-radius:8px; font-size:14px; margin-bottom:10px;
        }
        .btn {
            width:100%; background:var(--accent); color:#000; border:none; padding:10px 12px;
            font-weight:bold; cursor:pointer; border-radius:8px; font-size:14px;
        }
        .btn-sec { background:var(--box); color:var(--txt); border:1px solid var(--bdr); }
        .btn-danger { background:var(--danger); color:#fff; }
        .card {
            background:var(--post); border:1px solid var(--bdr); border-radius:12px;
            padding:14px; margin-bottom:14px;
        }
        .filter-row { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; }
        .pill {
            padding:6px 12px; border-radius:999px; border:1px solid var(--bdr);
            background:var(--box); color:var(--txt); cursor:pointer; font-size:12px; white-space:nowrap;
        }
        .pill.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:bold; }

        /* Reels */
        .reel-card {
            background:var(--post); border:1px solid var(--bdr); border-radius:12px;
            overflow:hidden; margin-bottom:16px;
        }
        .reel-media {
            width:100%; height:360px; background:linear-gradient(135deg,#111827,#374151);
            display:flex; align-items:center; justify-content:center; color:#fff; position:relative;
        }
        .reel-media video, .reel-media img { width:100%; height:100%; object-fit:cover; }
        .reel-overlay { padding:12px; }
        .reel-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .reel-actions { display:flex; gap:14px; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid var(--bdr); }

        /* Chat / DM */
        .chat-users { display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; align-items:center; }
        .chat-box {
            height:280px; overflow-y:auto; background:var(--box); border:1px solid var(--bdr);
            border-radius:10px; padding:10px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;
        }
        .msg { max-width:80%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.35; word-break:break-word; }
        .msg.me { align-self:flex-end; background:var(--accent); color:#000; font-weight:bold; }
        .msg.them { align-self:flex-start; background:var(--post); border:1px solid var(--bdr); }

        /* Profile */
        .profile-head { text-align:center; }
        .profile-avatar {
            width:86px; height:86px; border-radius:50%; background:var(--accent); color:#000;
            font-size:34px; display:flex; align-items:center; justify-content:center;
            margin:0 auto 10px; overflow:hidden; font-weight:bold;
        }
        .profile-avatar img { width:100%; height:100%; object-fit:cover; }
        .stats-row {
            display:flex; justify-content:space-around; margin:12px 0; padding:10px 0;
            border-top:1px solid var(--bdr); border-bottom:1px solid var(--bdr); font-size:13px;
        }
        .stat-click { cursor:pointer; }
        .tabs-row { display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; }
        .tab-btn {
            flex:1; min-width:90px; padding:8px; border-radius:7px; border:1px solid var(--bdr);
            background:var(--box); color:var(--txt); font-weight:bold; cursor:pointer; font-size:12px;
        }
        .tab-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }
        .mini-post {
            background:var(--box); border:1px solid var(--bdr); border-radius:8px;
            padding:9px; margin-bottom:8px; font-size:13px; text-align:left;
        }
        .mini-post img { width:100%; max-height:180px; object-fit:cover; border-radius:6px; margin-bottom:6px; }

        /* Modals & Toast */
        .modal {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
            z-index:100; justify-content:center; align-items:center; padding:15px;
        }
        .modal.open { display:flex; }
        .modal-content {
            background:var(--post); padding:18px; border-radius:12px; width:100%;
            max-width:370px; border:1px solid var(--bdr); text-align:center;
        }
        .modal-content h3 { margin-bottom:12px; color:var(--accent); }
        .row { display:flex; gap:8px; }
        .status-view-box {
            min-height:200px; background:var(--box); border-radius:10px; padding:14px;
            margin:10px 0 12px; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:10px;
        }
        .status-view-box img { max-width:100%; max-height:240px; border-radius:8px; }
        #toast {
            visibility:hidden; min-width:220px; max-width:90vw; background:var(--accent);
            color:#000; font-weight:bold; text-align:center; border-radius:25px;
            padding:10px 16px; position:fixed; z-index:200; left:50%; bottom:74px;
            transform:translateX(-50%); font-size:13px;
        }
        #toast.show { visibility:visible; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">DHAAKAD</div>
        <div class="nav-icons">
            <button type="button" class="icon-btn" id="themeBtn" title="थीम बदलें"><i class="fa-solid fa-moon"></i></button>
            <button type="button" class="icon-btn" id="notifOpenBtn" title="नोटिफिकेशन">
                <i class="fa-regular fa-heart"></i>
                <span class="badge" id="notifBadge">0</span>
            </button>
            <button type="button" class="icon-btn" id="dmOpenBtn" title="मैसेज (DM)"><i class="fa-regular fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="container">
        <!-- HOME -->
        <div class="section active" id="secHome">
            <div class="status-bar">
                <div class="status-item" id="addStatusBtn">
                    <div class="status-ring add-ring"><div class="status-avatar"><i class="fa-solid fa-plus" style="color:var(--accent);"></i></div></div>
                    <span class="status-name">स्टोरी लगाएं</span>
                </div>
                <div id="statusList"></div>
            </div>
            <div class="filter-row" id="feedFilterBar">
                <button type="button" class="pill active" data-filter="all">सभी पोस्ट्स</button>
                <button type="button" class="pill" data-filter="following">फ़ॉलोइंग</button>
                <button type="button" class="pill" data-filter="media">फ़ोटो वाली</button>
            </div>
            <div id="feed"></div>
        </div>
                <!-- EXPLORE -->
        <div class="section" id="secExplore">
            <input type="text" class="inp" id="exploreSearchInp" placeholder="यूज़रनेम या कैप्शन खोजें...">
            <div id="exploreResults"></div>
        </div>

        <!-- REELS -->
        <div class="section" id="secReels">
            <div class="card">
                <h3 style="color:var(--accent); margin-bottom:10px; font-size:16px;">नई रील बनाएं</h3>
                <input type="text" class="inp" id="reelCaptionInp" placeholder="रील कैप्शन लिखें...">
                <input type="file" class="inp" id="reelFileInp" accept="video/*,image/*">
                <button type="button" class="btn" id="addReelBtn">रील पोस्ट करें</button>
            </div>
            <div id="reelsList"></div>
        </div>

        <!-- NOTIFICATIONS -->
        <div class="section" id="secNotif">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="color:var(--accent); font-size:16px;">नोटिफिकेशन</h3>
                    <button type="button" class="btn btn-sec" style="width:auto; padding:6px 12px; font-size:12px;" id="clearNotifBtn">साफ़ करें</button>
                </div>
                <div id="notifList"></div>
            </div>
        </div>

        <!-- DM -->
        <div class="section" id="secDm">
            <div class="card">
                <h3 style="color:var(--accent); margin-bottom:10px; font-size:16px;">डायरेक्ट मैसेज (DM)</h3>
                <div class="row" style="margin-bottom:10px;">
                    <input type="text" class="inp" id="newChatUserInp" placeholder="नया यूज़र जोड़ें..." style="margin-bottom:0;">
                    <button type="button" class="btn btn-sec" id="addChatUserBtn" style="width:auto; padding:0 12px; font-size:12px;">जोड़ें</button>
                </div>
                <div class="chat-users" id="chatUsersBar"></div>
                <div class="chat-box" id="chatMessagesBox"></div>
                <div class="row">
                    <input type="text" class="inp" id="chatMsgInp" placeholder="मैसेज लिखें..." style="margin-bottom:0;">
                    <button type="button" class="btn" id="sendChatBtn" style="width:auto; padding:0 16px;">भेजें</button>
                </div>
            </div>
        </div>

        <!-- PROFILE -->
        <div class="section" id="secProfile">
            <div class="card profile-head">
                <div class="profile-avatar" id="profileAvatarBox">D</div>
                <h2 id="displayUsername">DHAAKAD_USER</h2>
                <p id="displayBio" style="color:var(--muted); font-size:13px; margin-top:4px;">धाकड़ सोशल क्रिएटर 🚀</p>
                <div class="stats-row">
                    <div class="stat-click" id="stPostsBox"><b id="stPosts">0</b><br><span style="color:var(--muted);">पोस्ट्स</span></div>
                    <div class="stat-click" id="stFollowersBox"><b id="stFollowers">128</b><br><span style="color:var(--muted);">फ़ॉलोअर्स</span></div>
                    <div class="stat-click" id="stFollowingBox"><b id="stFollowing">0</b><br><span style="color:var(--muted);">फ़ॉलोइंग</span></div>
                </div>
                <div class="row" style="margin-bottom:8px;">
                    <input type="text" class="inp" id="newUsernameInput" placeholder="नया यूज़रनेम..." style="margin-bottom:0;">
                    <button type="button" class="btn" id="saveUsernameBtn" style="width:auto; padding:0 14px;">बदलो</button>
                </div>
                <div class="row" style="margin-bottom:8px;">
                    <input type="text" class="inp" id="newBioInput" placeholder="नया बायो..." style="margin-bottom:0;">
                    <button type="button" class="btn" id="saveBioBtn" style="width:auto; padding:0 14px;">बायो</button>
                </div>
                <input type="file" accept="image/*" id="newAvatarInput" class="inp" style="font-size:12px;">
                <div class="tabs-row">
                    <button type="button" class="tab-btn active" data-ptab="my">मेरी पोस्ट्स</button>
                    <button type="button" class="tab-btn" data-ptab="savedPosts">सेव्ड पोस्ट्स</button>
                    <button type="button" class="tab-btn" data-ptab="savedReels">सेव्ड रील्स</button>
                </div>
                <div id="profileGrid"></div>
                <div class="row" style="margin-top:14px;">
                    <button type="button" class="btn btn-sec" id="exportDataBtn" style="font-size:12px;">बैकअप कॉपी करें</button>
                    <button type="button" class="btn btn-danger" id="resetDataBtn" style="font-size:12px;">डेटा रीसेट</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button type="button" class="b-btn active" data-target="secHome"><i class="fa-solid fa-house"></i><span>होम</span></button>
        <button type="button" class="b-btn" data-target="secExplore"><i class="fa-solid fa-magnifying-glass"></i><span>खोजें</span></button>
        <button type="button" class="b-btn" id="openCreatePostBtn"><i class="fa-regular fa-square-plus"></i><span>पोस्ट</span></button>
        <button type="button" class="b-btn" data-target="secReels"><i class="fa-solid fa-clapperboard"></i><span>रील्स</span></button>
        <button type="button" class="b-btn" data-target="secProfile"><i class="fa-regular fa-user"></i><span>प्रोफ़ाइल</span></button>
    </nav>

    <!-- CREATE POST MODAL -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <h3>नई पोस्ट बनाएं</h3>
            <input type="text" class="inp" id="captionInput" placeholder="कैप्शन लिखें...">
            <input type="file" class="inp" id="imageInput" accept="image/*">
            <div class="row">
                <button type="button" class="btn btn-sec" id="cancelPostBtn">बंद करें</button>
                <button type="button" class="btn" id="submitPostBtn">पोस्ट करें</button>
            </div>
        </div>
    </div>

    <!-- ADD STATUS MODAL -->
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <h3>24 घंटे की स्टोरी लगाएं</h3>
            <input type="text" class="inp" id="statusTextInput" placeholder="अपनी स्टोरी लिखें...">
            <input type="file" class="inp" id="statusImageInput" accept="image/*">
            <div class="row">
                <button type="button" class="btn btn-sec" id="cancelStatusBtn">बंद करें</button>
                <button type="button" class="btn" id="submitStatusBtn">लगाएं</button>
            </div>
        </div>
    </div>

    <!-- VIEW STATUS MODAL -->
    <div class="modal" id="viewStatusModal">
        <div class="modal-content">
            <h3 id="viewStatusUser">यूज़र</h3>
            <div id="viewStatusTime" style="font-size:12px; color:var(--muted);"></div>
            <div class="status-view-box" id="viewStatusContent"></div>
            <div class="row" style="margin-bottom:8px;">
                <input type="text" class="inp" id="statusReplyInp" placeholder="स्टोरी पर रिप्लाई भेजें..." style="margin-bottom:0;">
                <button type="button" class="btn" id="sendStatusReplyBtn" style="width:auto; padding:0 12px;">भेजें</button>
            </div>
            <div class="row">
                <button type="button" class="btn btn-danger" id="deleteStatusBtn">डिलीट</button>
                <button type="button" class="btn btn-sec" id="closeViewStatusBtn">बंद करें</button>
            </div>
        </div>
    </div>

    <div id="toast">मैसेज</div>

    <script>
        const $ = id => document.getElementById(id);
        const DAY_MS = 24 * 60 * 60 * 1000;
        const STORE_KEY = "dhaakad_social_pro_v2";
        const THEME_KEY = "dhaakad_social_theme_v2";

        const defaultData = {
            user: { name: "DHAAKAD_USER", bio: "धाकड़ सोशल क्रिएटर 🚀", avatar: "" },
            following: ["DHAAKAD_OFFICIAL"],
            posts: [
                {
                    id: "p1", author: "DHAAKAD_OFFICIAL",
                    caption: "🔥 DHAAKAD Social — फ़ोटो, स्टोरी, रील्स, कमेंट और DM सब एक जगह!",
                    media: "", likes: 1245, liked: false, saved: false,
                    comments: [{ id: "c1", user: "RAHUL_VLOGS", text: "एकदम धाकड़ ऐप है भाई!" }]
                }
            ],
            reels: [
                {

        function loadData() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return structuredClone(defaultData);
                const d = JSON.parse(raw);
                return {
                    user: { ...defaultData.user, ...(d.user || {}) },
                    following: Array.isArray(d.following) ? d.following : [],
                    posts: Array.isArray(d.posts) ? d.posts : structuredClone(defaultData.posts),
                    reels: Array.isArray(d.reels) ? d.reels : structuredClone(defaultData.reels),
                    statuses: Array.isArray(d.statuses) ? d.statuses : [],
                    notifications: Array.isArray(d.notifications) ? d.notifications : [],
                    chats: d.chats && typeof d.chats === "object" ? d.chats : structuredClone(defaultData.chats)
                };
            } catch (e) {
                return structuredClone(defaultData);
            }
        }

        let db = loadData();
        let activeStatusId = null;
        let activeChatUser = Object.keys(db.chats)[0] || "DHAAKAD_OFFICIAL";
        let profileTab = "my";
        let feedFilter = "all";

        function saveData() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(db));
            } catch (e) {
                toast("स्टोरेज भर गया है! छोटी फ़ाइल चुनें या डेटा रीसेट करें।");
            }
        }

        function toast(msg) {
            const t = $("toast");
            t.innerText = msg;
            t.className = "show";
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => { t.className = ""; }, 2400);
        }

        function notify(text) {
            const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            db.notifications.unshift({ text, time });
            if (db.notifications.length > 50) db.notifications.pop();
            saveData();
            renderNotifications();
        }

        }

            if (secId === "secProfile") renderProfile();
            if (secId === "secExplore") renderExplore();
            if (secId === "secReels") renderReels();
            if (secId === "secNotif") renderNotifications();

        /* STATUSES (24h) */
        function cleanStatuses() {
            const now = Date.now(), prev = db.statuses.length;
            db.statuses = db.statuses.filter(s => s.exp > now);
            if (db.statuses.length !== prev) saveData();
        }

        function renderStatuses() {
            cleanStatuses();
            const list = $("statusList");
            list.innerHTML = "";
            db.statuses.forEach(st => {
                const div = document.createElement("div");
                div.className = "status-item";
                div.innerHTML = `
                    <div class="status-ring">
                        <div class="status-avatar">${st.img ? `<img src="${st.img}" alt="st">` : st.author.charAt(0).toUpperCase()}</div>
                    </div>
                    <span class="status-name">${st.author}</span>`;
                div.onclick = () => {
                    cleanStatuses();
                    const cur = db.statuses.find(x => x.id === st.id);
                    if (!cur) { renderStatuses(); return toast("स्टोरी के 24 घंटे पूरे हो गए!"); }
                    activeStatusId = cur.id;
                    const remMs = Math.max(0, cur.exp - Date.now());
                    const hrs = Math.floor(remMs / 3600000);
                    const mins = Math.floor((remMs % 3600000) / 60000);
                    $("viewStatusUser").innerText = cur.author;
                    $("viewStatusTime").innerText = `बाकी समय: ${hrs} घंटे ${mins} मिनट`;
                    $("viewStatusContent").innerHTML = `
                        ${cur.img ? `<img src="${cur.img}" alt="status">` : ""}
                        ${cur.text ? `<p style="font-size:15px; font-weight:bold;">${cur.text}</p>` : ""}`;
                    $("statusReplyInp").value = "";
                    $("viewStatusModal").classList.add("open");
                };
                list.appendChild(div);
            });
        }

        $("addStatusBtn").onclick = () => $("statusModal").classList.add("open");
        $("cancelStatusBtn").onclick = () => {
            $("statusModal").classList.remove("open");
            $("statusTextInput").value = ""; $("statusImageInput").value = "";
        };
        $("closeViewStatusBtn").onclick = () => {
            $("viewStatusModal").classList.remove("open");
            activeStatusId = null;
        };
        $("deleteStatusBtn").onclick = () => {
            if (!activeStatusId) return;
            db.statuses = db.statuses.filter(s => s.id !== activeStatusId);
            activeStatusId = null;
            saveData(); renderStatuses();
            $("viewStatusModal").classList.remove("open");
            toast("स्टोरी डिलीट हो गई! 🗑️");
        };
        $("sendStatusReplyBtn").onclick = () => {
            if (!activeStatusId) return;
            const st = db.statuses.find(x => x.id === activeStatusId);
            const txt = $("statusReplyInp").value.trim();
            if (!st || !txt) return toast("रिप्लाई मैसेज लिखें!");
            if (!db.chats[st.author]) db.chats[st.author] = [];
            db.chats[st.author].push({ from: "me", text: `स्टोरी रिप्लाई: ${txt}` });
            activeChatUser = st.author;
            saveData();
            $("statusReplyInp").value = "";
            $("viewStatusModal").classList.remove("open");
            toast(`${st.author} को DM में रिप्लाई भेजा गया! ✉️`);
        };
        $("submitStatusBtn").onclick = () => {
            const text = $("statusTextInput").value.trim(), file = $("statusImageInput").files[0];
            if (!text && !file) return toast("स्टोरी टेक्स्ट या फ़ोटो चुनें!");
            const pushStatus = (img = "") => {
                db.statuses.unshift({ id: "s-" + Date.now(), author: db.user.name, text, img, exp: Date.now() + DAY_MS });
                saveData(); renderStatuses();
                $("statusModal").classList.remove("open");
                $("statusTextInput").value = ""; $("statusImageInput").value = "";
                notify(`${db.user.name} ने नई स्टोरी लगाई।`);
                toast("स्टोरी लाइव हो गई! 🔥");
            };
            if (file) {
                const r = new FileReader();
                r.onload = e => pushStatus(e.target.result);
                r.readAsDataURL(file);
            } else {
                pushStatus();
            }
        };

        /* CREATE POST */
        $("openCreatePostBtn").onclick = () => $("postModal").classList.add("open");
        $("cancelPostBtn").onclick = () => {

        $("submitPostBtn").onclick = () => {

                toast("पोस्ट लाइव हो गई! ✅");
            };
            if (file) {
                const r = new FileReader();
                r.onload = e => pushPost(e.target.result);
                r.readAsDataURL(file);
            } else {
                pushPost();
            }
        };

        /* FEED */
        $("feedFilterBar").onclick = e => {
            const pill = e.target.closest(".pill");
            if (!pill) return;
            feedFilter = pill.dataset.filter;
            document.querySelectorAll("#feedFilterBar .pill").forEach(p => p.classList.toggle("active", p === pill));
            renderFeed();

        function getFilteredPosts() {
            if (feedFilter === "following") return db.posts.filter(p => db.following.includes(p.author));
            if (feedFilter === "media") return db.posts.filter(p => Boolean(p.media));
            return db.posts;
        }

        function renderFeed() {
            const feedEl = $("feed");
            const list = getFilteredPosts();
            if (!list.length) {
                feedEl.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">इस फ़िल्टर में अभी कोई पोस्ट नहीं है।</div>`;
                return;
            }
            feedEl.innerHTML = list.map(p => {
                const isFollowing = db.following.includes(p.author);

                    <div class="cmt-item" data-cid="${c.id}">
                        <span><b>${c.user}:</b> ${c.text}</span>

                    </div>`).join("");

                return `

                            ${canDelete ? `<button type="button" class="del-btn" title="पोस्ट डिलीट करें"><i class="fa-solid fa-trash"></i></button>` : ""}

                    </div>
                    <div class="post-footer">
                        <div class="post-actions">
                            <div class="post-actions-left">

                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        $("feed").onclick = e => {
            const postEl = e.target.closest(".post");
            if (!postEl) return;
            const post = db.posts.find(x => x.id === postEl.dataset.id);
            if (!post) return;

            if (e.target.closest(".like-btn")) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                saveData(); renderFeed();
                if (post.liked) notify(`आपने ${post.author} की पोस्ट लाइक की।`);
            } else if (e.target.closest(".cmt-toggle-btn")) {
                const box = postEl.querySelector(".comment-box");
                box.classList.toggle("open");
                if (box.classList.contains("open")) box.querySelector("input").focus();
            } else if (e.target.closest(".cmt-send-btn")) {
                const inp = postEl.querySelector(".comment-box input");
                const txt = inp.value.trim();
                if (!txt) return toast("कमेंट लिखें!");
                post.comments = post.comments || [];
                post.comments.push({ id: "c-" + Date.now(), user: db.user.name, text: txt });
                inp.value = "";
                saveData(); renderFeed();
                notify(`${db.user.name} ने ${post.author} की पोस्ट पर कमेंट किया।`);
                toast("कमेंट जुड़ गया! 💬");
            } else if (e.target.closest(".cmt-del")) {
                const cmtEl = e.target.closest(".cmt-item");
                if (!cmtEl) return;
                post.comments = (post.comments || []).filter(c => c.id !== cmtEl.dataset.cid);
                saveData(); renderFeed();
                toast("कमेंट हट गया!");
            } else if (e.target.closest(".share-post-btn")) {
                if (!db.chats[post.author]) db.chats[post.author] = [];
                db.chats[post.author].push({ from: "me", text: `पोस्ट शेयर की: "${post.caption}"` });
                saveData();
                toast(`${post.author} को पोस्ट शेयर कर दी गई! 🚀`);
            } else if (e.target.closest(".save-btn")) {
                post.saved = !post.saved;
                saveData(); renderFeed(); renderProfile();
                toast(post.saved ? "पोस्ट सेव हो गई! 🔖" : "सेव्ड से हटा दी गई।");
            } else if (e.target.closest(".follow-btn")) {
                const idx = db.following.indexOf(post.author);
                if (idx === -1) {
                    db.following.push(post.author);
                    notify(`आपने ${post.author} को फ़ॉलो किया।`);
                    toast(`${post.author} को फ़ॉलो कर लिया! 🤝`);
                } else {
                    db.following.splice(idx, 1);
                    toast(`${post.author} को अनफ़ॉलो कर दिया! ❌`);
                }
                saveData(); renderFeed(); renderProfile();
            } else if (e.target.closest(".del-btn")) {
                db.posts = db.posts.filter(x => x.id !== post.id);
                saveData(); renderFeed(); renderProfile();
                toast("पोस्ट डिलीट हो गई! 🗑️");
            }
        };

        $("feed").ondblclick = e => {
            const media = e.target.closest(".post-media");

            const post = db.posts.find(x => x.id === media.closest(".post").dataset.id);
            if (!post) return;
            if (!post.liked) {
                post.liked = true; post.likes += 1;
                saveData(); renderFeed();
                notify(`आपने ${post.author} की पोस्ट लाइक की।`);

            const pop = $("feed").querySelector(`.post[data-id="${post.id}"] .heart-pop`);
            if (pop) {
                pop.classList.add("show");
                setTimeout(() => pop.classList.remove("show"), 650);
            }
        };

        /* DM */
        function renderChats() {
            const users = Object.keys(db.chats);
            if (!db.chats[activeChatUser] && users.length) activeChatUser = users[0];
            $("chatUsersBar").innerHTML = users.map(u => `
                <button type="button" class="pill ${u === activeChatUser ? "active" : ""}" data-u="${u}">${u}</button>`).join("");
            const msgs = db.chats[activeChatUser] || [];
            const box = $("chatMessagesBox");
            box.innerHTML = msgs.length
                ? msgs.map(m => `<div class="msg ${m.from}">${m.text}</div>`).join("")
                : `<p style="color:var(--muted); font-size:12px; text-align:center;">बातचीत शुरू करें...</p>`;
            box.scrollTop = box.scrollHeight;
        }

        $("addChatUserBtn").onclick = () => {
            const uname = $("newChatUserInp").value.trim().toUpperCase();
            if (!uname) return toast("यूज़रनेम लिखें!");
            if (!db.chats[uname]) db.chats[uname] = [];
            activeChatUser = uname;
            $("newChatUserInp").value = "";
            saveData(); renderChats();
            toast(`${uname} चैट में जुड़ गया!`);
        };

        $("chatUsersBar").onclick = e => {
            const pill = e.target.closest(".pill");
            if (pill) { activeChatUser = pill.dataset.u; renderChats(); }
        };

        $("sendChatBtn").onclick = () => {
            const txt = $("chatMsgInp").value.trim();
            if (!txt) return;
            if (!db.chats[activeChatUser]) db.chats[activeChatUser] = [];
            db.chats[activeChatUser].push({ from: "me", text: txt });
            $("chatMsgInp").value = "";
            saveData(); renderChats();
            setTimeout(() => {
                db.chats[activeChatUser].push({ from: "them", text: "बढ़िया भाई! 🔥 मैसेज मिल गया।" });
                saveData(); renderChats();
            }, 600);
        };

        /* PROFILE */
        function renderProfile() {
            $("displayUsername").innerText = db.user.name;
            $("displayBio").innerText = db.user.bio;
            $("profileAvatarBox").innerHTML = db.user.avatar ? `<img src="${db.user.avatar}" alt="ava">` : db.user.name.charAt(0).toUpperCase();
            const myPosts = db.posts.filter(p => p.author === db.user.name);
            const savedPosts = db.posts.filter(p => p.saved);
            const savedReels = db.reels.filter(r => r.saved);
            $("stPosts").innerText = myPosts.length;
            $("stFollowing").innerText = db.following.length;

            if (profileTab === "my") {
                $("profileGrid").innerHTML = myPosts.length
                    ? myPosts.map(p => `<div class="mini-post">${p.media ? `<img src="${p.media}" alt="mp">` : ""}<b>@${p.author}</b>: ${p.caption}</div>`).join("")
                    : `<p style="color:var(--muted); font-size:13px;">अभी आपकी कोई पोस्ट नहीं है।</p>`;
            } else if (profileTab === "savedPosts") {
                $("profileGrid").innerHTML = savedPosts.length
                    ? savedPosts.map(p => `<div class="mini-post">${p.media ? `<img src="${p.media}" alt="sp">` : ""}<b>@${p.author}</b>: ${p.caption}</div>`).join("")
                    : `<p style="color:var(--muted); font-size:13px;">कोई सेव्ड पोस्ट नहीं है।</p>`;
            } else {
                $("profileGrid").innerHTML = savedReels.length
                    ? savedReels.map(r => `<div class="mini-post"><b>@${r.author}</b>: ${r.caption}</div>`).join("")
                    : `<p style="color:var(--muted); font-size:13px;">कोई सेव्ड रील नहीं है।</p>`;
            }
        }

        document.querySelectorAll(".tab-btn[data-ptab]").forEach(btn => {
            btn.onclick = () => {
                profileTab = btn.dataset.ptab;
                document.querySelectorAll(".tab-btn[data-ptab]").forEach(b => b.classList.toggle("active", b === btn));
                renderProfile();
            };
        });

        $("stFollowingBox").onclick = () => {
            toast(db.following.length ? `फ़ॉलोइंग: ${db.following.join(", ")}` : "अभी किसी को फ़ॉलो नहीं किया है।");
        };

        $("saveUsernameBtn").onclick = () => {
            const n = $("newUsernameInput").value.trim();
            if (!n) return toast("सही नाम लिखें!");
            db.user.name = n;
            $("newUsernameInput").value = "";
            saveData(); renderProfile(); renderFeed();
            toast("यूज़रनेम बदल गया! ✅");
        };
        $("saveBioBtn").onclick = () => {
            const b = $("newBioInput").value.trim();
            if (!b) return toast("सही बायो लिखें!");
            db.user.bio = b;
            $("newBioInput").value = "";
            saveData(); renderProfile();
            toast("बायो अपडेट हो गया! ✅");
        };
        $("newAvatarInput").onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = ev => {
                db.user.avatar = ev.target.result;
                saveData(); renderProfile();
                toast("प्रोफ़ाइल फ़ोटो बदल गई!");
            };
            r.readAsDataURL(file);
        };
        $("exportDataBtn").onclick = () => {
            const text = JSON.stringify(db);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => toast("बैकअप JSON क्लिपबोर्ड में कॉपी हो गया! 📋")).catch(() => toast("कॉपी नहीं हो सका।"));
            } else {
                toast("बैकअप तैयार है।");
            }
        };
        $("resetDataBtn").onclick = () => {
            localStorage.removeItem(STORE_KEY);
            db = loadData();
            activeChatUser = Object.keys(db.chats)[0] || "DHAAKAD_OFFICIAL";
            renderStatuses(); renderFeed(); renderReels(); renderNotifications(); renderChats(); renderProfile();
            toast("सारा डेटा रीसेट हो गया! 🔄");
        };

        /* INITIAL RENDER */
        renderStatuses();
        renderFeed();
        renderReels();
        renderNotifications();
        renderChats();
        renderProfile();
        setInterval(renderStatuses, 60000);
    </script>
</body>
</html>
