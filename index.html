
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>DHAAKAD - अपना हुनर दिखाओ</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#ff6500;color:#111;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h2{margin:0;font-size:25px}
header p{margin:6px 0 0;font-weight:bold}
nav{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;background:#222;padding:9px;position:sticky;top:76px;z-index:9}
button{background:#ff6500;color:#111;border:0;border-radius:7px;padding:10px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
nav button{padding:9px 11px}
main{max-width:650px;margin:auto;padding:12px}
section{margin-bottom:20px}
.card{background:#202020;border-radius:12px;padding:13px;margin:12px 0;overflow-wrap:anywhere}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#252525;color:white;border:1px solid #555;border-radius:7px}
textarea{min-height:85px;resize:vertical}
video{width:100%;max-height:520px;background:black;border-radius:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.hidden{display:none!important}
.orange{color:#ff6500}
.muted{color:#aaa;font-size:13px}
.message{padding:10px;margin:7px 0;background:#252525;border-radius:8px;overflow-wrap:anywhere}
.mine{background:#713000;text-align:right}
#status{padding:9px;color:#ff9b55}
.progress{width:100%;height:8px;background:#444;border-radius:8px;overflow:hidden}
#progressBar{height:100%;width:0;background:#ff6500}
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>
<header>
<h2>🔥 DHAAKAD</h2>
<b>अपना हुनर दिखाओ!</b>
<p>CREATE • SHARE • EARN</p>
</header>

<nav>
<button onclick="show('feed')">होम</button>
<button onclick="show('upload')">अपलोड</button>
<button onclick="show('search')">खोजें</button>
<button onclick="show('profile')">प्रोफाइल</button>
<button onclick="show('notifications')">🔔</button>
<button onclick="show('saved')">सेव</button>
<button onclick="show('chat')">मैसेज</button>
</nav>

<main>
<div id="status"></div>

<section id="login" class="card">
<h3 class="orange">DHAAKAD में लॉगिन करें</h3>
<input id="email" type="email" placeholder="ईमेल" autocomplete="email">
<input id="password" type="password" placeholder="पासवर्ड" autocomplete="current-password">
<div class="actions">
<button onclick="register()">रजिस्टर</button>
<button onclick="login()">लॉगिन</button>
</div>
<div class="actions">
<button onclick="resetPassword()">पासवर्ड भूल गए?</button>
<button onclick="logout()">लॉगआउट</button>
</div>
<p id="authmsg"></p>
</section>

<section id="feed">
<h3 class="orange">🔥 वीडियो फीड</h3>
<div id="videos"></div>
</section>

<section id="upload" class="hidden">
<div class="card">
<h3 class="orange">अपना वीडियो अपलोड करें</h3>
<input type="file" id="videoFile" accept="video/*">
<textarea id="caption" maxlength="1000" placeholder="वीडियो के बारे में लिखें"></textarea>
<div class="progress"><div id="progressBar"></div></div>
<p id="uploadmsg" class="muted"></p>
<button id="uploadBtn" onclick="uploadVideo()">वीडियो प्रकाशित करें</button>
</div>
</section>

<section id="search" class="hidden">
<div class="card">
<h3 class="orange">यूजर खोजें</h3>
<input id="searchInput" type="email" placeholder="यूजर का पूरा ईमेल">
<button onclick="searchUsers()">खोजें</button>
<div id="searchResults"></div>
</div>
</section>

<section id="profile" class="hidden">
<div class="card">
<h3 class="orange">मेरी प्रोफाइल</h3>
<input id="displayName" maxlength="40" placeholder="अपना नाम">
<button onclick="updateProfile()">नाम अपडेट करें</button>
<div id="profileInfo"></div>
</div>
<div class="card">
<h3>मेरे वीडियो</h3>
<div id="myVideos"></div>
</div>
</section>

<section id="notifications" class="hidden">
<div class="card">
<h3 class="orange">🔔 नोटिफिकेशन</h3>
<div id="notificationList"></div>
</div>
</section>

<section id="saved" class="hidden">
<div class="card">
<h3 class="orange">सेव किए वीडियो</h3>
<div id="savedVideos"></div>
</div>
</section>

<section id="chat" class="hidden">
<div class="card">
<h3 class="orange">मैसेज</h3>
<input id="chatUser" placeholder="दूसरे यूजर की UID">
<button onclick="loadMessages()">चैट खोलें</button>
<div id="messages"></div>
<input id="messageText" maxlength="2000" placeholder="मैसेज लिखें">
<button onclick="sendMessage()">भेजें</button>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<script>
"use strict";

/*
FIREBASE CONFIG:
Firebase Console > Project settings > Your apps > SDK setup
यहाँ अपने असली Firebase config की values डालें।
अंदाजे वाली API key या App ID इस्तेमाल न करें।
*/
const firebaseConfig = {
  apiKey: "PASTE_YOUR_REAL_API_KEY",
  authDomain: "dhaakad-7b801.firebaseapp.com",
  projectId: "dhaakad-7b801",
  storageBucket: "PASTE_YOUR_REAL_STORAGE_BUCKET",
  messagingSenderId: "928208033292",
  appId: "PASTE_YOUR_REAL_APP_ID"
};

const $ = id => document.getElementById(id);

let auth, db, storage;
let currentUser = null;
let unsubscribeFeed = null;
let unsubscribeMessages = null;
let currentRoom = null;
let uploadTask = null;
let appReady = false;

function status(message){
  $("status").textContent = message || "";
}

function requireLogin(){
  if(!currentUser){
    alert("पहले लॉगिन करें");
    return false;
  }
  return true;
}

function show(id){
  const allowed = [
    "feed","upload","search","profile",
    "notifications","saved","chat"
  ];

  if(!allowed.includes(id)) return;

  if(id !== "feed" && !requireLogin()) return;

  document.querySelectorAll("main section").forEach(section=>{
    section.classList.add("hidden");
  });

  $(id).classList.remove("hidden");

  if(id==="feed") loadVideos();
  if(id==="profile") loadProfile();
  if(id==="notifications") loadNotifications();
  if(id==="saved") loadSaved();
}

/* FIREBASE INITIALIZATION */

try{
  if(firebaseConfig.apiKey==="PASTE_YOUR_REAL_API_KEY" ||
     firebaseConfig.appId==="PASTE_YOUR_REAL_APP_ID" ||
     firebaseConfig.storageBucket==="PASTE_YOUR_REAL_STORAGE_BUCKET"){
    throw new Error("Firebase config में अपनी असली API Key, App ID और Storage Bucket डालें।");
  }

  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  storage = firebase.storage();
  appReady = true;

  auth.onAuthStateChanged(handleAuthState);

}catch(error){
  status("Firebase शुरू नहीं हुआ: "+error.message);
  $("authmsg").textContent=error.message;
}

/* AUTHENTICATION */

async function register(){
  if(!appReady) return alert("Firebase config ठीक करें।");

  const email=$("email").value.trim().toLowerCase();
  const password=$("password").value;

  if(!email || password.length<6){
    alert("सही ईमेल और कम से कम 6 अक्षर का पासवर्ड डालें।");
    return;
  }

  try{
    const result=await auth.createUserWithEmailAndPassword(email,password);

    await db.collection("Users").doc(result.user.uid).set({
      uid:result.user.uid,
      email:email,
      name:email.split("@")[0],
      followers:[],
      following:[],
      saved:[],
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("रजिस्ट्रेशन सफल हुआ।");
  }catch(error){
    alert("रजिस्ट्रेशन नहीं हुआ: "+error.message);
  }
}

async function login(){
  if(!appReady) return alert("Firebase config ठीक करें।");

  const email=$("email").value.trim().toLowerCase();
  const password=$("password").value;

  if(!email || !password){
    alert("ईमेल और पासवर्ड डालें।");
    return;
  }

  try{
    await auth.signInWithEmailAndPassword(email,password);
    alert("लॉगिन सफल हुआ।");
  }catch(error){
    alert("लॉगिन नहीं हुआ: "+error.message);
  }
}

async function resetPassword(){
  if(!appReady) return;

  const email=$("email").value.trim().toLowerCase();
  if(!email) return alert("पहले ईमेल डालें।");

  try{
    await auth.sendPasswordResetEmail(email);
    alert("पासवर्ड बदलने का लिंक ईमेल पर भेज दिया गया।");
  }catch(error){
    alert(error.message);
  }
}

async function logout(){
  if(!appReady) return;

  try{
    if(uploadTask) await uploadTask.cancel();
    await auth.signOut();
    status("आप लॉगआउट हो गए हैं।");
  }catch(error){
    alert(error.message);
  }
}

async function handleAuthState(user){
  currentUser=user;

  $("authmsg").textContent=user
    ? "लॉगिन सफल: "+user.email
    : "लॉगिन करें";

  if(unsubscribeFeed){
    unsubscribeFeed();
    unsubscribeFeed=null;
  }

  if(unsubscribeMessages){
    unsubscribeMessages();
    unsubscribeMessages=null;
  }

  currentRoom=null;
  $("videos").innerHTML="";
  $("messages").innerHTML="";

  if(!user) return;

  try{
    const userRef=db.collection("Users").doc(user.uid);
    const userSnap=await userRef.get();

    if(!userSnap.exists){
      await userRef.set({
        uid:user.uid,
        email:user.email,
        name:user.email.split("@")[0],
        followers:[],
        following:[],
        saved:[],
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    loadVideos();
  }catch(error){
    status("यूजर जानकारी लोड नहीं हुई: "+error.message);
  }
}

/* NOTIFICATIONS */

async function createNotification(to,text,type,videoId){
  if(!currentUser || !to || to===currentUser.uid) return;

  await db.collection("Notifications").add({
    to:to,
    from:currentUser.uid,
    text:text,
    type:type,
    videoId:videoId || null,
    read:false,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function loadNotifications(){
  if(!requireLogin()) return;

  const box=$("notificationList");
  box.textContent="लोड हो रहा है...";

  try{
    const snap=await db.collection("Notifications")
      .where("to","==",currentUser.uid)
      .get();

    const docs=snap.docs.sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.() || 0;
      const tb=b.data().createdAt?.toMillis?.() || 0;
      return tb-ta;
    }).slice(0,50);

    box.innerHTML="";

    if(docs.length===0){
      box.textContent="अभी कोई नोटिफिकेशन नहीं है।";
      return;
    }

    docs.forEach(doc=>{
      const data=doc.data();
      const p=document.createElement("p");
      p.className="message";
      p.textContent=data.text || "नया नोटिफिकेशन";
      box.appendChild(p);
    });
  }catch(error){
    box.textContent="नोटिफिकेशन लोड नहीं हुए: "+error.message;
  }
}

/* VIDEO UPLOAD */

async function uploadVideo(){
  if(!requireLogin()) return;

  const file=$("videoFile").files[0];
  const caption=$("caption").value.trim();
  const button=$("uploadBtn");

  if(!file) return alert("पहले वीडियो चुनें।");
  if(!file.type.startsWith("video/")) return alert("सही वीडियो फाइल चुनें।");
  if(file.size>100*1024*1024) return alert("वीडियो 100 MB से छोटा होना चाहिए।");

  button.disabled=true;
  $("uploadmsg").textContent="वीडियो अपलोड हो रहा है...";
  $("progressBar").style.width="0%";

  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path="videos/"+currentUser.uid+"/"+Date.now()+"_"+safeName;
    const ref=storage.ref(path);

    uploadTask=ref.put(file,{contentType:file.type});

    uploadTask.on("state_changed",snapshot=>{
      const percent=snapshot.totalBytes
        ? snapshot.bytesTransferred/snapshot.totalBytes*100
        : 0;

      $("progressBar").style.width=percent+"%";
      $("uploadmsg").textContent="अपलोड: "+Math.round(percent)+"%";
    });

    const snapshot=await uploadTask;
    const url=await snapshot.ref.getDownloadURL();

    await db.collection("Videos").add({
      uid:currentUser.uid,
      caption:caption,
      videoUrl:url,
      storagePath:path,
      likes:[],
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    $("uploadmsg").textContent="वीडियो सफलतापूर्वक प्रकाशित हुआ।";
    $("videoFile").value="";
    $("caption").value="";
    $("progressBar").style.width="100%";
    loadVideos();

  }catch(error){
    $("uploadmsg").textContent="अपलोड नहीं हुआ: "+error.message;
  }finally{
    button.disabled=false;
    uploadTask=null;
  }
}

/* VIDEO CARD */

function makeVideoCard(id,v,container){
  const card=document.createElement("div");
  card.className="card";

  const video=document.createElement("video");
  video.src=v.videoUrl || "";
  video.controls=true;
  video.playsInline=true;
  video.preload="metadata";

  const owner=document.createElement("p");
  owner.className="muted";
  owner.textContent="Creator UID: "+(v.uid || "");

  const caption=document.createElement("p");
  caption.textContent=v.caption || "";

  const actions=document.createElement("div");
  actions.className="actions";

  const likes=Array.isArray(v.likes)?v.likes:[];
  const liked=currentUser && likes.includes(currentUser.uid);

  const like=document.createElement("button");
  like.textContent=(liked?"❤️ ":"🤍 ")+likes.length;
  like.onclick=()=>likeVideo(id);

  const comment=document.createElement("button");
  comment.textContent="💬 कमेंट";
  comment.onclick=()=>commentVideo(id);

  const follow=document.createElement("button");
  follow.textContent="➕ फॉलो";
  follow.onclick=()=>followUser(v.uid);

  const save=document.createElement("button");
  save.textContent="🔖 सेव";
  save.onclick=()=>saveVideo(id);

  const share=document.createElement("button");
  share.textContent="↗ शेयर";
  share.onclick=()=>shareVideo(id);

  actions.append(like,comment,follow,save,share);

  const comments=document.createElement("div");
  comments.id="comments-"+id;

  card.append(video,owner,caption,actions,comments);
  container.appendChild(card);

  loadComments(id);
}

/* VIDEO FEED */

function loadVideos(){
  if(!appReady) return;

  if(unsubscribeFeed){
    unsubscribeFeed();
    unsubscribeFeed=null;
  }

  const box=$("videos");
  box.textContent="वीडियो लोड हो रहे हैं...";

  unsubscribeFeed=db.collection("Videos")
    .orderBy("createdAt","desc")
    .limit(50)
    .onSnapshot(snapshot=>{
      box.innerHTML="";

      if(snapshot.empty){
        box.textContent="अभी कोई वीडियो उपलब्ध नहीं है।";
        return;
      }

      snapshot.forEach(doc=>{
        makeVideoCard(doc.id,doc.data(),box);
      });
    },error=>{
      box.textContent="वीडियो फीड की समस्या: "+error.message;
    });
}

/* LIKE */

async function likeVideo(id){
  if(!requireLogin()) return;

  const ref=db.collection("Videos").doc(id);

  try{
    let ownerUid=null;
    let added=false;

    await db.runTransaction(async transaction=>{
      const snap=await transaction.get(ref);
      if(!snap.exists) throw new Error("वीडियो नहीं मिला।");

      const data=snap.data();
      const likes=Array.isArray(data.likes)?data.likes:[];

      ownerUid=data.uid;

      if(likes.includes(currentUser.uid)){
        transaction.update(ref,{
          likes:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        });
      }else{
        transaction.update(ref,{
          likes:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        });
        added=true;
      }
    });

    if(added && ownerUid){
      await createNotification(ownerUid,"किसी ने आपका वीडियो लाइक किया।","like",id);
    }
  }catch(error){
    alert("लाइक नहीं हुआ: "+error.message);
  }
}

/* COMMENTS */

async function commentVideo(id){
  if(!requireLogin()) return;

  const comment=prompt("अपना कमेंट लिखें");
  if(!comment || !comment.trim()) return;

  try{
    const videoRef=db.collection("Videos").doc(id);
    const videoSnap=await videoRef.get();

    if(!videoSnap.exists) throw new Error("वीडियो नहीं मिला।");

    await videoRef.collection("Comments").add({
      uid:currentUser.uid,
      text:comment.trim().slice(0,1000),
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    await createNotification(
      videoSnap.data().uid,
      "किसी ने आपके वीडियो पर कमेंट किया।",
      "comment",
      id
    );

    loadComments(id);
  }catch(error){
    alert("कमेंट नहीं हुआ: "+error.message);
  }
}

async function loadComments(id){
  const box=$("comments-"+id);
  if(!box) return;

  try{
    const snap=await db.collection("Videos").doc(id)
      .collection("Comments")
      .orderBy("createdAt","desc")
      .limit(20)
      .get();

    box.innerHTML="";

    snap.forEach(doc=>{
      const p=document.createElement("p");
      p.className="message";
      p.textContent=doc.data().text || "";
      box.appendChild(p);
    });
  }catch(error){
    box.textContent="कमेंट लोड नहीं हुए: "+error.message;
  }
}

/* FOLLOW */

async function followUser(uid){
  if(!requireLogin()) return;
  if(!uid || uid===currentUser.uid) return;

  const mine=db.collection("Users").doc(currentUser.uid);
  const other=db.collection("Users").doc(uid);

  try{
    let followed=false;

    await db.runTransaction(async transaction=>{
      const a=await transaction.get(mine);
      const b=await transaction.get(other);

      if(!a.exists || !b.exists) throw new Error("यूजर नहीं मिला।");

      const following=Array.isArray(a.data().following)?a.data().following:[];
      const followers=Array.isArray(b.data().followers)?b.data().followers:[];

      if(following.includes(uid)){
        transaction.update(mine,{
          following:firebase.firestore.FieldValue.arrayRemove(uid)
        });
        transaction.update(other,{
          followers:firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
        });
      }else{
        transaction.update(mine,{
          following:firebase.firestore.FieldValue.arrayUnion(uid)
        });
        transaction.update(other,{
          followers:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        });
        followed=true;
      }
    });

    if(followed){
      await createNotification(uid,"किसी ने आपको फॉलो किया।","follow");
    }

    alert(followed?"अब आप फॉलो कर रहे हैं।":"फॉलो हटाया गया।");
  }catch(error){
    alert("फॉलो नहीं हुआ: "+error.message);
  }
}

/* SAVE VIDEO */

async function saveVideo(id){
  if(!requireLogin()) return;

  const ref=db.collection("Users").doc(currentUser.uid);

  try{
    const snap=await ref.get();
    if(!snap.exists) throw new Error("प्रोफाइल नहीं मिली।");

    const saved=Array.isArray(snap.data().saved)?snap.data().saved:[];

    if(saved.includes(id)){
      await ref.update({
        saved:firebase.firestore.FieldValue.arrayRemove(id)
      });
      alert("वीडियो सेव सूची से हटाया गया।");
    }else{
      await ref.update({
        saved:firebase.firestore.FieldValue.arrayUnion(id)
      });
      alert("वीडियो सेव हो गया।");
    }
  }catch(error){
    alert("वीडियो सेव नहीं हुआ: "+error.message);
  }
}

/* SAVED VIDEOS */

async function loadSaved(){
  if(!requireLogin()) return;

  const box=$("savedVideos");
  box.textContent="लोड हो रहा है...";

  try{
    const snap=await db.collection("Users").doc(currentUser.uid).get();
    const ids=snap.exists && Array.isArray(snap.data().saved)
      ? snap.data().saved
      : [];

    box.innerHTML="";

    if(ids.length===0){
      box.textContent="अभी कोई वीडियो सेव नहीं है।";
      return;
    }

    for(const id of ids){
      const doc=await db.collection("Videos").doc(id).get();
      if(doc.exists) makeVideoCard(doc.id,doc.data(),box);
    }
  }catch(error){
