<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAAKAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #000; color: #fff; }
        .navbar { background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #ff7900; font-weight: bold; font-size: 24px; letter-spacing: 1px; }
        .nav-icons i { font-size: 22px; margin-left: 18px; cursor: pointer; color: #fff; }
        .nav-icons i:active { color: #ff7900; }
        .main { max-width: 470px; margin: 20px auto; padding: 0 10px; }
        .post { background: #111; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; }
        .post-header { padding: 12px; color: #ff7900; font-weight: bold; font-size: 14px; }
        .post-box { width: 100%; height: 350px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #777; font-size: 16px; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        .post-footer { padding: 12px; }
        .post-actions { display: flex; margin-bottom: 8px; }
        .post-actions i { font-size: 24px; cursor: pointer; margin-right: 15px; color: #fff; }
        .liked { color: #ff3b30 !important; }
        .post-footer p { font-size: 14px; margin-bottom: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #333; text-align: center; }
        .modal-content h3 { margin-bottom: 15px; color: #ff7900; }
        .modal-content input { width: 100%; margin-bottom: 15px; padding: 10px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; outline: none; }
        .btn-container { display: flex; justify-content: space-between; gap: 10px; }
        .btn { width: 100%; background: #ff7900; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 14px; }
        .btn-secondary { background: #333; color: #fff; }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="navbar">
        <div class="logo">DHAAKAD</div>
        <div class="nav-icons">
            <i class="fa-solid fa-house" onclick="alert('आप होम पेज पर हैं!')"></i>
            <i class="fa-regular fa-square-plus" onclick="openBox()"></i>
            <i class="fa-regular fa-heart" onclick="alert('यह आपका नोटिफिकेशन सेक्शन है।')"></i>
        </div>
    </div>

    <!-- Main Feed Section -->
    <div class="main">
        <div class="post">
            <div class="post-header">DHAAKAD_OFFICIAL</div>
            <div class="post-box">📸 DHAAKAD Preview Image</div>
            <div class="post-footer">
                <div class="post-actions">
                    <i class="fa-regular fa-heart" id="likeIcon" onclick="likePost()"></i>
                    <i class="fa-regular fa-comment" onclick="alert('कमेंट बॉक्स जल्द खुलेगा!')"></i>
                    <i class="fa-regular fa-paper-plane" onclick="alert('शेरिंग लिंक कॉपी हो गया!')"></i>
                </div>
                <p><b><span id="likeCount">1245</span> likes</b></p>
                <p><b>DHAAKAD_OFFICIAL</b> Welcome to the ultimate mobile experience! 🔥</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal Box -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <h3>Create New Post</h3>
            <input type="text" id="captionInput" placeholder="Write a caption...">
            <div class="btn-container">
                <button class="btn btn-secondary" onclick="closeBox()">Cancel</button>
                <button class="btn" onclick="addNewPost()">Post</button>
            </div>
        </div>
    </div>

    <!-- JavaScript for Button Actions -->
    <script>
        // Open the Upload Box
        function openBox() {
            document.getElementById('myModal').style.display = 'flex';
        }

        // Close the Upload Box
        function closeBox() {
            document.getElementById('myModal').style.display = 'none';
            document.getElementById('captionInput').value = '';
        }

        // Like Button Functionality
        function likePost() {
            let icon = document.getElementById('likeIcon');
            let countSpan = document.getElementById('likeCount');
            let count = parseInt(countSpan.innerText);

            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular', 'fa-heart');
                icon.classList.add('fa-solid', 'fa-heart', 'liked');
                countSpan.innerText = count + 1;
            } else {
                icon.classList.remove('fa-solid', 'fa-heart', 'liked');
                icon.classList.add('fa-regular', 'fa-heart');
                countSpan.innerText = count - 1;
            }
        }

        // Add Post Action (Simulated)
        function addNewPost() {
            let caption = document.getElementById('captionInput').value;
            if(caption.trim() === "") {
                alert("कृपया कुछ कैप्शन लिखें!");
                return;
            }
            alert("सफलतापूर्वक पोस्ट अपलोड हो गई: " + caption);
            closeBox();
        }
    </script>
</body>
</html>
