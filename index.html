<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAAKAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
        }
        .navbar {
            background: #111;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #ff7900;
            font-weight: bold;
            font-size: 22px;
        }
        .nav-icons i {
            font-size: 20px;
            margin-left: 15px;
            cursor: pointer;
        }
        .main {
            max-width: 470px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .post {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .post-header {
            padding: 10px;
            color: #ff7900;
            font-weight: bold;
        }
        .post-box {
            width: 100%;
            height: 350px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .post-footer {
            padding: 10px;
        }
        .post-footer i {
            font-size: 22px;
            cursor: pointer;
            margin-right: 15px;
        }
        .liked {
            color: red !important;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
        }
        .modal-content textarea, .modal-content input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
        }
        .btn {
            background: #ff7900;
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">DHAAKAD</div>
        <div class="nav-icons">
            <i class="fa-solid fa-house"></i>
            <i class="fa-regular fa-square-plus" onclick="openBox()"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </div>

    <div class="main" id="feed">
        <div class="post">
            <div class="post-header">DHAAKAD_USER</div>
            <div class="post-box">Post Image Here</div>
            <div class="post-footer">
                <i class="fa-regular fa-heart" id="likeIcon" onclick="likePost()"></i>
                <p><span id="likeCount">1245</span> likes</p>
                <p><b>DHAAKAD_USER</b> Welcome to DHAAKAD!</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <h3>New Post</h3>
            <input type="text" id="captionText" placeholder="Write a caption...">
            <button class="btn" onclick="closeBox()">Close</button>
        </div>
    </div>

    <script>
        function openBox() {
            document.getElementById('myModal').style.display = 'flex';
        }
        function closeBox() {
            document.getElementById('myModal').style.display = 'none';
        }
        function likePost() {
            let icon = document.getElementById('likeIcon');
            let countSpan = document.getElementById('likeCount');
            let count = parseInt(countSpan.innerText);

            if (icon.classList.contains('fa-regular')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'liked');
                countSpan.innerText = count + 1;
            } else {
                icon.classList.remove('fa-solid', 'liked');
                icon.classList.add('fa-regular');
                countSpan.innerText = count - 1;
            }
        }
    </script>
</body>
</html>
