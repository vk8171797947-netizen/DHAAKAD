<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>DHAAKAD</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#app{max-width:600px;margin:auto;min-height:100vh;background:#000}
header{
 position:sticky;top:0;z-index:99;background:#000;
 border-bottom:1px solid #222;padding:13px 15px;
 display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:25px;font-weight:900;color:#ff6900;letter-spacing:1px}
.header-btn{background:none;color:white;border:0;font-size:24px;padding:5px}
.page{display:none;padding-bottom:80px}
.page.active{display:block}
nav{
 position:fixed;bottom:0;left:0;right:0;z-index:100;
 background:#080808;border-top:1px solid #222;height:65px;
 display:flex;justify-content:space-around;align-items:center
}
nav button{background:none;color:#aaa;border:0;font-size:24px;flex:1;height:100%}
nav button.active{color:#ff6900}
nav span{display:block;font-size:10px;margin-top:3px}
.storybar{display:flex;overflow-x:auto;padding:12px;gap:13px;border-bottom:1px solid #222}
.story{min-width:64px;text-align:center;font-size:11px}
.story-ring{
 width:62px;height:62px;border-radius:50%;padding:3px;
 background:linear-gradient(45deg,#ff6900,#ffcc00,#ff2600);margin:auto auto 5px
}
.story-ring img,.story-ring .add{
 width:100%;height:100%;border-radius:50%;object-fit:cover;background:#222
}
.story-ring .add{display:flex;align-items:center;justify-content:center;font-size:30px;color:#ff6900}
.post{border-bottom:1px solid #262626;margin-bottom:8px}
.post-head{display:flex;align-items:center;padding:10px;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#252525}
.username{font-size:14px;font-weight:bold}
.subtext{font-size:11px;color:#aaa;margin-top:3px}
.more{margin-left:auto;background:none;color:white;border:0;font-size:22px}
.post-media{width:100%;max-height:650px;object-fit:contain;background:#080808;display:block}
.post-actions{display:flex;align-items:center;padding:9px 12px;gap:17px}
.action{background:none;border:0;color:white;font-size:26px}
.action.liked{color:#ff3300}
.action.save{margin-left:auto}
.likes{font-size:13px;font-weight:bold;padding:0 12px}
.caption{padding:5px 12px;font-size:14px;line-height:1.5}
.caption b{margin-right:5px}
.comments-link{color:#888;padding:4px 12px 10px;display:block;font-size:13px}
.time{padding:0 12px 10px;color:#666;font-size:10px}
.searchbox{padding:12px}
.searchbox input{
 width:100%;padding:12px;border-radius:10px;border:0;background:#222;color:white
}
.user-row{display:flex;align-items:center;padding:12px;gap:12px;border-bottom:1px solid #222}
.user-row button{margin-left:auto;padding:8px 15px;background:#ff6900;border:0;border-radius:7px;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#222}
.profile-top{padding:20px 15px}
.profile-info{display:flex;align-items:center;gap:20px}
.profile-pic{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#222}
.stats{display:flex;gap:20px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:#aaa}
.profile-bio{margin-top:15px;font-size:14px}
.profile-buttons{display:flex;gap:8px;margin-top:15px}
.profile-buttons button{flex:1;background:#252525;border:0;color:white;padding:10px;border-radius:6px}
.profile-tabs{display:flex;border-top:1px solid #222}
.profile-tabs button{flex:1;padding:12px;background:none;color:white;border:0}
.modal{
 display:none;position:fixed;inset:0;z-index:200;background:#000;
 overflow:auto
}
.modal.active{display:block}
.modal-head{display:flex;align-items:center;padding:15px;border-bottom:1px solid #222}
.modal-head button{background:none;border:0;color:white;font-size:24px}
.modal-head b{margin-left:20px}
.form{padding:15px}
.form input,.form textarea{
 width:100%;background:#202020;color:white;border:1px solid #333;
 border-radius:8px;padding:12px;margin:8px 0
}
.form textarea{height:110px;resize:vertical}
.orange-btn{width:100%;background:#ff6900;border:0;padding:13px;border-radius:8px;font-weight:bold;margin-top:10px}
.preview{width:100%;max-height:350px;object-fit:contain;margin:10px 0}
.comment-item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #222}
.comment-item p{font-size:14px;line-height:1.5}
.comment-input{position:sticky;bottom:0;display:flex;background:#111;padding:10px;gap:8px}
.comment-input input{flex:1;border-radius:20px;padding:10px;background:#222;color:white;border:0}
.comment-input button{background:#ff6900;border:0;border-radius:20px;padding:0 15px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#ff6900;color:#000;padding:10px 18px;border-radius:20px;display:none;z-index:300}
.empty{text-align:center;color:#888;padding:40px 20px}
</style>
</head>

<body>
<div id="app">
<header>
 <div class="logo">DHAAKAD</div>
 <div>
  <button class="header-btn" onclick="openCreate()">＋</button>
  <button class="header-btn" onclick="showPage('messages')">✉</button>
 </div>
</header>

<div id="home" class="page active">
<div class="storybar" id="stories">
 <div class="story" onclick="openStory()"><div class="story-ring"><div class="add">＋</div></div>Your story</div>
</div>
<div id="feed"></div>
</div>

<div id="search" class="page">
<div class="searchbox"><input id="searchInput" placeholder="Search people..." oninput="searchUsers(this.value)"></div>
<div id="searchResults"></div>
</div>

<div id="reels" class="page">
<div id="reelsContent"></div>
</div>

<div id="notifications" class="page">
<div id="notificationsContent" class="empty">Notifications</div>
</div>

<div id="profile" class="page">
<div class="profile-top">
<div class="profile-info">
<img id="profilePic" class="profile-pic">
<div class="stats">
<div><b id="postCount">0</b><span>Posts</span></div>
<div><b id="followerCount">0</b><span>Followers</span></div>
<div><b id="followingCount">0</b><span>Following</span></div>
</div>
</div>
<div class="profile-bio"><b id="myName">DHAAKAD User</b><div id="myBio"></div></div>
<div class="profile-buttons">
<button onclick="editProfile()">Edit profile</button>
<button onclick="shareProfile()">Share profile</button>
</div>
</div>
<div class="profile-tabs"><button onclick="showProfilePosts()">▦ Posts</button><button onclick="showProfileReels()">▶ Reels</button></div>
<div id="profileGrid" class="grid"></div>
</div>

<div id="messages" class="page"><div class="empty">Messages</div></div>

<nav>
<button class="active" onclick="showPage('home',this)">⌂<span>Home</span></button>
<button onclick="showPage('search',this)">⌕<span>Search</span></button>
<button onclick="openCreate()">＋<span>Create</span></button>
<button onclick="showPage('reels',this)">▣<span>Reels</span></button>
<button onclick="showPage('profile',this)">◉<span>Profile</span></button>
</nav>
</div>

<div id="createModal" class="modal">
<div class="modal-head"><button onclick="closeModal('createModal')">←</button><b>Create post</b></div>
<div class="form">
<input type="file" id="postFile" accept="image/*,video/*" onchange="previewFile(this)">
<img id="filePreview" class="preview" style="display:none">
<textarea id="postCaption" placeholder="Write a caption..."></textarea>
<button class="orange-btn" onclick="publishPost()">Share</button>
</div>
</div>

<div id="storyModal" class="modal">
<div class="modal-head"><button onclick="closeModal('storyModal')">←</button><b>Add story</b></div>
<div class="form">
<input type="file" id="storyFile" accept="image/*,video/*">
<button class="orange-btn" onclick="publishStory()">Share story</button>
</div>
</div>

<div id="commentsModal" class="modal">
<div class="modal-head"><button onclick="closeModal('commentsModal')">←</button><b>Comments</b></div>
<div id="commentsList"></div>
<div class="comment-input">
<input id="commentInput" placeholder="Add a comment...">
<button onclick="sendComment()">Post</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getFirestore,collection,addDoc,query,orderBy,onSnapshot,
 doc,updateDoc,arrayUnion,arrayRemove,increment,getDoc,setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
 getAuth,onAuthStateChanged,signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyBahbShOGBzd6TYyKh0-njxVCxpO6OVIOU",
 authDomain: "dhaakad-7b801.firebaseapp.com",
 projectId: "dhaakad-7b801",
 storageBucket: "dhaakad-7b801.firebasestorage.app",
 messagingSenderId: "109332019301",
 appId: "1:109332019301:web:PUT_YOUR_APP_ID_HERE"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
let currentUser=null,posts=[],currentCommentPost=null;
const usersRef=collection(db,"users");
const postsRef=collection(db,"posts");

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;t.style.display="block";
 setTimeout(()=>t.style.display="none",2500);
}
window.showPage=function(id,btn){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id)?.classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");
 if(id==="profile")loadProfile();
 if(id==="reels")loadReels();
};
window.closeModal=id=>document.getElementById(id).classList.remove("active");
window.openCreate=()=>document.getElementById("createModal").classList.add("active");
window.openStory=()=>document.getElementById("storyModal").classList.add("active");

onAuthStateChanged(auth,async user=>{
 if(user){currentUser=user;await ensureUser();listenPosts();listenStories();}
 else signInAnonymously(auth).catch(e=>toast(e.message));
});

async function ensureUser(){
 const u=doc(db,"users",currentUser.uid);
 const s=await getDoc(u);
 if(!s.exists())await setDoc(u,{
  uid:currentUser.uid,username:"user_"+currentUser.uid.slice(0,6),
  displayName:"DHAAKAD User",bio:"",photoURL:"",followers:[],following:[],
  createdAt:Date.now()
 });
}

function listenPosts(){
 const q=query(postsRef,orderBy("createdAt","desc"));
 onSnapshot(q,s=>{
  posts=s.docs.map(d=>({id:d.id,...d.data()}));
  renderFeed();loadProfile();
 },e=>toast("Feed error: "+e.message));
}

function renderFeed(){
 const feed=document.getElementById("feed");
 feed.innerHTML="";
 posts.forEach(p=>{
  const liked=(p.likes||[]).includes(currentUser.uid);
  const media=p.mediaURL||p.media||"";
  const isVideo=p.mediaType==="video";
  const post=document.createElement("div");post.className="post";
  post.innerHTML=`
   <div class="post-head">
    <img class="avatar" src="${safe(p.photoURL)}">
    <div><div class="username">${safe(p.username||"user")}</div><div class="subtext">DHAAKAD</div></div>
    <button class="more" onclick="postMenu('${p.id}')">⋯</button>
   </div>
   ${isVideo?`<video class="post-media" src="${safe(media)}" controls playsinline></video>`:`<img class="post-media" src="${safe(media)}">`}
   <div class="post-actions">
    <button class="action ${liked?'liked':''}" onclick="toggleLike('${p.id}')">${liked?'♥':'♡'}</button>
    <button class="action" onclick="openComments('${p.id}')">◯</button>
    <button class="action" onclick="sharePost('${p.id}')">➤</button>
    <button class="action save" onclick="savePost('${p.id}')">♧</button>
   </div>
   <div class="likes">${(p.likes||[]).length} likes</div>
   <div class="caption"><b>${safe(p.username||"user")}</b>${safe(p.caption||"")}</div>
   <span class="comments-link" onclick="openComments('${p.id}')">View all ${(p.commentCount||0)} comments</span>
   <div class="time">${timeAgo(p.createdAt)}</div>`;
  feed.appendChild(post);
 });
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function timeAgo(t){
 if(!t)return "Just now";
 const ms=Date.now()-(typeof t==="number"?t:t.seconds*1000);
 const m=Math.floor(ms/60000);
 if(m<1)return "Just now";if(m<60)return m+"m";
 if(m<1440)return Math.floor(m/60)+"h";
 return Math.floor(m/1440)+"d";
}

window.previewFile=function(input){
 const f=input.files?.[0];if(!f)return;
 const url=URL.createObjectURL(f);
 const img=document.getElementById("filePreview");
 img.src=url;img.style.display="block";
};
window.publishPost=async()=>{
 const file=document.getElementById("postFile").files[0];
 if(!file)return toast("Please select a photo or video");
 toast("Upload storage setup required");
};
window.publishStory=()=>toast("Story upload storage setup required");

window.toggleLike=async id=>{
 if(!currentUser)return;
 const r=doc(db,"posts",id);
 const p=posts.find(x=>x.id===id);if(!p)return;
 const liked=(p.likes||[]).includes(currentUser.uid);
 try{await updateDoc(r,{likes:liked?arrayRemove(currentUser.uid):arrayUnion(currentUser.uid)});}
 catch(e){toast(e.message);}
};
window.savePost=async id=>toast("Save feature setup required");
window.sharePost=async id=>{
 const p=posts.find(x=>x.id===id);if(!p)return;
 const link=location.href+"?post="+id;
 if(navigator.share){try{await navigator.share({title:"DHAAKAD",url:link});}catch(e){}}
 else{await navigator.clipboard.writeText(link);toast("Link copied");}
};
window.postMenu=id=>{
 const p=posts.find(x=>x.id===id);
 if(p?.uid===currentUser.uid){
  if(confirm("Delete this post?"))deletePost(id);
 }else toast("Post options");
};
async function deletePost(id){
 try{await deleteDoc(doc(db,"posts",id));toast("Post deleted");}
 catch(e){toast(e.message);}
}
window.openComments=async id=>{
 currentCommentPost=id;
 document.getElementById("commentsModal").classList.add("active");
 const list=document.getElementById("commentsList");list.innerHTML="";
 onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("createdAt","asc")),s=>{
  list.innerHTML="";
  s.forEach(d=>{
   const c=d.data();const div=document.createElement("div");div.className="comment-item";
   div.innerHTML=`<img class="avatar" src="${safe(c.photoURL||"")}"><p><b>${safe(c.username)}</b> ${safe(c.text)}</p>`;
   list.appendChild(div);
  });
 });
};
window.sendComment=async()=>{
 const text=document.getElementById("commentInput").value.trim();if(!text||!currentCommentPost)return;
 try{
  await addDoc(collection(db,"posts",currentCommentPost,"comments"),{
   uid:currentUser.uid,username:"DHAAKAD User",text,createdAt:Date.now()
  });
  await updateDoc(doc(db,"posts",currentCommentPost),{commentCount:increment(1)});
  document.getElementById("commentInput").value="";
 }catch(e){toast(e.message);}
};
window.searchUsers=async text=>{
 const res=document.getElementById("searchResults");res.innerHTML="";
 if(!text.trim())return;
 const s=await getDocs(usersRef);
 s.forEach(d=>{
  const u=d.data();
  if((u.username||"").toLowerCase().includes(text.toLowerCase())){
   const div=document.createElement("div");div.className="user-row";
   div.innerHTML=`<img class="avatar" src="${safe(u.photoURL||"")}"><b>${safe(u.username)}</b><button onclick="followUser('${u.uid}')">Follow</button>`;
   res.appendChild(div);
  }
 });
};
window.followUser=async uid=>{
 const me=doc(db,"users",currentUser.uid),them=doc(db,"users",uid);
 try{
  await updateDoc(me,{following:arrayUnion(uid)});
  await updateDoc(them,{followers:arrayUnion(currentUser.uid)});
  toast("Followed");
 }catch(e){toast(e.message);}
};
function loadProfile(){
 if(!currentUser)return;
 getDoc(doc(db,"users",currentUser.uid)).then(s=>{
  const u=s.data()||{};
  document.getElementById("myName").textContent=u.displayName||u.username||"User";
  document.getElementById("myBio").textContent=u.bio||"";
  document.getElementById("profilePic").src=u.photoURL||"";
  document.getElementById("followerCount").textContent=(u.followers||[]).length;
  document.getElementById("followingCount").textContent=(u.following||[]).length;
  const own=posts.filter(p=>p.uid===currentUser.uid);
  document.getElementById("postCount").textContent=own.length;
  showProfilePosts();
 });
}
window.showProfilePosts=()=>{
 const grid=document.getElementById("profileGrid");grid.innerHTML="";
 posts.filter(p=>p.uid===currentUser?.uid).forEach(p=>{
  const el=p.mediaType==="video"?document.createElement("video"):document.createElement("img");
  el.src=p.mediaURL||p.media||"";grid.appendChild(el);
 });
};
window.showProfileReels=()=>showProfilePosts();
window.editProfile=async()=>{
 const s=await getDoc(doc(db,"users",currentUser.uid));const u=s.data()||{};
 const name=prompt("Display name",u.displayName||"");if(name===null)return;
 const bio=prompt("Bio",u.bio||"");if(bio===null)return;
 try{await updateDoc(doc(db,"users",currentUser.uid),{displayName:name,bio});loadProfile();}
 catch(e){toast(e.message);}
};
window.shareProfile=async()=>{
 const link=location.href+"?user="+currentUser.uid;
 try{await navigator.clipboard.writeText(link);toast("Profile link copied");}
 catch(e){toast(link);}
};
function loadReels(){
 const r=document.getElementById("reelsContent");r.innerHTML="";
 posts.filter(p=>p.mediaType==="video").forEach(p=>{
  const v=document.createElement("video");v.src=p.mediaURL||p.media;v.controls=true;v.loop=true;v.playsInline=true;
  v.style="width:100%;max-height:75vh;background:#000";
  r.appendChild(v);
 });
}
function listenStories(){
 onSnapshot(collection(db,"stories"),s=>{
  const bar=document.getElementById("stories");
  bar.innerHTML=`<div class="story" onclick="openStory()"><div class="story-ring"><div class="add">＋</div></div>Your story</div>`;
  s.forEach(d=>{
   const x=d.data();const div=document.createElement("div");div.className="story";
   div.innerHTML=`<div class="story-ring"><img src="${safe(x.mediaURL||"")}"></div>${safe(x.username||"User")}`;
   bar.appendChild(div);
  });
 });
}
</script>
</body>
</html>
