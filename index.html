<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>DHAAKAD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:65px;
}
header{
 height:58px;
 background:#080808;
 border-bottom:1px solid #292929;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 position:sticky;
 top:0;
 z-index:10;
}
.logo{
 color:#ff6500;
 font-size:25px;
 font-weight:900;
 cursor:pointer;
}
button{cursor:pointer}
.topbtn{
 background:none;
 border:0;
 color:white;
 font-size:23px;
 margin-left:10px;
}
.stories{
 display:flex;
 gap:14px;
 overflow-x:auto;
 padding:15px 10px;
 border-bottom:1px solid #292929;
}
.story{
 min-width:65px;
 text-align:center;
 font-size:12px;
 cursor:pointer;
}
.story img, .story video{
 width:60px;
 height:60px;
 border-radius:50%;
 object-fit:cover;
 padding:3px;
 border:3px solid #ff6500;
 display:block;
 margin:0 auto 4px;
}
.story-add{
 width:60px;
 height:60px;
 border-radius:50%;
 border:2px solid #ff6500;
 color:#ff6500;
 font-size:32px;
 display:grid;
 place-items:center;
 margin:0 auto 4px;
}
.post{
 border-bottom:8px solid #171717;
}
.posthead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
}
.user-info{
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#ff6500;
 display:grid;
 place-items:center;
 font-weight:bold;
}
.del-btn{
 background:none;
 border:0;
 color:#888;
 font-size:16px;
}
.postmedia{
 width:100%;
 max-height:600px;
 object-fit:contain;
 background:#000;
 display:block;
}
.actions{
 display:flex;
 gap:20px;
 padding:10px 13px;
}
.actions button{
 background:none;
 border:0;
 color:white;
 font-size:25px;
 padding:0;
}
.actions button.liked{
 color:#ff3b30;
}
.caption{padding:0 13px 12px}
.comment-item{
 margin:4px 0;
 font-size:14px;
 color:#ddd;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:62px;
 background:#080808;
 border-top:1px solid #292929;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:20;
}
.bottom button{
 background:none;
 border:0;
 color:white;
 font-size:23px;
}
.bottom button.active{color:#ff6500}
.page{display:none}
.page.active{display:block}
.panel{padding:18px}
input,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 background:#202020;
 border:1px solid #444;
 border-radius:8px;
 color:white;
}
.primary{
 background:#ff6500;
 color:white;
 border:0;
 border-radius:8px;
 padding:12px 18px;
 font-weight:bold;
 width:100%;
 margin-top:8px;
}
.story-modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.95);
 z-index:100;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}
.story-modal.open{display:flex}
.story-modal-close{
 position:absolute;
 top:20px;
 right:20px;
 background:#ff6500;
 color:white;
 border:0;
 border-radius:50%;
 width:36px;
 height:36px;
 font-size:20px;
}
.story-modal-content img, .story-modal-content video{
 max-width:95vw;
 max-height:85vh;
 border-radius:10px;
}
.empty-msg{
 text-align:center;
 color:#777;
 padding:40px 20px;
}
</style>
</head>

<body>

<header>
 <div class="logo" onclick="showPage('home', document.querySelector('.bottom button'))">DHAAKAD</div>
 <div>
  <button class="topbtn" onclick="showPage('messages')">✉</button>
  <button class="topbtn" onclick="showPage('notifications')">♡</button>
 </div>
</header>

<section id="home" class="page active">
 <div class="stories" id="stories">
  <div class="story" onclick="addStory()">
   <div class="story-add">＋</div>
   Your Story
  </div>
 </div>
 <div id="feed"></div>
</section>

<section id="search" class="page">
 <div class="panel">
  <h2>Search</h2>
  <input id="searchInput" placeholder="Search posts by caption...">
  <div id="searchResults"></div>
 </div>
</section>

<section id="reels" class="page">
 <div class="panel" style="padding-bottom:0"><h2>Reels</h2></div>
 <div id="reelFeed"></div>
</section>

<section id="create" class="page">
 <div class="panel">
  <h2>Create Post</h2>
  <input id="postFile" type="file" accept="image/*,video/*">
  <textarea id="caption" rows="3" placeholder="Write a caption..."></textarea>
  <button class="primary" onclick="createPost()">Share Post</button>
 </div>
</section>

<section id="profile" class="page">
 <div class="panel">
  <h2 id="profileName">DHAAKAD User</h2>
  <p id="profileStats">0 Posts · 120 Followers · 85 Following</p>
  <button class="primary" onclick="editProfile()">Edit Profile</button>
 </div>
 <div id="myPosts"></div>
</section>

<section id="messages" class="page">
 <div class="panel">
  <h2>Messages</h2>
  <div class="empty-msg">Abhi koi naya message nahi hai.</div>
 </div>
</section>

<section id="notifications" class="page">
 <div class="panel">
  <h2>Notifications</h2>
  <div class="empty-msg">DHAAKAD par aapka swagat hai!</div>
 </div>
</section>

<div id="storyModal" class="story-modal" onclick="closeStory()">
 <button class="story-modal-close" onclick="closeStory()">✕</button>
 <div id="storyModalContent" class="story-modal-content" onclick="event.stopPropagation()"></div>
</div>

<nav class="bottom">
 <button class="active" onclick="showPage('home',this)">⌂</button>
 <button onclick="showPage('search',this)">⌕</button>
 <button onclick="showPage('reels',this)">▶</button>
 <button onclick="showPage('create',this)">＋</button>
 <button onclick="showPage('profile',this)">◉</button>
</nav>

<script>
let posts = JSON.parse(localStorage.getItem("dhaakad_posts") || "[]");
let stories = JSON.parse(localStorage.getItem("dhaakad_stories") || "[]");
let username = localStorage.getItem("dhaakad_user") || "DHAAKAD User";

function escapeHTML(str) {
 return str.replace(/[&<>'"]/g, tag => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
 }[tag]));
}

function showPage(id, btn) {
 document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 if (btn) {
  document.querySelectorAll(".bottom button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
 }
}

function savePosts() {
 try {
  localStorage.setItem("dhaakad_posts", JSON.stringify(posts));
  return true;
 } catch (e) {
  alert("Storage full ho gaya hai! Purani posts delete karein ya chhoti file chunein.");
  return false;
 }
}

function createPost() {
 let fileInput = document.getElementById("postFile");
 let file = fileInput.files[0];
 let caption = document.getElementById("caption").value.trim();

 if (!file) { alert("Photo ya video chunein"); return; }
 if (file.size > 2000000) { alert("2 MB se chhoti file chunein"); return; }

 let reader = new FileReader();
 reader.onload = function() {
  posts.unshift({
   id: Date.now(),
   media: reader.result,
   type: file.type.startsWith("video") ? "video" : "image",
   caption: caption,
   liked: false,
   likeCount: 0,
   comments: []
  });
  if (savePosts()) {
   renderPosts();
   fileInput.value = "";
   document.getElementById("caption").value = "";
   showPage("home", document.querySelector(".bottom button"));
  } else {
   posts.shift();
  }
 };
 reader.readAsDataURL(file);
}

function createPostElement(p) {
 let media = p.type === "video"
  ? `<video class="postmedia" src="${p.media}" controls playsinline></video>`
  : `<img class="postmedia" src="${p.media}" alt="post">`;

 let post = document.createElement("article");
 post.className = "post";
 post.innerHTML = `
  <div class="posthead">
   <div class="user-info">
    <div class="avatar">${escapeHTML(username.charAt(0).toUpperCase())}</div>
    <b>${escapeHTML(username)}</b>
   </div>
   <button class="del-btn" onclick="deletePost(${p.id})" title="Delete">🗑</button>
  </div>
  ${media}
  <div class="actions">
   <button class="${p.liked ? 'liked' : ''}" onclick="likePost(${p.id})">${p.liked ? '♥' : '♡'}</button>
   <button onclick="commentPost(${p.id})">💬</button>
   <button onclick="sharePost(${p.id})">↗</button>
  </div>
  <div class="caption">
   <b>${p.likeCount} likes</b><br>
   <span>${escapeHTML(p.caption)}</span>
   <div>${p.comments.map(c => `<p class="comment-item"><b>${escapeHTML(username)}:</b> ${escapeHTML(c)}</p>`).join("")}</div>
  </div>`;
 return post;
}

function renderPosts() {
 let feed = document.getElementById("feed");
 let myPosts = document.getElementById("myPosts");
 let reelFeed = document.getElementById("reelFeed");

 feed.innerHTML = "";
 myPosts.innerHTML = "";
 reelFeed.innerHTML = "";

 document.getElementById("profileStats").textContent = `${posts.length} Posts · 120 Followers · 85 Following`;

 if (posts.length === 0) {
  feed.innerHTML = `<div class="empty-msg">Abhi koi post nahi hai. Niche '+' dabakar pehli post daalein!</div>`;
 }

 let hasReels = false;
 posts.forEach(p => {
  feed.appendChild(createPostElement(p));
  myPosts.appendChild(createPostElement(p));
  if (p.type === "video") {
   reelFeed.appendChild(createPostElement(p));
   hasReels = true;
  }
 });

 if (!hasReels) {
  reelFeed.innerHTML = `<div class="empty-msg">Abhi koi video reel nahi hai.</div>`;
 }
}

function likePost(id) {
 let p = posts.find(x => x.id === id);
 if (!p) return;
 p.liked = !p.liked;
 p.likeCount = (p.likeCount || 0) + (p.liked ? 1 : -1);
 savePosts();
 renderPosts();
}

function commentPost(id) {
 let c = prompt("Comment likhein:");
 if (!c || !c.trim()) return;
 let p = posts.find(x => x.id === id);
 if (!p) return;
 p.comments.push(c.trim());
 savePosts();
 renderPosts();
}

function deletePost(id) {
 if (!confirm("Kya aap is post ko delete karna chahte hain?")) return;
 posts = posts.filter(x => x.id !== id);
 savePosts();
 renderPosts();
}

function sharePost(id) {
 let link = location.href.split("#")[0] + "#post-" + id;
 </script>

</body>
</html>
