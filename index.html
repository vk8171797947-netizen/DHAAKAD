<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>धाकड़ (Dhaakad) — इंस्टाग्राम-स्टाइल सोशल ऐप</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .dhaakad-gradient {
      background: linear-gradient(135deg, #e11d48 0%, #f97316 55%, #facc15 100%);
    }
    .dhaakad-ring {
      background: linear-gradient(45deg, #facc15, #f97316, #e11d48, #c026d3);
      padding: 2.5px;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .filter-none { filter: none; }
    .filter-clarendon { filter: contrast(1.2) saturate(1.25); }
    .filter-warm { filter: sepia(0.28) saturate(1.35) brightness(1.04); }
    .filter-vivid { filter: saturate(1.6) contrast(1.12); }
    .filter-vintage { filter: sepia(0.45) contrast(0.92) brightness(0.95); }
    .filter-noir { filter: grayscale(1) contrast(1.3); }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      35% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0; }
    }
    .heart-burst {
      animation: heartPop 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <div id="app" class="min-h-screen flex flex-col lg:flex-row">
    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex flex-col justify-between w-64 fixed top-0 left-0 bottom-0 bg-zinc-950 border-r border-zinc-800/80 px-5 py-6 z-30">
      <div>
        <button onclick="switchTab('home')" class="flex items-center gap-3 mb-8 text-left group">
          <div class="w-10 h-10 rounded-2xl dhaakad-gradient flex items-center justify-center shadow-lg shadow-rose-600/20 group-hover:scale-105 transition">
            <span class="text-xl font-extrabold text-white">ध</span>
          </div>
          <div>
            <div class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-rose-400 via-orange-400 to-amber-300 bg-clip-text text-transparent">
              धाकड़
            </div>
            <div class="text-[11px] text-zinc-400">DHAAKAD SOCIAL</div>
          </div>
        </button>

        <nav class="space-y-1.5" id="desktopNav"></nav>
      </div>

      <button onclick="openEditProfile()" class="flex items-center gap-3 p-2.5 rounded-2xl bg-zinc-900/80 hover:bg-zinc-900 border border-zinc-800 transition text-left w-full">
        <div id="sidebarAvatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shrink-0">ध</div>
        <div class="min-w-0 flex-1">
          <div id="sidebarName" class="text-sm font-bold truncate">वीर धाकड़</div>
          <div id="sidebarHandle" class="text-xs text-zinc-400 truncate">@veer_dhaakad</div>
        </div>
      </button>
    </aside>

    <!-- Mobile Top Bar -->
    <header class="lg:hidden sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 flex items-center justify-between">
      <button onclick="switchTab('home')" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl dhaakad-gradient flex items-center justify-center font-extrabold text-white">ध</div>
        <span class="text-lg font-extrabold bg-gradient-to-r from-rose-400 via-orange-400 to-amber-300 bg-clip-text text-transparent">धाकड़</span>
      </button>
      <div class="flex items-center gap-2">
        <button onclick="openCreatePost()" class="px-3 py-1.5 rounded-full dhaakad-gradient text-xs font-bold text-white shadow">
          + नई पोस्ट
        </button>
        <button onclick="switchTab('messages')" class="relative p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-200">
          <span>💬</span>
          <span id="mobileUnreadDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 lg:pl-64 pb-20 lg:pb-8">
      <div id="mainContainer" class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6"></div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav id="mobileNav" class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800/80 px-2 py-1.5 flex items-center justify-around"></nav>
  </div>
      <!-- Story Viewer Modal -->
  <div id="storyModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-3">
    <div class="relative w-full max-w-md h-[84vh] max-h-[760px] rounded-3xl overflow-hidden bg-zinc-900 border border-zinc-800 flex flex-col justify-between shadow-2xl">
      <div class="absolute top-0 left-0 right-0 z-20 p-3 bg-gradient-to-b from-black/80 to-transparent">
        <div id="storyProgressBars" class="flex gap-1.5 mb-3"></div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div id="storyAuthorAvatar" class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm text-white"></div>
            <div>
              <div id="storyAuthorName" class="text-sm font-bold text-white"></div>
              <div id="storyTime" class="text-[11px] text-zinc-300">अभी-अभी</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleStoryPause()" id="storyPauseBtn" class="px-2.5 py-1 rounded-full bg-white/15 text-xs font-semibold text-white">⏸ पॉज़</button>
            <button onclick="closeStoryViewer()" class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center text-white font-bold">✕</button>
          </div>
        </div>
      </div>

      <div onclick="handleStoryTap(event)" class="relative flex-1 flex items-center justify-center select-none cursor-pointer">
        <img id="storyImage" src="" alt="Story" class="w-full h-full object-cover" />
        <div id="storyCaptionOverlay" class="hidden absolute bottom-20 left-4 right-4 bg-black/60 backdrop-blur-sm px-4 py-2.5 rounded-2xl text-center text-sm font-semibold text-white"></div>
      </div>

      <div class="p-3 bg-gradient-to-t from-black/90 via-black/60 to-transparent z-20">
        <form onsubmit="sendStoryReply(event)" class="flex gap-2">
          <input id="storyReplyInput" type="text" placeholder="स्टोरी पर रिप्लाई भेजें..." class="flex-1 bg-zinc-900/90 border border-zinc-700 rounded-full px-4 py-2 text-sm text-white placeholder-zinc-400 focus:outline-none focus:border-rose-500" />
          <button type="submit" class="px-4 py-2 rounded-full dhaakad-gradient text-sm font-bold text-white">भेजें</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Create Post / Story Modal -->
  <div id="createModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">

      <div class="flex items-center justify-between mb-4">
        <div class="flex gap-2">
          <button type="button" onclick="setCreateMode('post')" id="modePostBtn" class="px-3.5 py-1.5 rounded-full text-xs font-bold dhaakad-gradient text-white">नई पोस्ट</button>
          <button type="button" onclick="setCreateMode('story')" id="modeStoryBtn" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-zinc-800 text-zinc-300">नई स्टोरी</button>
        </div>
        <button onclick="closeCreateModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-300 font-bold">✕</button>
      </div>

      <form onsubmit="submitNewCreation(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-2">गैलरी से फ़ोटो चुनें या प्रीसेट चुनें</label>
          <div class="flex flex-wrap items-center gap-2 mb-2.5">
            <label class="cursor-pointer px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-bold text-rose-300 border border-zinc-700 transition">
              📁 फ़ोन/कंप्यूटर से फ़ोटो चुनें
              <input type="file" accept="image/*" onchange="handleFileUpload(event)" class="hidden" />
            </label>
            <button type="button" onclick="applyPresetPhoto(0)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🌄 पहाड़</button>
            <button type="button" onclick="applyPresetPhoto(1)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🏙️ शहर की रात</button>
            <button type="button" onclick="applyPresetPhoto(2)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">🏋️ फिटनेस</button>
            <button type="button" onclick="applyPresetPhoto(3)" class="px-2.5 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 text-xs text-zinc-200">☕ कैफ़े</button>
          </div>
        </div>

        <div class="relative aspect-square max-h-72 w-full rounded-2xl overflow-hidden bg-zinc-950 border border-zinc-800 flex items-center justify-center">
          <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover filter-none transition duration-200" />
        </div>

        <div id="filterSection">
          <label class="block text-xs font-semibold text-zinc-400 mb-2">फ़ोटो फ़िल्टर लगाएं</label>
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="filterButtons"></div>
        </div>

        <div id="postExtraFields" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">लोकेशन</label>
            <input id="newPostLocation" type="text" placeholder="जैसे: आगरा, जयपुर, मुंबई" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">कैटेगरी / हैशटैग</label>
            <input id="newPostTag" type="text" placeholder="#धाकड़स्वैग #लाइफ़स्टाइल" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">कैप्शन लिखें</label>
          <textarea id="newPostCaption" rows="2" placeholder="आज का धाकड़ अपडेट या विचार लिखें..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500"></textarea>
        </div>

        <button type="submit" id="publishBtn" class="w-full py-3 rounded-2xl dhaakad-gradient font-extrabold text-sm text-white shadow-lg shadow-rose-600/25 hover:opacity-95 transition">
          अभी पब्लिश करें
        </button>
      </form>
    </div>
  </div>
      <!-- Edit Profile Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

        <div>

        <div>

        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">धाकड़ बायो</label>
          <textarea id="editBio" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500"></textarea>
        </div>
        <div>

        </div>

          प्रोफ़ाइल सेव करें
        </button>
      </form>
    </div>
  </div>

  </div>

      document.getElementById('storyAuthorName').textContent = st.author;

        capEl.classList.add('hidden');

      const bars = document.getElementById('storyProgressBars');
      bars.innerHTML = state.stories.map((_, i) => {
        let pct = 0;
        if (i < currentStoryIndex) pct = 100;
        else if (i === currentStoryIndex) pct = storyProgress;
        return `

      clearInterval(storyTimer);
      storyTimer = setInterval(() => {
        if (storyPaused) return;
        storyProgress += 2;
        if (storyProgress >= 100) {
          storyProgress = 0;
          if (currentStoryIndex < state.stories.length - 1) {
            currentStoryIndex += 1;
            showCurrentStory();
          } else {
            closeStoryViewer();
          }
        } else {
          showCurrentStory();
        }

          function renderNpGalleryGrid() {
      const grid = document.getElementById('npPicGrid');
      if (!grid) return;

      const camTile = `
        <button type="button" id="npTileCam" style="aspect-ratio:1/1;border-radius:14px;background:#18181b;border:1.5px dashed #f97316;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:12px;font-weight:800;">
          <span style="font-size:26px;">📷</span>
          <span>कैमरा</span>
        </button>
      `;

      const itemsHtml = GALLERY_ITEMS.map((g) => {
        const active = chosenMedia === g.src;
        return `
          <button type="button" class="np-gitem" data-src="${g.src}" style="aspect-ratio:1/1;border-radius:14px;overflow:hidden;padding:0;background:#18181b;border:${active ? '2.5px solid #f43f5e' : '1px solid #27272a'};cursor:pointer;">
            <img src="${g.src}" alt="${g.title}" style="width:100%;height:100%;object-fit:cover;display:block;" />
          </button>
        `;
      }).join('');

      grid.innerHTML = camTile + itemsHtml;
      document.getElementById('npTileCam').addEventListener('click', showCameraInsideNewPost);
      grid.querySelectorAll('.np-gitem').forEach((btn) => {
        btn.addEventListener('click', () => {
          setChosenMedia(btn.getAttribute('data-src'));
        });
      });
    }

    function setChosenMedia(src) {
      if (!src) return;
      chosenMedia = src;
      const prev = document.getElementById('npPreviewImg');
      if (prev) {
        prev.src = chosenMedia;
        prev.style.filter = activeFilter;
      }
      renderNpGalleryGrid();
    }

    function renderNpFilterBubbles() {
      const row = document.getElementById('npFilterBubbles');
      if (!row) return;
      row.innerHTML = STUDIO_FILTERS.map((f, idx) => {
        const active = activeFilter === f.css;
        return `
          <button type="button" data-f="${idx}" class="np-fb" style="width:40px;height:40px;border-radius:999px;background:rgba(24,24,27,0.85);border:${active ? '2.5px solid #f43f5e' : '1.5px solid rgba(255,255,255,0.3)'};color:#fff;font-size:16px;cursor:pointer;">
            ${f.badge}
          </button>
        `;
      }).join('');

      row.querySelectorAll('.np-fb').forEach((btn) => {
        btn.addEventListener('click', () => {
          const item = STUDIO_FILTERS[Number(btn.getAttribute('data-f'))] || STUDIO_FILTERS[0];
          activeFilter = item.css;
          const vid = document.getElementById('npVideo');
          const shot = document.getElementById('npShotImg');
          const prev = document.getElementById('npPreviewImg');
          if (vid) vid.style.filter = activeFilter;
          if (shot) shot.style.filter = activeFilter;
          if (prev) prev.style.filter = activeFilter;
          renderNpFilterBubbles();
        });
      });
    }

    function setNpMode(mode) {
      activeTabMode = mode;
      const titles = {
        POST: 'नई पोस्ट',
        STORY: 'नई पोस्ट • स्टोरी',
        REEL: 'नई पोस्ट • रील',
        LIVE: 'नई पोस्ट • लाइव'
      };
      const head = document.getElementById('npHeading');
      if (head) head.textContent = titles[mode] || 'नई पोस्ट';

      document.querySelectorAll('.np-mode').forEach((b) => {
        const isAct = b.getAttribute('data-mode') === mode;
        b.style.color = isAct ? '#ffffff' : 'rgba(255,255,255,0.5)';
        b.style.borderBottom = isAct ? '2px solid #f43f5e' : 'none';
      });

      if (mode === 'REEL' || mode === 'STORY' || mode === 'LIVE') {
        showCameraInsideNewPost();
      }
    }

    function cycleNpAudio() {
      const idx = AUDIO_LIST.indexOf(activeAudio);
      activeAudio = AUDIO_LIST[(idx + 1) % AUDIO_LIST.length];
      const pill = document.getElementById('npAudioPill');
      if (pill) pill.textContent = activeAudio;
    }

    function bindNpEvents() {
      document.getElementById('npCloseBtn').addEventListener('click', closeNewPostStudio);
      document.getElementById('npPublishBtn').addEventListener('click', publishNewPostStudio);
      document.getElementById('npOpenCamViewBtn').addEventListener('click', showCameraInsideNewPost);
      document.getElementById('npBackToGalleryBtn').addEventListener('click', showGalleryInsideNewPost);
      document.getElementById('npMiniGallery').addEventListener('click', showGalleryInsideNewPost);

      document.getElementById('npFileInput').addEventListener('change', (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => setChosenMedia(e.target.result);
        reader.readAsDataURL(file);
      });

      document.getElementById('npMuteBtn').addEventListener('click', () => {
        mutedState = !mutedState;
        if (stream) stream.getAudioTracks().forEach((t) => (t.enabled = !mutedState));
        document.getElementById('npMuteBtn').textContent = mutedState ? '🔇 म्यूट' : '🎙️ ऑन';
      });

      document.getElementById('npSpeedBtn').addEventListener('click', () => {
        const list = ['0.5x', '1x', '2x'];
        speedVal = list[(list.indexOf(speedVal) + 1) % list.length];
        document.getElementById('npSpeedBtn').textContent = speedVal;
      });

      document.getElementById('npTimerBtn').addEventListener('click', () => {
        const list = [0, 3, 10];
        timerSec = list[(list.indexOf(timerSec) + 1) % list.length];
        document.getElementById('npTimerBtn').textContent = timerSec ? `⏱️ ${timerSec}s` : '⏱️ ऑफ';
      });

      document.getElementById('npAudioPill').addEventListener('click', cycleNpAudio);
      document.getElementById('npSideAudio').addEventListener('click', cycleNpAudio);

      document.getElementById('npSideFx').addEventListener('click', () => {
        const next = STUDIO_FILTERS[(STUDIO_FILTERS.findIndex((f) => f.css === activeFilter) + 1) % STUDIO_FILTERS.length];
        activeFilter = next.css;
        document.getElementById('npVideo').style.filter = activeFilter;
        renderNpFilterBubbles();
      });

      document.getElementById('npSideFrame').addEventListener('click', () => {
        const vid = document.getElementById('npVideo');
        vid.style.borderRadius = vid.style.borderRadius === '24px' ? '0px' : '24px';
      });

      document.getElementById('npSideWand').addEventListener('click', () => {
        activeFilter = 'brightness(1.14) contrast(1.08) saturate(1.25)';
        document.getElementById('npVideo').style.filter = activeFilter;
        renderNpFilterBubbles();
      });

      document.getElementById('npSide15').addEventListener('click', () => {
        setNpMode('REEL');
      });

      document.getElementById('npFlipCam').addEventListener('click', async () => {
        facingMode = facingMode === 'user' ? 'environment' : 'user';
        await startNpCam();
      });

      document.getElementById('npShutter').addEventListener('click', () => {
        if (timerSec > 0) {
          runNpCountdown(timerSec, snapNpPhoto);
        } else {
          snapNpPhoto();
        }
      });

      document.getElementById('npUseShotBtn').addEventListener('click', () => {
        const shot = document.getElementById('npShotImg');
        if (shot && shot.style.display === 'none') snapNpPhoto();
        if (shot && shot.src) setChosenMedia(shot.src);
        showGalleryInsideNewPost();
      });

      document.querySelectorAll('.np-mode').forEach((btn) => {
        btn.addEventListener('click', () => setNpMode(btn.getAttribute('data-mode')));
      });
    }

    function runNpCountdown(sec, cb) {
      const el = document.getElementById('npCountdown');
      let count = sec;
      el.style.display = 'block';
      el.textContent = count;
      const timer = setInterval(() => {
        count -= 1;
        if (count > 0) {
          el.textContent = count;
        } else {
          clearInterval(timer);
          el.style.display = 'none';
          cb();
        }
      }, 1000);
    }

    function snapNpPhoto() {
      const vid = document.getElementById('npVideo');
      const canvas = document.getElementById('npCanvas');
      const shot = document.getElementById('npShotImg');
      if (!vid || !canvas || !shot) return;

      if (vid.videoWidth && vid.videoHeight) {
        canvas.width = vid.videoWidth;
        canvas.height = vid.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.filter = activeFilter === 'none' ? 'none' : activeFilter;
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        shot.src = canvas.toDataURL('image/jpeg', 0.9);
      } else {
        shot.src = chosenMedia;
      }
      shot.style.filter = activeFilter;
      shot.style.display = 'block';
    }

    async function showCameraInsideNewPost() {
      document.getElementById('npGalleryView').style.display = 'none';
      document.getElementById('npCamView').style.display = 'block';
      const shot = document.getElementById('npShotImg');
      if (shot) shot.style.display = 'none';
      await startNpCam();
    }

    function showGalleryInsideNewPost() {
      stopNpCam();
      document.getElementById('npCamView').style.display = 'none';
      document.getElementById('npGalleryView').style.display = 'block';
    }

    async function startNpCam() {
      stopNpCam();
      const vid = document.getElementById('npVideo');
      if (!vid) return;
      vid.style.filter = activeFilter;
      vid.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode },
          audio: !mutedState
        });
        vid.srcObject = stream;
      } catch (e) {
        console.warn('Camera stream info:', e);
      }
    }

    function stopNpCam() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    function publishNewPostStudio() {
      const shot = document.getElementById('npShotImg');
      const camVisible = document.getElementById('npCamView').style.display !== 'none';
      if (camVisible && shot && shot.style.display !== 'none' && shot.src) {
        chosenMedia = shot.src;
      }

      const capInput = document.getElementById('npCaption');
      const audioNote = activeAudio ? ` • ${activeAudio}` : '';
      const captionText =
        (capInput && capInput.value.trim()) || `धाकड़ ${activeTabMode} (${speedVal})${audioNote} 🔥`;

      try {
        if (window.state) {
          const prof = window.state.profile || {};
          const author = prof.name || 'वीर धाकड़';
          const handle = prof.handle || '@veer_dhaakad';
          const avatarColor = prof.avatarColor || 'from-rose-600 to-orange-500';
          const initial = author.trim().charAt(0).toUpperCase() || 'ध';

          if (activeTabMode === 'STORY' && Array.isArray(window.state.stories)) {
            window.state.stories.unshift({
              id: 'st_' + Date.now(),
              author,
              handle,
              avatarInitial: initial,
              avatarColor,
              image: chosenMedia,
              caption: captionText,
              time: 'अभी-अभी',
              seen: false
            });
          } else if (activeTabMode === 'REEL' && Array.isArray(window.state.reels)) {
            window.state.reels.unshift({
              id: 'r_' + Date.now(),
              title: captionText,
              creator: author,
              handle,
              views: '1',
              likes: 1,
              liked: true,
              image: chosenMedia,
              badge: 'नया रील'
            });
          } else if (Array.isArray(window.state.posts)) {
            window.state.posts.unshift({
              id: 'p_' + Date.now(),
              author,
              handle,
              avatarInitial: initial,
              avatarColor,
              location: prof.city || 'भारत',
              image: chosenMedia,
              filter: 'filter-none',
              caption: activeTabMode === 'LIVE' ? '🔴 LIVE: ' + captionText : captionText,
              tags: '#धाकड़स्वैग',
              time: 'अभी-अभी',
              likes: 1,
              liked: true,
              comments: []
            });
          }
          if (typeof window.saveState === 'function') window.saveState();
          if (typeof window.switchTab === 'function') {
            window.switchTab(activeTabMode === 'REEL' ? 'reels' : 'home');
          } else if (typeof window.renderAll === 'function') {
            window.renderAll();
          }
        }
      } catch (err) {
        console.warn('Publish info:', err);
      }

      if (capInput) capInput.value = '';
      closeNewPostStudio();
    }

    function openNewPostStudio() {
      buildNewPostStudio();
      setNpMode('POST');
      showGalleryInsideNewPost();
      document.getElementById(NP_MODAL_ID).style.display = 'flex';
    }

    function closeNewPostStudio() {
      stopNpCam();
      const el = document.getElementById(NP_MODAL_ID);
      if (el) el.style.display = 'none';
    }

    document.addEventListener(
      'click',
      (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.closest(`#${NP_MODAL_ID}`)) return;
        const text = (btn.textContent || '').trim();
        if (text.includes('नई पोस्ट') || text === 'पोस्ट') {
          e.preventDefault();
          e.stopPropagation();
          openNewPostStudio();
        }
      },
      true
    );
  })();
</script>

        <!-- Overlays on Video (Text, Sticker, Captions) -->
        <div style="position:relative;z-index:12;pointer-events:none;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;gap:12px;">
          <div id="dpeStickerLayer" style="display:none;font-size:56px;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.7));"></div>
          <div id="dpeTextLayer" style="display:none;background:rgba(0,0,0,0.65);padding:8px 16px;border-radius:14px;font-size:20px;font-weight:800;color:#fff;max-width:85%;"></div>
          <div id="dpeCaptionLayer" style="display:none;background:rgba(24,24,27,0.85);border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:#fde047;"></div>
        </div>

        <!-- Bottom Tool Bar + Open in Edits + Next -> -->
        <div style="position:relative;z-index:15;padding:12px 14px 18px;background:linear-gradient(to top,rgba(0,0,0,0.92),rgba(0,0,0,0.55),transparent);">
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:460px;margin:0 auto 14px;">
            <button type="button" id="dpeToolAudio" style="background:rgba(39,39,42,0.82);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;">
              <span style="font-size:18px;">🎵</span>
              <span>Audio</span>
            </button>

            <button type="button" id="dpeToolText" style="background:rgba(39,39,42,0.82);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;">
              <span style="font-size:18px;font-weight:800;">Aa</span>
              <span>Text</span>
            </button>

            <button type="button" id="dpeToolVoice" style="background:rgba(39,39,42,0.82);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;">
              <span style="font-size:18px;">🎙️</span>
              <span>Voice</span>
            </button>

            <button type="button" id="dpeToolCaptions" style="background:rgba(39,39,42,0.82);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;">
              <span style="font-size:16px;font-weight:900;">CC</span>
              <span>Captions</span>
            </button>

            <button type="button" id="dpeToolStickers" style="background:rgba(39,39,42,0.82);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:10px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;">
              <span style="font-size:18px;">☺</span>
              <span>Stickers</span>
            </button>
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:460px;margin:0 auto;">
            <button type="button" id="dpeOpenEditsBtn" style="background:rgba(39,39,42,0.92);border:1px solid rgba(255,255,255,0.18);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;">
              <span>CI</span>
              <span>Open in Edits</span>
            </button>

            <button type="button" id="dpeNextBtn" style="background:#4f46e5;border:none;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;">
              Next →
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(wrap);
      bindPostEditorActions();
    }

    function updateOverlayDisplay() {
      const stEl = document.getElementById('dpeStickerLayer');
      const txEl = document.getElementById('dpeTextLayer');
      const cpEl = document.getElementById('dpeCaptionLayer');
      const pill = document.getElementById('dpeStatusPill');

      if (stEl) {
        stEl.textContent = editState.sticker;
        stEl.style.display = editState.sticker ? 'block' : 'none';
      }
      if (txEl) {
        txEl.textContent = editState.textOverlay;
        txEl.style.display = editState.textOverlay ? 'block' : 'none';
      }
      if (cpEl) {
        cpEl.textContent = editState.captionText;
        cpEl.style.display = editState.captionText ? 'block' : 'none';
      }

      const tags = [];
      if (editState.audio) tags.push(editState.audio);
      if (editState.voiceNote) tags.push(editState.voiceNote);
      if (pill) {
        pill.textContent = tags.join(' • ');
        pill.style.display = tags.length ? 'block' : 'none';
      }
    }

    function bindPostEditorActions() {
      document.getElementById('dpeBackBtn').addEventListener('click', () => {
        closePostEditor();
      });

      const audioTracks = [
        '🎵 धाकड़ बीट',
        '🎶 देसी वाइब',
        '🔥 जोश ट्रैक',
        '✨ चिल म्यूज़िक'
      ];
      document.getElementById('dpeToolAudio').addEventListener('click', () => {
        const nextIdx = (audioTracks.indexOf(editState.audio) + 1) % audioTracks.length;
        editState.audio = audioTracks[nextIdx];
        updateOverlayDisplay();
      });

      document.getElementById('dpeToolText').addEventListener('click', () => {
        const val = prompt('वीडियो पर लिखने के लिए टेक्स्ट डालें:', editState.textOverlay || 'धाकड़ रील 🔥');
        if (val !== null) {
          editState.textOverlay = val.trim();
          updateOverlayDisplay();
        }
      });

      document.getElementById('dpeToolVoice').addEventListener('click', () => {
        editState.voiceNote = editState.voiceNote ? '' : '🎙️ वॉइस ओवर जुड़ा';
        updateOverlayDisplay();
      });

      const sampleCaptions = [
        '💬 धाकड़ मोमेंट — फुल एनर्जी!',
        '💬 आज का सबसे बेस्ट शॉट 🔥',
        '💬 स्टाइल और स्वैग दोनों साथ'
      ];
      document.getElementById('dpeToolCaptions').addEventListener('click', () => {
        const nextIdx = (sampleCaptions.indexOf(editState.captionText) + 1) % sampleCaptions.length;
        editState.captionText = sampleCaptions[nextIdx];
        updateOverlayDisplay();
      });

      const stickers = ['🔥', '😎', '👑', '⚡', '❤️'];
      document.getElementById('dpeToolStickers').addEventListener('click', () => {
        const nextIdx = (stickers.indexOf(editState.sticker) + 1) % stickers.length;
        editState.sticker = stickers[nextIdx];
        updateOverlayDisplay();
      });

      document.getElementById('dpeOpenEditsBtn').addEventListener('click', () => {
        const filters = [
          'none',
          'saturate(1.65) contrast(1.15)',
          'sepia(0.32) saturate(1.35) brightness(1.05)',
          'grayscale(1) contrast(1.35)'
        ];
        const idx = filters.indexOf(editState.filterCss);
        editState.filterCss = filters[(idx + 1) % filters.length];
        const vid = document.getElementById('dpeVideo');
        if (vid) vid.style.filter = editState.filterCss;
      });

      document.getElementById('dpeNextBtn').addEventListener('click', () => {
        saveEditedVideoToApp();
        closePostEditor();
      });
    }

    function saveEditedVideoToApp() {
      const summaryParts = [
        editState.textOverlay,
        editState.captionText,
        editState.sticker,
        editState.audio,
        editState.voiceNote
      ].filter(Boolean);
      const finalTitle = summaryParts.length ? summaryParts.join(' ') : 'नई धाकड़ वीडियो रील 🔥';

      try {
        if (window.state) {
          const prof = window.state.profile || {};
          const author = prof.name || 'वीर धाकड़';
          const handle = prof.handle || '@veer_dhaakad';
          const avatarColor = prof.avatarColor || 'from-rose-600 to-orange-500';
          const initial = author.trim().charAt(0).toUpperCase() || 'ध';

          if (Array.isArray(window.state.reels)) {
            window.state.reels.unshift({
              id: 'r_' + Date.now(),
              title: finalTitle,
              creator: author,
              handle,
              views: '1',
              likes: 1,
              liked: true,
              image:
                window.__dhaakadLastShotImg ||
                'data:image/svg+xml;charset=UTF-8,' +
                  encodeURIComponent(
                    `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900"><rect width="600" height="900" fill="#18181b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="32" font-weight="bold">DHAAKAD REEL</text></svg>`
                  ),
              videoUrl: editState.videoUrl || window.__dhaakadLastRecordedVideo || '',
              badge: 'एडिटेड रील'
            });
          }

          if (typeof window.saveState === 'function') window.saveState();
          if (typeof window.switchTab === 'function') window.switchTab('reels');
          else if (typeof window.renderAll === 'function') window.renderAll();
        }
      } catch (err) {
        console.warn('Save edited video note:', err);
      }
    }

    function openPostEditor(videoSrc) {
      ensurePostEditorDom();
      editState.videoUrl = videoSrc || window.__dhaakadLastRecordedVideo || '';
      const vid = document.getElementById('dpeVideo');
      if (vid) {
        if (editState.videoUrl) {
          vid.src = editState.videoUrl;
          vid.play().catch(() => {});
        } else {
          const camVid = document.getElementById('npVideo');
          if (camVid && camVid.srcObject) vid.srcObject = camVid.srcObject;
        }
        vid.style.filter = editState.filterCss;
      }
      updateOverlayDisplay();
      document.getElementById(POST_EDIT_ID).style.display = 'flex';
    }

    function closePostEditor() {
      const el = document.getElementById(POST_EDIT_ID);
      if (el) el.style.display = 'none';
    }

    // रिकॉर्डिंग समाप्त होते ही या शटर/चुनें/पब्लिश पर एडिट स्क्रीन दिखाना
    function hookVideoFinish() {
      const shutter = document.getElementById('npShutter');
      if (shutter && !shutter.dataset.dpeBound) {
        shutter.dataset.dpeBound = '1';
        shutter.addEventListener('click', () => {
          setTimeout(() => {
            const pv = document.getElementById('npRecVideoPreview');
            const recVidSrc = (pv && pv.src && pv.src.startsWith('blob:')) ? pv.src : window.__dhaakadLastRecordedVideo;
            if (recVidSrc) {
              openPostEditor(recVidSrc);
            }
          }, 900);
        });
      }
    }

    const obs = new MutationObserver(() => {
      if (document.getElementById('npShutter')) hookVideoFinish();
    });
    obs.observe(document.body, { childList: true, subtree: true });
  })();
  </script>
  <script>
(function () {
  let mediaRecorder = null;
  let chunks = [];
  let isRecording = false;

  function findRecordButton() {
    const candidates = Array.from(document.querySelectorAll("button, div, span, a"));
    return candidates.find((el) => {
      const rect = el.getBoundingClientRect();
      const style = window.getComputedStyle(el);
      const isBigCircle = rect.width >= 55 && rect.width <= 110 && Math.abs(rect.width - rect.height) < 15;
      const isBottomCenter = rect.top > window.innerHeight * 0.65 && Math.abs(rect.left + rect.width / 2 - window.innerWidth / 2) < 90;
      const isWhiteBg = style.backgroundColor.includes("255, 255, 255");
      return isBigCircle && isBottomCenter && isWhiteBg;
    });
  }

  function getActiveStream() {
    const vid = document.querySelector("video");
    if (vid && vid.srcObject && vid.srcObject.active) return vid.srcObject;
    return window.cameraStream || window.stream || null;
  }

  function toggleRecording(btn) {
    if (!isRecording) {
      const stream = getActiveStream();
      if (!stream) {
        alert("कैमरा स्ट्रीम नहीं मिला। पहले कैमरा ऑन करें।");
        return;
      }
      chunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream);
      } catch (err) {
        alert("रिकॉर्डर शुरू नहीं हो पाया: " + err.message);
        return;
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "video/webm" });
        window.recordedReelBlob = blob;
        window.recordedReelUrl = URL.createObjectURL(blob);
        alert("रील रिकॉर्ड हो गई! साइज़: " + (blob.size / 1024 / 1024).toFixed(2) + " MB");
      };

      mediaRecorder.start();
      isRecording = true;
      btn.style.outline = "4px solid #ff2e4d";
      btn.style.transform = "scale(0.92)";
    } else {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      isRecording = false;
      btn.style.outline = "";
      btn.style.transform = "";
    }
  }

  window.addEventListener("load", () => {
    const btn = findRecordButton();
    if (!btn) {
      console.warn("सफ़ेद रिकॉर्ड बटन नहीं मिला");
      return;
    }
    btn.style.zIndex = "50";
    btn.style.pointerEvents = "auto";
    btn.addEventListener("click", () => toggleRecording(btn));
  });
})();
  </script>
