<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-container">
            <h2 class="logo">Instagram</h2>
            <input type="text" placeholder="Search" class="search-bar">
            <div class="nav-icons">
                <i class="fa-solid fa-house"></i>
                <i class="fa-regular fa-paper-plane"></i>
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-regular fa-compass"></i>
                <i class="fa-regular fa-heart"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Feed Section -->
        <div class="feed">
            <!-- Stories -->
            <div class="stories">
                <div class="story-circle"><div class="inner-circle"></div><span>Your Story</span></div>
                <div class="story-circle"><div class="inner-circle"></div><span>user_1</span></div>
                <div class="story-circle"><div class="inner-circle"></div><span>user_2</span></div>
                <div class="story-circle"><div class="inner-circle"></div><span>user_3</span></div>
            </div>

            <!-- Post -->
            <div class="post">
                <div class="post-header">
                    <span class="username">coding_page</span>
                </div>
                <div class="post-img">
                    <div class="placeholder-img">Post Image Here</div>
                </div>
                <div class="post-footer">
                    <div class="post-icons">
                        <i class="fa-regular fa-heart"></i>
                        <i class="fa-regular fa-comment"></i>
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <p class="likes">1,245 likes</p>
                    <p class="caption"><b>coding_page</b> Learning web development is fun!</p>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="profile-section">
                <div class="mini-profile"></div>
                <div>
                    <p class="user-id">my_username</p>
                    <p class="user-name">Welcome User</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
