<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>DHAAKAD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:70px;
}
header{
 height:58px;
 background:#080808;
 border-bottom:1px solid #292929;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 position:sticky;
 top:0;
 z-index:10;
}
.logo{
 color:#ff6500;
 font-size:25px;
 font-weight:900;
 letter-spacing:1px;
}
button{cursor:pointer}
.topbtn{
 background:none;
 border:0;
 color:white;
 font-size:23px;
 margin-left:10px;
}
.stories{
 display:flex;
 gap:14px;
 overflow-x:auto;
 padding:15px 10px;
 border-bottom:1px solid #292929;
}
.story{
 min-width:68px;
 text-align:center;
 font-size:12px;
 cursor:pointer;
}
.story img, .story video{
 width:60px;
 height:60px;
 border-radius:50%;
 object-fit:cover;
 padding:3px;
 border:3px solid #ff6500;
 display:block;
 margin:0 auto 4px;
}
.story-add{
 width:60px;
 height:60px;
 border-radius:50%;
 border:2px dashed #ff6500;
 color:#ff6500;
 font-size:32px;
 display:grid;
 place-items:center;
 margin:0 auto 4px;
}
.post{
 border-bottom:8px solid #171717;
}
.posthead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
}
.user-info{
 display:flex;
 align-items:center;
 gap:10px;
}
.avatar{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#ff6500;
 display:grid;
 place-items:center;
 font-weight:bold;
 text-transform:uppercase;
}
.delete-btn{
 background:none;
 border:0;
 color:#888;
 font-size:18px;
}
.delete-btn:hover{color:#ff4444}
.postmedia{
 width:100%;
 max-height:550px;
 object-fit:contain;
 background:#000;
 display:block;
}
.actions{
 display:flex;
 gap:20px;
 padding:10px 13px;
}
.actions button{
 background:none;
 border:0;
 color:white;
 font-size:24px;
 padding:0;
}
.actions button.liked{
 color:#ff3b30;
}
.caption{padding:0 13px 14px; line-height:1.4;}
.comments-list p{
 margin:4px 0;
 font-size:14px;
 color:#ccc;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:62px;
 background:#080808;
 border-top:1px solid #292929;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:20;
}
.bottom button{
 background:none;
 border:0;
 color:white;
 font-size:24px;
}
.bottom button.active{color:#ff6500}
.page{display:none}
.page.active{display:block}
.panel{padding:18px}
input,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 background:#202020;
 border:1px solid #444;
 border-radius:8px;
 color:white;
 font-size:15px;
}
.primary{
 background:#ff6500;
 color:white;
 border:0;
 border-radius:8px;
 padding:12px 18px;
 font-weight:bold;
 font-size:15px;
}
.empty-msg{
 text-align:center;
 color:#777;
 padding:30px 10px;
}
/* In-App Story Modal */
#storyModal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.95);
 z-index:100;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}
#storyModal .close-modal{
 position:absolute;
 top:15px;
 right:20px;
 background:none;
 border:0;
 color:white;
 font-size:32px;
 z-index:101;
}
#storyContent img, #storyContent video{
 max-width:95vw;
 max-height:85vh;
 border-radius:10px;
}
/* Chat & Notification Items */
.list-item{
 background:#171717;
 padding:12px;
 border-radius:8px;
 margin-bottom:10px;
}
</style>
</head>

<body>

<header>
 <div class="logo">DHAAKAD</div>
 <div>
  <button class="topbtn" onclick="showPage('messages')">✉</button>
  <button class="topbtn" onclick="showPage('notifications')">♡</button>
 </div>
</header>

<section id="home" class="page active">
 <div class="stories" id="stories">
  <div class="story" onclick="addStory()">
   <div class="story-add">＋</div>
   <div>Your Story</div>
  </div>
 </div>
 <div id="feed"></div>
</section>

<section id="search" class="page">
 <div class="panel">
  <h2>Search</h2>
  <input id="searchInput" placeholder="Caption ya post khojein...">
  <div id="searchResults"></div>
 </div>
</section>

<section id="reels" class="page">
 <div class="panel" style="padding-bottom:0"><h2>Reels</h2></div>
 <div id="reelFeed"></div>
</section>

<section id="create" class="page">
 <div class="panel">
  <h2>Create Post</h2>
  <input id="postFile" type="file" accept="image/*,video/*">
  <textarea id="caption" rows="3" placeholder="Apne post ke baare mein likhein..."></textarea>
  <button class="primary" onclick="createPost()">Share Post</button>
 </div>
</section>

<section id="profile" class="page">
 <div class="panel">
  <div style="display:flex;align-items:center;gap:15px;margin-bottom:15px;">
   <div class="avatar" id="profileAvatar" style="width:60px;height:60px;font-size:24px;">D</div>
   <div>
    <h2 id="profileName" style="margin:0 0 5px 0;">DHAAKAD User</h2>
    <p id="profileStats" style="margin:0;color:#aaa;font-size:14px;">0 Posts • 120 Followers • 85 Following</p>
   </div>
  </div>
  <button class="primary" onclick="editProfile()">Edit Profile</button>
 </div>
 <div id="myPosts"></div>
</section>

<section id="messages" class="page">
 <div class="panel">
  <h2>Messages</h2>
  <div id="chatBox" style="max-height:55vh;overflow-y:auto;margin-bottom:10px;"></div>
  <div style="display:flex;gap:8px;">
   <input id="chatInput" placeholder="Message likhein..." style="margin:0;">
   <button class="primary" onclick="sendMessage()">Send</button>
  </div>
 </div>
</section>

<section id="notifications" class="page">
 <div class="panel">
  <h2>Notifications</h2>
  <div id="notifList"></div>
 </div>
</section>

<!-- Fullscreen Story Modal -->
<div id="storyModal">
 <button class="close-modal" onclick="closeStory()">✕</button>
 <div id="storyContent"></div>
</div>

<nav class="bottom">
 <button id="nav-home" class="active" onclick="showPage('home',this)">⌂</button>
 <button id="nav-search" onclick="showPage('search',this)">⌕</button>
 <button id="nav-reels" onclick="showPage('reels',this)">▶</button>
 <button id="nav-create" onclick="showPage('create',this)">＋</button>
 <button id="nav-profile" onclick="showPage('profile',this)">◉</button>
</nav>

<script>
let posts = JSON.parse(localStorage.getItem("dhaakad_posts") || "[]");
let stories = JSON.parse(localStorage.getItem("dhaakad_stories") || "[]");
let notifications = JSON.parse(localStorage.getItem("dhaakad_notifs") || "[]");
let messages = JSON.parse(localStorage.getItem("dhaakad_msgs") || '["DHAAKAD Team: App mein aapka swagat hai!"]');
let username = localStorage.getItem("dhaakad_user") || "DHAAKAD User";

// Safe text helper to prevent XSS
function escapeHTML(str) {
 let div = document.createElement("div");
 div.textContent = str;
 return div.innerHTML;
}

function showPage(id, btn) {
 document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".bottom button").forEach(b => b.classList.remove("active"));
 if (btn) {
  btn.classList.add("active");
 } else {
  let navBtn = document.getElementById("nav-" + id);
  if (navBtn) navBtn.classList.add("active");
 }
}

function saveAll() {
 try {
  localStorage.setItem("dhaakad_posts", JSON.stringify(posts));
  localStorage.setItem("dhaakad_notifs", JSON.stringify(notifications));
 } catch (e) {
  alert("Storage full ho gaya hai! Purani posts delete karein.");
 }
}

function addNotification(text) {
 notifications.unshift(text);
 if (notifications.length > 20) notifications.pop();
 renderNotifications();
}

function createPost() {
 let file = document.getElementById("postFile").files[0];
 let caption = document.getElementById("caption").value.trim();
 if (!file) { alert("Kripya photo ya video chunein"); return; }
 if (file.size > 1500000) { alert("1.5 MB se chhoti file chunein"); return; }

 let reader = new FileReader();
 reader.onload = function() {
  posts.unshift({
   id: Date.now(),
   media: reader.result,
   type: file.type.startsWith("video") ? "video" : "image",
   caption: caption,
   likedByMe: false,
   likeCount: 0,
   comments: []
  });
  saveAll();
  renderPosts();
  document.getElementById("postFile").value = "";
  document.getElementById("caption").value = "";
  showPage("home");
 };
 reader.readAsDataURL(file);
}

function buildPostElement(p) {
 let mediaHTML = p.type === "video"
  ? `<video class="postmedia" src="${p.media}" controls playsinline></video>`
  : `<img class="postmedia" src="${p.media}" alt="Post media">`;

 let post = document.createElement("article");
 post.className = "post";
 post.innerHTML = `
  <div class="posthead">
   <div class="user-info">
    <div class="avatar">${escapeHTML(username.charAt(0))}</div>
    <b>${escapeHTML(username)}</b>
   </div>
   <button class="delete-btn" title="Delete Post" onclick="deletePost(${p.id})">🗑</button>
  </div>
  ${mediaHTML}
  <div class="actions">
   <button class="${p.likedByMe ? 'liked' : ''}" onclick="toggleLike(${p.id})">${p.likedByMe ? '♥' : '♡'}</button>
   <button onclick="commentPost(${p.id})">💬</button>
   <button onclick="sharePost(${p.id})">↗</button>
  </div>
  <div class="caption">
   <b>${p.likeCount} likes</b><br>
   <span>${escapeHTML(p.caption)}</span>
   <div class="comments-list">
    ${p.comments.map(c => `<p><b>${escapeHTML(username)}:</b> ${escapeHTML(c)}</p>`).join("")}
   </div>
  </div>`;
 return post;
}

function renderPosts() {
 let feed = document.getElementById("feed");
 let myPosts = document.getElementById("myPosts");
 let reelFeed = document.getElementById("reelFeed");

 feed.innerHTML = "";
 myPosts.innerHTML = "";
 reelFeed.innerHTML = "";

 document.getElementById("profileStats").textContent = `${posts.length} Posts • 120 Followers • 85 Following`;

 if (posts.length === 0) {
  feed.innerHTML = `<div class="empty-msg">Abhi koi post nahi hai. Neeche '＋' daba kar pehli post daalein!</div>`;
